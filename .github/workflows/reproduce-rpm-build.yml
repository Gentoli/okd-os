name: RPM Build Reproduction

on:
  workflow_dispatch:
    inputs:
      okd_version:
        description: OKD version to build
        required: true
        default: "4.22"
        type: string
      os_version:
        description: CentOS Stream major version
        required: true
        default: "10"
        type: choice
        options:
          - "9"
          - "10"
      run_test:
        description: Install and test the built RPMs
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  prepare-rpm-sources:
    permissions:
      contents: write
      copilot-requests: write
    uses: ./.github/workflows/prepare-rpm-sources.yml
    with:
      targets: '[{"okd_version":"${{ inputs.okd_version }}","os_version":"${{ inputs.os_version }}"}]'

  build-rpms:
    needs: prepare-rpm-sources
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/rpm-build.yml
    with:
      okd_version: ${{ inputs.okd_version }}
      os_version: ${{ inputs.os_version }}
      sig_sources: >-
        ${{ toJSON(fromJSON(needs.prepare-rpm-sources.outputs.sources)[format(
          '{0}/el{1}', inputs.okd_version, inputs.os_version)]) }}
      run_test: ${{ inputs.run_test }}
