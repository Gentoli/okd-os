name: Plan RPM mirror updates

on:
  workflow_call:
    inputs:
      targets:
        description: JSON array of selected OKD version and OS version targets
        required: true
        type: string
    outputs:
      mirrors:
        description: JSON array of selected RPM mirrors requiring synchronization
        value: ${{ jobs.plan.outputs.mirrors }}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      mirrors: ${{ steps.check.outputs.mirrors }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check upstream mirror branches
        id: check
        uses: ./.github/actions/plan-rpm-mirrors
        with:
          repository: ${{ github.repository }}
          targets: ${{ inputs.targets }}
          plan-file: rpms/mirror-plan.json

  sync:
    needs: plan
    if: needs.plan.outputs.mirrors != '[]'
    permissions:
      contents: write
      copilot-requests: write
    uses: ./.github/workflows/sync-rpm-mirror.yml
    with:
      mirrors: ${{ needs.plan.outputs.mirrors }}
