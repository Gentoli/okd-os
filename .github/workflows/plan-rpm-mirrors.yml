name: Plan RPM mirror updates

on:
  push:
    branches:
      - main
    paths:
      - .github/scripts/rpm-mirror-plan.py
      - .github/workflows/plan-rpm-mirrors.yml
      - .github/workflows/sync-rpm-mirror.yml
      - docs/module-patch.md
      - rpms/mirror-plan.json
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      mirrors: ${{ steps.check.outputs.mirrors }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check upstream mirror branches
        id: check
        env:
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          result=$(python3 .github/scripts/rpm-mirror-plan.py \
            --plan rpms/mirror-plan.json \
            --repository "$GH_REPOSITORY")
          mirrors=$(jq -c '[.[] | select(.needs_sync)] | map({mirror_id})' \
            <<< "$result")
          echo "Mirror status: $result"
          echo "mirrors=$mirrors" >> "$GITHUB_OUTPUT"

  dispatch:
    needs: plan
    if: needs.plan.outputs.mirrors != '[]'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch one sync workflow per stale mirror
        uses: actions/github-script@v9
        env:
          MIRRORS: ${{ needs.plan.outputs.mirrors }}
        with:
          script: |
            const mirrors = JSON.parse(process.env.MIRRORS);
            const ref = context.payload.repository.default_branch;
            for (const { mirror_id } of mirrors) {
              core.info(`Dispatching RPM mirror sync: ${mirror_id}`);
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "sync-rpm-mirror.yml",
                ref,
                inputs: { mirror_id },
              });
            }
