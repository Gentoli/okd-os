name: Plan RPM mirror updates

on:
  push:
    branches:
      - main
    paths:
      - .github/actions/plan-rpm-mirrors/action.yml
      - .github/actions/resolve-rpm-sources/action.yml
      - .github/workflows/plan-rpm-mirrors.yml
      - .github/workflows/sync-rpm-mirror.yml
      - .github/prompts/rpm-mirror-maintenance.md
      - docs/module-patch.md
      - rpms/mirror-plan.json
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      okd_version:
        description: OKD version whose RPM mirrors should be checked
        required: true
        type: choice
        options:
          - "4.20"
          - "4.22"
  workflow_call:
    inputs:
      okd_version:
        description: OKD version whose RPM mirrors should be checked
        required: false
        type: string

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check upstream mirror branches
        id: check
        uses: ./.github/actions/plan-rpm-mirrors
        with:
          repository: ${{ github.repository }}
          okd-version: ${{ inputs.okd_version }}
          plan-file: rpms/mirror-plan.json

      - name: Select requested OKD versions
        id: versions
        env:
          MIRRORS: ${{ steps.check.outputs.mirrors }}
          OKD_VERSION: ${{ inputs.okd_version }}
        run: |
          set -euo pipefail
          if [[ -n "$OKD_VERSION" ]] &&
            [[ "$(jq 'length' <<< "$MIRRORS")" != "0" ]]; then
            versions=$(jq -cn --arg version "$OKD_VERSION" '[$version]')
          else
            versions=$(jq -c '[.[].request_version] | unique' \
              <<< "$MIRRORS")
          fi
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  dispatch:
    needs: plan
    if: needs.plan.outputs.versions != '[]'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch one sync workflow per stale mirror
        uses: actions/github-script@v9
        env:
          VERSIONS: ${{ needs.plan.outputs.versions }}
        with:
          script: |
            const versions = JSON.parse(process.env.VERSIONS);
            const ref = context.payload.repository.default_branch;
            for (const okd_version of versions) {
              core.info(`Dispatching RPM mirror sync: ${okd_version}`);
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "sync-rpm-mirror.yml",
                ref,
                inputs: { okd_version },
              });
            }
