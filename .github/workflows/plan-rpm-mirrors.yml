name: Plan RPM mirror updates

on:
  push:
    branches:
      - main
    paths:
      - .github/scripts/rpm-mirror-plan.py
      - .github/workflows/plan-rpm-mirrors.yml
      - .github/workflows/sync-rpm-mirror.yml
      - docs/module-patch.md
      - rpms/mirror-plan.json
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      okd_version:
        description: OKD version whose RPM mirrors should be checked
        required: true
        type: choice
        options:
          - "4.20"
          - "4.22"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.check.outputs.versions }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check upstream mirror branches
        id: check
        env:
          GH_REPOSITORY: ${{ github.repository }}
          OKD_VERSION: ${{ inputs.okd_version }}
        run: |
          set -euo pipefail
          args=(
            --plan rpms/mirror-plan.json
            --repository "$GH_REPOSITORY"
            --needs-sync-only
          )
          if [[ -n "$OKD_VERSION" ]]; then
            args+=(--okd-version "$OKD_VERSION")
          fi
          mirrors=$(python3 .github/scripts/rpm-mirror-plan.py "${args[@]}")
          versions=$(jq -c '[.[].target_version] | unique' <<< "$mirrors")
          echo "Mirror updates required: $mirrors"
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  dispatch:
    needs: plan
    if: needs.plan.outputs.versions != '[]'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch one sync workflow per stale mirror
        uses: actions/github-script@v9
        env:
          VERSIONS: ${{ needs.plan.outputs.versions }}
        with:
          script: |
            const versions = JSON.parse(process.env.VERSIONS);
            const ref = context.payload.repository.default_branch;
            for (const okd_version of versions) {
              core.info(`Dispatching RPM mirror sync: ${okd_version}`);
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "sync-rpm-mirror.yml",
                ref,
                inputs: { okd_version },
              });
            }
