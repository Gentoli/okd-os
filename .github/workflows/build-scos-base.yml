name: Build and Publish SCOS Base

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-scos-base.yml
      - os/base/**
  workflow_dispatch:
    inputs:
      config_ref:
        description: Branch, tag, or commit of coreos/rhel-coreos-config
        required: true
        default: HEAD
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: build-scos-base-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build ${{ matrix.stream }} base
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stream: [c9s, c10s]
    container:
      image: quay.io/coreos-assembler/coreos-assembler:latest
      options: >-
        --user 0
        --privileged
        --device /dev/kvm
        --device /dev/fuse
        --tmpfs /tmp
      volumes:
        - /var/tmp:/var/tmp
    steps:
      - name: Prepare COSA container
        run: |
          set -euo pipefail
          if [[ ! -e /dev/kvm ]]; then
            echo "::error::COSA requires /dev/kvm for this build."
            exit 1
          fi

          dnf install -y nodejs docker-cli

          kvm_gid=$(stat -c '%g' /dev/kvm)
          if kvm_group=$(getent group "$kvm_gid"); then
            kvm_group=${kvm_group%%:*}
          else
            kvm_group="runner-kvm-${kvm_gid}"
            groupadd --gid "$kvm_gid" "$kvm_group"
          fi
          usermod --append --groups "$kvm_group" builder

      - name: Checkout workflow repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout CoreOS config
        uses: actions/checkout@v4
        with:
          repository: coreos/rhel-coreos-config
          ref: ${{ inputs.config_ref != 'HEAD' && inputs.config_ref || '' }}
          path: os/base/${{ matrix.stream }}/source
          submodules: recursive
          persist-credentials: false

      - name: Apply local SCOS patches
        env:
          STREAM: ${{ matrix.stream }}
        run: |
          set -euo pipefail
          config_path="$GITHUB_WORKSPACE/os/base/${STREAM}/source"
          patch="$GITHUB_WORKSPACE/os/base/c9s/patches/0001-drop-unresolvable-fwupd-plugin.patch"
          if git -C "$config_path" apply --check "$patch"; then
            git -C "$config_path" apply "$patch"
            git -C "$config_path" diff --check
          elif [[ "$STREAM" == "c9s" ]]; then
            echo "The required c9s patch no longer applies." >&2
            exit 1
          else
            echo "The c9s compatibility patch does not apply to $STREAM;" \
              "continuing without it."
          fi
          config_revision=$(git -C "$config_path" rev-parse HEAD)
          echo "COREOS_CONFIG_REVISION=$config_revision" >> "$GITHUB_ENV"

      - name: Build SCOS base image
        run: |
          set -euo pipefail
          build_dir="$GITHUB_WORKSPACE/os/base/${{ matrix.stream }}/build"
          mkdir -p "$build_dir"
          chown builder:builder "$build_dir"
          runuser -u builder -- env GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            COREOS_CONFIG_PATH="os/base/${{ matrix.stream }}/source" \
            COREOS_STREAM="${{ matrix.stream }}" \
            /bin/bash -euo pipefail -c '
              cd "$GITHUB_WORKSPACE/os/base/$COREOS_STREAM/build"
              coreos-assembler init --variant "$COREOS_STREAM" \
                "$GITHUB_WORKSPACE/$COREOS_CONFIG_PATH"
              coreos-assembler build
            '

      - name: Build SCOS QEMU image
        id: qemu-image
        run: |
          set -euo pipefail
          build_dir="$GITHUB_WORKSPACE/os/base/${{ matrix.stream }}/build"
          runuser -u builder -- /bin/bash -euo pipefail -c '
            cd "$1"
            coreos-assembler osbuild qemu
          ' -- "$build_dir"

          mapfile -t images < <(
            find "$build_dir/builds" -type f \
              -path "*/x86_64/scos-*-qemu.x86_64.qcow2" -print
          )
          if (( ${#images[@]} != 1 )); then
            echo "Expected one x86_64 SCOS QEMU image," \
              "found ${#images[@]}." >&2
            exit 1
          fi
          echo "path=${images[0]}" >> "$GITHUB_OUTPUT"

      - name: Archive SCOS VM image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.stream }}-vm
          path: ${{ steps.qemu-image.outputs.path }}
          compression-level: 0
          retention-days: 90

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish SCOS base image
        env:
          STREAM: ${{ matrix.stream }}
        run: |
          set -euo pipefail
          build_dir="$GITHUB_WORKSPACE/os/base/${STREAM}/build"
          cd "$build_dir"
          image_ref="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/scos-base"
          mapfile -t archives < <(
            find builds -type f \
              -path "*/x86_64/scos-*-ostree.x86_64.ociarchive" -print
          )
          if (( ${#archives[@]} != 1 )); then
            echo "Expected one x86_64 SCOS OCI archive," \
              "found ${#archives[@]}." >&2
            exit 1
          fi

          skopeo copy \
            "oci-archive:${archives[0]}" \
            "containers-storage:localhost/scos-base-source:${STREAM}"
          cat > "$RUNNER_TEMP/Containerfile" <<EOF
          FROM localhost/scos-base-source:${STREAM}
          ARG COREOS_CONFIG_SOURCE
          LABEL org.opencontainers.image.source="\${COREOS_CONFIG_SOURCE}"
          LABEL org.opencontainers.image.version="${STREAM}"
          LABEL org.opencontainers.image.revision="${COREOS_CONFIG_REVISION}"
          LABEL io.okd.source.workflow.revision="${GITHUB_SHA}"
          EOF
          config_source=https://github.com/coreos/rhel-coreos-config
          podman build \
            --build-arg "COREOS_CONFIG_SOURCE=$config_source" \
            --tag "${image_ref}:${STREAM}" \
            --file "$RUNNER_TEMP/Containerfile" \
            "$RUNNER_TEMP"
          podman push --format oci \
            "${image_ref}:${STREAM}" \
            "docker://${image_ref}:${STREAM}"
