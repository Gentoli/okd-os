name: Build and Publish SCOS Base

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-scos-base-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout pinned CoreOS config
        uses: actions/checkout@v4
        with:
          repository: coreos/rhel-coreos-config
          ref: 45a6e864f6829e852fd17174cd9da1e13b4e70fa
          path: os/base/c9s/source
          submodules: recursive
          persist-credentials: false

      - name: Apply local c9s patches
        working-directory: os/base/c9s/source
        run: |
          set -euo pipefail
          patch="$GITHUB_WORKSPACE/os/base/c9s/patches/0001-drop-unresolvable-fwupd-plugin.patch"
          git apply --check "$patch"
          git apply "$patch"
          git diff --check

      - name: Build c9s base image
        run: |
          set -euo pipefail
          if [[ ! -e /dev/kvm ]]; then
            echo "::error::COSA requires /dev/kvm for this build."
            exit 1
          fi

          sudo mkdir -p "$GITHUB_WORKSPACE/os/base/c9s/build"
          sudo chown 1000:1000 "$GITHUB_WORKSPACE/os/base/c9s/build"
          kvm_gid=$(stat -c '%g' /dev/kvm)

          docker run --rm --privileged \
            --security-opt label=disable \
            --device /dev/kvm \
            --group-add "$kvm_gid" \
            --device /dev/fuse \
            --tmpfs /tmp \
            --volume /var/tmp:/var/tmp \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work/os/base/c9s/build \
            --entrypoint /bin/bash \
            quay.io/coreos-assembler/coreos-assembler:latest \
            -euo pipefail -c '
              coreos-assembler init --variant c9s /work/os/base/c9s/source
              coreos-assembler build
            '

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare registry auth file
        run: |
          install -m 0644 \
            "$HOME/.docker/config.json" \
            "$RUNNER_TEMP/ghcr-auth.json"

      - name: Publish c9s base image
        env:
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/ghcr-auth.json
        run: |
          set -euo pipefail
          image_ref="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/okd-os-scos-base"
          immutable_tag="c9s-${GITHUB_SHA:0:12}"

          docker run --rm \
            --volume "$GITHUB_WORKSPACE/os/base/c9s/build:/work/build:ro" \
            --volume "$REGISTRY_AUTH_FILE:/run/ghcr-auth.json:ro" \
            --workdir /work/build \
            --env REGISTRY_AUTH_FILE=/run/ghcr-auth.json \
            --env IMAGE_REF="$image_ref" \
            --env IMMUTABLE_TAG="$immutable_tag" \
            --entrypoint /bin/bash \
            quay.io/coreos-assembler/coreos-assembler:latest \
            -euo pipefail -c '
              mapfile -t archives < <(
                find builds -type f \
                  -path "*/x86_64/scos-*-ostree.x86_64.ociarchive" -print
              )
              if (( ${#archives[@]} != 1 )); then
                echo "Expected one x86_64 SCOS OCI archive," \
                  "found ${#archives[@]}." >&2
                exit 1
              fi

              skopeo copy --dest-authfile "$REGISTRY_AUTH_FILE" \
                "oci-archive:${archives[0]}" \
                "docker://${IMAGE_REF}:${IMMUTABLE_TAG}"
              skopeo copy --dest-authfile "$REGISTRY_AUTH_FILE" \
                "oci-archive:${archives[0]}" \
                "docker://${IMAGE_REF}:c9s"
            '

      - name: Remove registry auth file
        if: always()
        run: rm -f "$RUNNER_TEMP/ghcr-auth.json"
