name: Build and Publish SCOS Base

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-scos-base.yml
      - .github/workflows/sync-repo-mirror.yml
      - .github/prompts/source-mirror-maintenance.md
      - os/base/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-scos-base-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-coreos-source:
    permissions:
      contents: read
      copilot-requests: write
    uses: ./.github/workflows/sync-repo-mirror.yml
    secrets: inherit
    with:
      mirror: >-
        {
          "project": "coreos/rhel-coreos-config",
          "source_url": "https://github.com/coreos/rhel-coreos-config.git",
          "source_branch": "HEAD",
          "target_branch": "coreos/c9s",
          "target_version": null,
          "seed_patch": "os/base/c9s/patches/0001-drop-unresolvable-fwupd-plugin.patch"
        }
      repository_instructions: |
        - This mirror carries the CoreOS build configuration. Apply the tracked
          `seed_patch` from `GITHUB_WORKSPACE` to the worktree for the initial
          mirror only, and commit it directly after the marker. Do not apply it
          again on updates; replay that compatibility commit from `target_ref`
          instead.

  build-and-push:
    name: Build ${{ matrix.stream }} base
    needs: sync-coreos-source
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stream: [c9s]
    container:
      image: quay.io/coreos-assembler/coreos-assembler:latest
      options: >-
        --user 0
        --privileged
        --device /dev/kvm
        --device /dev/fuse
        --tmpfs /tmp
      volumes:
        - /var/tmp:/var/tmp
    steps:
      - name: Prepare COSA container
        run: |
          set -euo pipefail
          if [[ ! -e /dev/kvm ]]; then
            echo "::error::COSA requires /dev/kvm for this build."
            exit 1
          fi

          dnf install -y nodejs docker-cli podman

          kvm_gid=$(stat -c '%g' /dev/kvm)
          if kvm_group=$(getent group "$kvm_gid"); then
            kvm_group=${kvm_group%%:*}
          else
            kvm_group="runner-kvm-${kvm_gid}"
            groupadd --gid "$kvm_gid" "$kvm_group"
          fi
          usermod --append --groups "$kvm_group" builder

      - name: Checkout workflow repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install crane
        uses: jaxxstorm/action-install-gh-release@v3.0.0
        with:
          repo: google/go-containerregistry
          tag: v0.22.1
          # Keep the digest in step with the tag; it is published in the
          # release's checksums.txt.
          digest: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0

      - name: Checkout CoreOS config
        uses: actions/checkout@v4
        with:
          repository: Gentoli/okd-os
          ref: coreos/c9s
          path: os/base/${{ matrix.stream }}/source
          submodules: recursive
          persist-credentials: false

      - name: Record mirrored CoreOS config revision
        env:
          STREAM: ${{ matrix.stream }}
        run: |
          set -euo pipefail
          config_path="$GITHUB_WORKSPACE/os/base/${STREAM}/source"
          config_revision=$(git -C "$config_path" rev-parse HEAD)
          echo "COREOS_CONFIG_REVISION=$config_revision" >> "$GITHUB_ENV"

      - name: Build SCOS base image
        run: |
          set -euo pipefail
          build_dir="$GITHUB_WORKSPACE/os/base/${{ matrix.stream }}/build"
          mkdir -p "$build_dir"
          chown builder:builder "$build_dir"
          runuser -u builder -- env GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            COREOS_CONFIG_PATH="os/base/${{ matrix.stream }}/source" \
            COREOS_STREAM="${{ matrix.stream }}" \
            /bin/bash -euo pipefail -c '
              cd "$GITHUB_WORKSPACE/os/base/$COREOS_STREAM/build"
              coreos-assembler init --variant "$COREOS_STREAM" \
                "$GITHUB_WORKSPACE/$COREOS_CONFIG_PATH"
              coreos-assembler build
            '

      - name: Build SCOS QEMU image
        id: qemu-image
        run: |
          set -euo pipefail
          build_dir="$GITHUB_WORKSPACE/os/base/${{ matrix.stream }}/build"
          runuser -u builder -- /bin/bash -euo pipefail -c '
            cd "$1"
            coreos-assembler osbuild qemu
          ' -- "$build_dir"

          mapfile -t images < <(
            find "$build_dir/builds" -type f \
              -path "*/x86_64/scos-*-qemu.x86_64.qcow2" -print
          )
          if (( ${#images[@]} != 1 )); then
            echo "Expected one x86_64 SCOS QEMU image," \
              "found ${#images[@]}." >&2
            exit 1
          fi
          echo "path=${images[0]}" >> "$GITHUB_OUTPUT"

      - name: Locate SCOS OCI archive
        id: oci-image
        run: |
          set -euo pipefail
          build_dir="$GITHUB_WORKSPACE/os/base/${{ matrix.stream }}/build"
          mapfile -t archives < <(
            find "$build_dir/builds" -type f \
              -path "*/x86_64/scos-*-ostree.x86_64.ociarchive" -print
          )
          if (( ${#archives[@]} != 1 )); then
            echo "Expected one x86_64 SCOS OCI archive," \
              "found ${#archives[@]}." >&2
            exit 1
          fi
          echo "path=${archives[0]}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve SCOS kernel version
        env:
          STREAM: ${{ matrix.stream }}
          OCI_IMAGE: ${{ steps.oci-image.outputs.path }}
        run: |
          set -euo pipefail
          # Cosa records the installed packages beside the image, so the kernel
          # comes from the build metadata instead of an image inspection.
          commitmeta="$(dirname "$OCI_IMAGE")/commitmeta.json"
          kernel_version=""
          if [[ -f "$commitmeta" ]]; then
            kernel_version=$(python3 - "$commitmeta" <<'PY'
          import json
          import sys

          try:
              with open(sys.argv[1]) as handle:
                  commitmeta = json.load(handle)
          except (OSError, ValueError):
              sys.exit(0)
          for package in commitmeta.get("rpmostree.rpmdb.pkglist", []):
              if package and package[0] == "kernel-core":
                  print(f"{package[2]}-{package[3]}")
                  break
          PY
            ) || true
          fi
          if [[ "$kernel_version" =~ ^[0-9][A-Za-z0-9._+-]*-[A-Za-z0-9._+~%]+$ ]]; then
            echo "KERNEL_VERSION=${kernel_version}" >> "$GITHUB_ENV"
            echo "The SCOS ${STREAM} images provide kernel ${kernel_version}."
          else
            echo "::warning::Could not read the kernel from ${commitmeta}; no label applied." >&2
          fi

      - name: Publish SCOS VM image to GHCR
        env:
          STREAM: ${{ matrix.stream }}
          QEMU_IMAGE: ${{ steps.qemu-image.outputs.path }}
        run: |
          set -euo pipefail
          image_ref="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/scos-base"
          qemu_dir="$RUNNER_TEMP/scos-qemu"
          mkdir -p "$qemu_dir"
          cp "$QEMU_IMAGE" "$qemu_dir/scos-qemu.qcow2"
          cat > "$RUNNER_TEMP/QEMU.Containerfile" <<'EOF'
          FROM scratch
          COPY scos-qemu.qcow2 /scos-qemu.qcow2
          CMD ["/scos-qemu.qcow2"]
          EOF
          qemu_tag="${STREAM}-vm"
          podman build \
            --file "$RUNNER_TEMP/QEMU.Containerfile" \
            --tag "${image_ref}:${qemu_tag}" \
            "$qemu_dir"
          podman push "${image_ref}:${qemu_tag}"
          if [[ -n "${KERNEL_VERSION:-}" ]]; then
            crane mutate \
              --label "io.okd.source.kernel.version=${KERNEL_VERSION}" \
              --tag "${image_ref}:${qemu_tag}" \
              "${image_ref}:${qemu_tag}"
          fi

      - name: Publish SCOS base image
        env:
          STREAM: ${{ matrix.stream }}
          OCI_IMAGE: ${{ steps.oci-image.outputs.path }}
        run: |
          set -euo pipefail
          image_ref="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/scos-base"
          revision_label=org.opencontainers.image.revision
          config_source=https://github.com/coreos/rhel-coreos-config
          skopeo copy --format oci "oci-archive:${OCI_IMAGE}" "docker://${image_ref}:${STREAM}"
          labels=(
            --label "org.opencontainers.image.source=${config_source}"
            --label "org.opencontainers.image.version=${STREAM}"
            --label "${revision_label}=${COREOS_CONFIG_REVISION}"
            --label "io.okd.source.workflow.revision=${GITHUB_SHA}"
          )
          if [[ -n "${KERNEL_VERSION:-}" ]]; then
            labels+=(--label "io.okd.source.kernel.version=${KERNEL_VERSION}")
          fi
          crane mutate "${labels[@]}" --tag "${image_ref}:${STREAM}" "${image_ref}:${STREAM}"
