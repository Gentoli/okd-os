name: Sync RPM mirror branches

on:
  workflow_call:
    inputs:
      mirrors:
        description: RPM mirrors selected for synchronization
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rpm-mirror
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    if: inputs.mirrors != '[]'
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.branches.outputs.plan }}
      target_branch: ${{ steps.branches.outputs.target_branch }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create missing mirror branches
        id: branches
        uses: actions/github-script@v9
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MIRRORS: ${{ inputs.mirrors }}
        with:
          script: |
            const { execFileSync } = require("node:child_process");
            const mirrors = JSON.parse(process.env.MIRRORS);
            const repository = process.env.GITHUB_REPOSITORY;
            const workspace = process.env.GITHUB_WORKSPACE;
            const mirrorUrl = `https://github.com/${repository}.git`;
            const prepared = [];
            if (mirrors.length !== 1) {
              throw new Error(
                "Mirror preparation expects exactly one package target.",
              );
            }

            function git(args, extraEnv = {}) {
              try {
                return execFileSync("git", args, {
                  cwd: workspace,
                  encoding: "utf8",
                  stdio: ["ignore", "pipe", "pipe"],
                  env: { ...process.env, ...extraEnv },
                }).trimEnd();
              } catch (error) {
                const detail = error.stderr?.toString() ?? error.message;
                throw new Error(`git ${args.join(" ")} failed: ${detail}`);
              }
            }

            for (const mirror of mirrors) {
              const sourceRemote = `rpm-setup-${mirror.id}`;
              const sourceRef = `refs/remotes/${sourceRemote}/source`;
              git(["remote", "add", sourceRemote, mirror.source_url]);
              git([
                "fetch", "--quiet", "--no-tags", sourceRemote,
                `refs/heads/${mirror.source_branch}:${sourceRef}`,
              ]);
              const sourceSha = git(["rev-parse", sourceRef]);
              const targetRef = `refs/heads/${mirror.target_branch}`;
              const targetOutput = git([
                "ls-remote", "--heads", mirrorUrl, targetRef,
              ]);
              let baseSha = "";
              if (targetOutput) {
                baseSha = targetOutput.split(/\s+/)[0];
              } else {
                try {
                  const authHeader = `AUTHORIZATION: basic ${Buffer.from(
                    `x-access-token:${process.env.GITHUB_TOKEN}`,
                  ).toString("base64")}`;
                  git([
                    "push", "--quiet", mirrorUrl,
                    `${sourceRef}:${targetRef}`,
                  ], {
                    GIT_CONFIG_COUNT: "1",
                    GIT_CONFIG_KEY_0: "http.https://github.com/.extraheader",
                    GIT_CONFIG_VALUE_0: authHeader,
                  });
                  baseSha = sourceSha;
                } catch (error) {
                  const current = git([
                    "ls-remote", "--heads", mirrorUrl, targetRef,
                  ]);
                  if (!current) throw error;
                  baseSha = current.split(/\s+/)[0];
                }
              }
              prepared.push({
                ...mirror,
                source_sha: sourceSha,
                base_sha: baseSha,
              });
            }
            core.setOutput("plan", JSON.stringify(prepared));
            core.setOutput("target_branch", prepared[0].target_branch);

  agent:
    needs: prepare
    if: inputs.mirrors != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up mirror remotes for the agent
        id: remotes
        uses: actions/github-script@v9
        env:
          MIRROR_PLAN: ${{ needs.prepare.outputs.plan }}
        with:
          script: |
            const { execFileSync } = require("node:child_process");
            const fs = require("node:fs");
            const path = require("node:path");
            const mirrors = JSON.parse(process.env.MIRROR_PLAN);
            if (mirrors.length !== 1) {
              throw new Error(
                "Mirror sync expects exactly one package target.",
              );
            }
            const repository = process.env.GITHUB_REPOSITORY;
            const workspace = process.env.GITHUB_WORKSPACE;
            const mirrorUrl = `https://github.com/${repository}.git`;
            const prepared = [];

            function git(args) {
              try {
                return execFileSync("git", args, {
                  cwd: workspace,
                  encoding: "utf8",
                  stdio: ["ignore", "pipe", "pipe"],
                }).trimEnd();
              } catch (error) {
                const detail = error.stderr?.toString() ?? error.message;
                throw new Error(`git ${args.join(" ")} failed: ${detail}`);
              }
            }

            for (const mirror of mirrors) {
              const sourceRemote = `rpm-upstream-${mirror.id}`;
              const mirrorRemote = `rpm-mirror-${mirror.id}`;
              const sourceRef = `refs/remotes/${sourceRemote}/source`;
              const targetRef = `refs/remotes/${mirrorRemote}/target`;
              git(["remote", "add", sourceRemote, mirror.source_url]);
              git([
                "fetch", "--quiet", "--no-tags", sourceRemote,
                `refs/heads/${mirror.source_branch}:${sourceRef}`,
              ]);
              git(["remote", "add", mirrorRemote, mirrorUrl]);
              git([
                "fetch", "--quiet", "--no-tags", mirrorRemote,
                `refs/heads/${mirror.target_branch}:${targetRef}`,
              ]);
              const baseSha = git(["rev-parse", targetRef]);
              if (
                baseSha !== mirror.base_sha ||
                git(["rev-parse", sourceRef]) !== mirror.source_sha
              ) {
                throw new Error(
                  `RPM source branches changed during setup for ` +
                    `${mirror.target_branch}.`,
                );
              }
              const worktree = path.join(
                process.env.RUNNER_TEMP,
                "rpm-mirrors",
                mirror.id,
              );
              fs.mkdirSync(path.dirname(worktree), { recursive: true });
              git(["worktree", "add", "--detach", worktree, baseSha]);
              const contextPath = path.join(
                process.env.RUNNER_TEMP,
                `${mirror.id}.json`,
              );
              const context = {
                ...mirror,
                mirror_url: mirrorUrl,
                source_remote: sourceRemote,
                source_ref: sourceRef,
                mirror_remote: mirrorRemote,
                target_ref: targetRef,
                base_sha: mirror.base_sha,
                source_sha: mirror.source_sha,
                worktree,
                context_path: contextPath,
              };
              fs.writeFileSync(
                contextPath,
                `${JSON.stringify(context, null, 2)}\n`,
              );
              prepared.push(context);
            }
            fs.writeFileSync(
              path.join(process.env.RUNNER_TEMP, "rpm-mirrors.json"),
              `${JSON.stringify(prepared)}\n`,
            );

      - name: Install Copilot CLI
        run: npm install --global @github/copilot@1.0.91

      - name: Maintain RPM mirrors with Copilot
        uses: actions/github-script@v9
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          script: |
            const { execFileSync } = require("node:child_process");
            const fs = require("node:fs");
            const mirrors = JSON.parse(
              fs.readFileSync(
                `${process.env.RUNNER_TEMP}/rpm-mirrors.json`,
                "utf8",
              ),
            );
            const instruction = require("node:path").join(
              process.env.GITHUB_WORKSPACE,
              ".github/prompts/rpm-mirror-maintenance.md",
            );
            for (const mirror of mirrors) {
              execFileSync("copilot", [
                "-C", mirror.worktree,
                "-p",
                "Maintain this RPM mirror using the attached instructions " +
                  "and context. Inspect the configured upstream and mirror " +
                  "remotes. Update only the package spec and " +
                  "mirror metadata, " +
                  "and leave all changes uncommitted for the workflow action.",
                "--attachment", instruction,
                "--attachment", mirror.context_path,
                "--model", "gpt-6-luna",
                "--reasoning-effort", "max",
                "--context", "long_context",
                "--allow-tool=write",
                "--allow-tool=shell",
                "-s",
              ], {
                cwd: mirror.worktree,
                stdio: "inherit",
                env: process.env,
              });
            }

      - name: Validate and upload agent changes
        uses: actions/github-script@v9
        env:
          MIRROR_PLAN: ${{ needs.prepare.outputs.plan }}
        with:
          script: |
            const { execFileSync } = require("node:child_process");
            const fs = require("node:fs");
            const path = require("node:path");
            const mirrors = JSON.parse(process.env.MIRROR_PLAN);
            if (mirrors.length !== 1) {
              throw new Error(
                "Mirror validation expects exactly one package target.",
              );
            }
            const mirror = mirrors[0];
            const worktree = path.join(
              process.env.RUNNER_TEMP,
              "rpm-mirrors",
              mirror.id,
            );

            function git(args) {
              try {
                return execFileSync("git", args, {
                  cwd: worktree,
                  encoding: "utf8",
                  stdio: ["ignore", "pipe", "pipe"],
                }).trimEnd();
              } catch (error) {
                const detail = error.stderr?.toString() ?? error.message;
                throw new Error(`git ${args.join(" ")} failed: ${detail}`);
              }
            }

            if (git(["rev-parse", "HEAD"]) !== mirror.base_sha) {
              throw new Error(
                `The agent committed changes for ${mirror.target_branch}; ` +
                  "mirror commits must be created by a workflow action.",
              );
            }
            if (git(["diff", "--name-only", "--diff-filter=U"])) {
              throw new Error(
                `Unresolved conflicts in ${mirror.target_branch}`,
              );
            }

            const metadataPath = path.join(worktree, ".rpm-mirror.json");
            const specPath = path.join(worktree, mirror.spec);
            if (fs.realpathSync(worktree) !== worktree) {
              throw new Error(
                `Invalid mirror worktree path for ${mirror.target_branch}`,
              );
            }
            for (const file of [metadataPath, specPath]) {
              if (
                !fs.lstatSync(file).isFile() ||
                fs.realpathSync(file) !== file
              ) {
                throw new Error(`Expected a regular mirror file: ${file}`);
              }
            }
            const metadata = JSON.parse(fs.readFileSync(metadataPath, "utf8"));
            const expected = {
              project: mirror.project,
              target_el: String(mirror.target_el),
              target_version: mirror.target_version,
              source_url: mirror.source_url,
              source_branch: mirror.source_branch,
              spec: mirror.spec,
              source_sha: mirror.source_sha,
            };
            if (
              JSON.stringify(Object.keys(metadata).sort()) !==
                JSON.stringify(Object.keys(expected).sort()) ||
              Object.entries(expected)
                .some(([key, value]) => metadata[key] !== value)
            ) {
              throw new Error(
                `Invalid mirror metadata for ${mirror.target_branch}`,
              );
            }

            const changed = new Set();
            for (const args of [
              ["diff", "--name-only", "-z", "HEAD"],
              ["diff", "--cached", "--name-only", "-z"],
              ["ls-files", "--others", "--exclude-standard", "-z"],
            ]) {
              for (const file of git(args).split("\0")) {
                if (file) changed.add(file);
              }
            }
            const allowed = new Set([mirror.spec, ".rpm-mirror.json"]);
            const unexpected = [...changed].filter(
              (file) => !allowed.has(file),
            );
            if (unexpected.length) {
              throw new Error(
                `Unexpected mirror changes: ${unexpected.join(", ")}`,
              );
            }
            if (!changed.size) {
              throw new Error(`No mirror changes for ${mirror.target_branch}`);
            }

            const artifactRoot = path.join(
              process.env.RUNNER_TEMP,
              "rpm-mirror-changes",
            );
            fs.rmSync(artifactRoot, { recursive: true, force: true });
            fs.mkdirSync(artifactRoot, { recursive: true });
            fs.mkdirSync(path.dirname(path.join(artifactRoot, mirror.spec)), {
              recursive: true,
            });
            fs.copyFileSync(specPath, path.join(artifactRoot, mirror.spec));
            fs.copyFileSync(
              metadataPath,
              path.join(artifactRoot, ".rpm-mirror.json"),
            );
            fs.writeFileSync(
              path.join(artifactRoot, "manifest.json"),
              `${JSON.stringify({
                ...mirror,
              }, null, 2)}\n`,
            );

      - name: Upload agent changes
        uses: actions/upload-artifact@v4
        with:
          name: rpm-mirror-changes
          path: ${{ runner.temp }}/rpm-mirror-changes/
          if-no-files-found: error
          retention-days: 1

  commit:
    needs:
      - prepare
      - agent
    if: inputs.mirrors != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout mirror branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.target_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download agent changes
        uses: actions/download-artifact@v4.1.3
        with:
          name: rpm-mirror-changes
          path: ${{ runner.temp }}/rpm-mirror-changes

      - name: Validate and stage agent changes
        uses: actions/github-script@v9
        env:
          TARGET_BRANCH: ${{ needs.prepare.outputs.target_branch }}
          MIRROR_PLAN: ${{ needs.prepare.outputs.plan }}
        with:
          script: |
            const { execFileSync } = require("node:child_process");
            const fs = require("node:fs");
            const path = require("node:path");
            const root = process.env.GITHUB_WORKSPACE;
            const artifactRoot = path.join(
              process.env.RUNNER_TEMP,
              "rpm-mirror-changes",
            );
            const manifest = JSON.parse(fs.readFileSync(
              path.join(artifactRoot, "manifest.json"),
              "utf8",
            ));
            const mirrors = JSON.parse(process.env.MIRROR_PLAN);
            if (mirrors.length !== 1) {
              throw new Error(
                "Mirror publishing expects exactly one package target.",
              );
            }
            const mirror = mirrors[0];

            function git(args) {
              try {
                return execFileSync("git", args, {
                  cwd: root,
                  encoding: "utf8",
                  stdio: ["ignore", "pipe", "pipe"],
                }).trimEnd();
              } catch (error) {
                const detail = error.stderr?.toString() ?? error.message;
                throw new Error(`git ${args.join(" ")} failed: ${detail}`);
              }
            }

            if (
              process.env.TARGET_BRANCH !== mirror.target_branch ||
              manifest.target_branch !== mirror.target_branch ||
              JSON.stringify(manifest) !== JSON.stringify(mirror)
            ) {
              throw new Error(
                "Agent artifact targets an unexpected mirror branch.",
              );
            }
            if (git(["rev-parse", "HEAD"]) !== manifest.base_sha) {
              throw new Error(
                `Mirror ${manifest.target_branch} changed while the agent ` +
                  "ran; retry.",
              );
            }
            const files = new Set();
            function list(directory, prefix = "") {
              const entries = fs.readdirSync(directory, {
                withFileTypes: true,
              });
              for (const entry of entries) {
                const relative = path.posix.join(prefix, entry.name);
                const fullPath = path.join(directory, entry.name);
                if (entry.isDirectory()) list(fullPath, relative);
                else if (entry.isFile()) files.add(relative);
                else throw new Error(`Invalid artifact entry: ${relative}`);
              }
            }
            list(artifactRoot);
            const expectedFiles = new Set([
              "manifest.json",
              manifest.spec,
              ".rpm-mirror.json",
            ]);
            if (
              files.size !== expectedFiles.size ||
              [...files].some((file) => !expectedFiles.has(file))
            ) {
              throw new Error("Agent artifact contains unexpected files.");
            }

            const metadata = JSON.parse(fs.readFileSync(
              path.join(artifactRoot, ".rpm-mirror.json"),
              "utf8",
            ));
            const expected = {
              project: mirror.project,
              target_el: String(mirror.target_el),
              target_version: mirror.target_version,
              source_url: mirror.source_url,
              source_branch: mirror.source_branch,
              spec: mirror.spec,
              source_sha: mirror.source_sha,
            };
            if (
              JSON.stringify(Object.keys(metadata).sort()) !==
                JSON.stringify(Object.keys(expected).sort()) ||
              Object.entries(expected)
                .some(([key, value]) => metadata[key] !== value)
            ) {
              throw new Error("Agent artifact has invalid mirror metadata.");
            }

            const specDestination = path.join(root, manifest.spec);
            fs.mkdirSync(path.dirname(specDestination), { recursive: true });
            fs.copyFileSync(
              path.join(artifactRoot, manifest.spec),
              specDestination,
            );
            fs.copyFileSync(
              path.join(artifactRoot, ".rpm-mirror.json"),
              path.join(root, ".rpm-mirror.json"),
            );
            git(["add", "--", manifest.spec, ".rpm-mirror.json"]);
            try {
              execFileSync("git", ["diff", "--cached", "--quiet"], {
                cwd: root,
                stdio: "ignore",
              });
              throw new Error("Agent changes are empty; refusing to publish.");
            } catch (error) {
              if (error.message.startsWith("Agent changes are empty")) {
                throw error;
              }
              if (error.status !== 1) throw error;
            }

      - name: Create signed mirror commit
        uses: pgaskin/push-signed-commits@v1.2.1
        with:
          path: .
          repository: ${{ github.repository }}
          branch: ${{ needs.prepare.outputs.target_branch }}
          commit-message: Update RPM mirror
          github-token: ${{ github.token }}
