name: Sync RPM mirror branches

on:
  workflow_call:
    inputs:
      mirrors:
        description: RPM mirrors selected for synchronization
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rpm-mirror
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    if: inputs.mirrors != '[]'
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.branches.outputs.plan }}
      target_branch: ${{ steps.branches.outputs.target_branch }}
      base_sha: ${{ steps.branches.outputs.base_sha }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create missing mirror branches
        id: branches
        uses: actions/github-script@v9
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MIRRORS: ${{ inputs.mirrors }}
        with:
          script: |
            const { execFileSync } = require("node:child_process");
            const mirrors = JSON.parse(process.env.MIRRORS);
            const repository = process.env.GITHUB_REPOSITORY;
            const workspace = process.env.GITHUB_WORKSPACE;
            const mirrorUrl = `https://github.com/${repository}.git`;
            const prepared = [];
            if (mirrors.length !== 1) {
              throw new Error(
                "Mirror preparation expects exactly one package target.",
              );
            }

            function git(args, extraEnv = {}) {
              try {
                return execFileSync("git", args, {
                  cwd: workspace,
                  encoding: "utf8",
                  stdio: ["ignore", "pipe", "pipe"],
                  env: { ...process.env, ...extraEnv },
                }).trimEnd();
              } catch (error) {
                const detail = error.stderr?.toString() ?? error.message;
                throw new Error(`git ${args.join(" ")} failed: ${detail}`);
              }
            }

            for (const mirror of mirrors) {
              const sourceRemote = `rpm-setup-${mirror.id}`;
              const sourceRef = `refs/remotes/${sourceRemote}/source`;
              git(["remote", "add", sourceRemote, mirror.source_url]);
              git([
                "fetch", "--quiet", "--no-tags", sourceRemote,
                `refs/heads/${mirror.source_branch}:${sourceRef}`,
              ]);
              const sourceSha = git(["rev-parse", sourceRef]);
              const targetRef = `refs/heads/${mirror.target_branch}`;
              const targetOutput = git([
                "ls-remote", "--heads", mirrorUrl, targetRef,
              ]);
              let baseSha = "";
              if (targetOutput) {
                baseSha = targetOutput.split(/\s+/)[0];
              } else {
                try {
                  const authHeader = `AUTHORIZATION: basic ${Buffer.from(
                    `x-access-token:${process.env.GITHUB_TOKEN}`,
                  ).toString("base64")}`;
                  git([
                    "push", "--quiet", mirrorUrl,
                    `${sourceRef}:${targetRef}`,
                  ], {
                    GIT_CONFIG_COUNT: "1",
                    GIT_CONFIG_KEY_0: "http.https://github.com/.extraheader",
                    GIT_CONFIG_VALUE_0: authHeader,
                  });
                  baseSha = sourceSha;
                } catch (error) {
                  const current = git([
                    "ls-remote", "--heads", mirrorUrl, targetRef,
                  ]);
                  if (!current) throw error;
                  baseSha = current.split(/\s+/)[0];
                }
              }
              prepared.push({
                ...mirror,
                source_sha: sourceSha,
                base_sha: baseSha,
              });
            }
            core.setOutput("plan", JSON.stringify(prepared));
            core.setOutput("target_branch", prepared[0].target_branch);
            core.setOutput("base_sha", prepared[0].base_sha);

  agent:
    needs: prepare
    if: inputs.mirrors != '[]'
    runs-on: ubuntu-latest
    outputs:
      commit_oids: ${{ steps.agent.outputs.commit_oids }}
      head_oid: ${{ steps.agent.outputs.head_oid }}
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up mirror remotes for the agent
        id: remotes
        uses: actions/github-script@v9
        env:
          MIRROR_PLAN: ${{ needs.prepare.outputs.plan }}
        with:
          script: |
            const { execFileSync } = require("node:child_process");
            const fs = require("node:fs");
            const path = require("node:path");
            const mirrors = JSON.parse(process.env.MIRROR_PLAN);
            if (mirrors.length !== 1) {
              throw new Error(
                "Mirror sync expects exactly one package target.",
              );
            }
            const repository = process.env.GITHUB_REPOSITORY;
            const workspace = process.env.GITHUB_WORKSPACE;
            const mirrorUrl = `https://github.com/${repository}.git`;
            const prepared = [];

            function git(args) {
              try {
                return execFileSync("git", args, {
                  cwd: workspace,
                  encoding: "utf8",
                  stdio: ["ignore", "pipe", "pipe"],
                }).trimEnd();
              } catch (error) {
                const detail = error.stderr?.toString() ?? error.message;
                throw new Error(`git ${args.join(" ")} failed: ${detail}`);
              }
            }

            for (const mirror of mirrors) {
              const sourceRemote = `rpm-upstream-${mirror.id}`;
              const mirrorRemote = `rpm-mirror-${mirror.id}`;
              const sourceRef = `refs/remotes/${sourceRemote}/source`;
              const targetRef = `refs/remotes/${mirrorRemote}/target`;
              git(["config", "user.name", "RPM Mirror Maintainer"]);
              git([
                "config", "user.email",
                "rpm-mirror-maintainer@users.noreply.github.com",
              ]);
              git(["remote", "add", sourceRemote, mirror.source_url]);
              git([
                "fetch", "--quiet", "--no-tags", sourceRemote,
                `refs/heads/${mirror.source_branch}:${sourceRef}`,
              ]);
              git(["remote", "add", mirrorRemote, mirrorUrl]);
              git([
                "fetch", "--quiet", "--no-tags", mirrorRemote,
                `refs/heads/${mirror.target_branch}:${targetRef}`,
              ]);
              const baseSha = git(["rev-parse", targetRef]);
              if (
                baseSha !== mirror.base_sha ||
                git(["rev-parse", sourceRef]) !== mirror.source_sha
              ) {
                throw new Error(
                  `RPM source branches changed during setup for ` +
                    `${mirror.target_branch}.`,
                );
              }
              const worktree = path.join(
                process.env.RUNNER_TEMP,
                "rpm-mirrors",
                mirror.id,
              );
              fs.mkdirSync(path.dirname(worktree), { recursive: true });
              git(["worktree", "add", "--detach", worktree, baseSha]);
              const contextPath = path.join(
                process.env.RUNNER_TEMP,
                `${mirror.id}.json`,
              );
              const context = {
                ...mirror,
                mirror_url: mirrorUrl,
                source_remote: sourceRemote,
                source_ref: sourceRef,
                mirror_remote: mirrorRemote,
                target_ref: targetRef,
                base_sha: mirror.base_sha,
                source_sha: mirror.source_sha,
                worktree,
                context_path: contextPath,
              };
              fs.writeFileSync(
                contextPath,
                `${JSON.stringify(context, null, 2)}\n`,
              );
              prepared.push(context);
            }
            fs.writeFileSync(
              path.join(process.env.RUNNER_TEMP, "rpm-mirrors.json"),
              `${JSON.stringify(prepared)}\n`,
            );

      - name: Install Copilot CLI
        run: npm install --global @github/copilot@1.0.91

      - name: Maintain RPM mirrors with Copilot
        id: agent
        uses: actions/github-script@v9
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          script: |
            const { execFileSync } = require("node:child_process");
            const fs = require("node:fs");
            const path = require("node:path");
            const mirrors = JSON.parse(
              fs.readFileSync(
                `${process.env.RUNNER_TEMP}/rpm-mirrors.json`,
                "utf8",
              ),
            );
            const instruction = require("node:path").join(
              process.env.GITHUB_WORKSPACE,
              ".github/prompts/rpm-mirror-maintenance.md",
            );
            for (const mirror of mirrors) {
              const output = execFileSync("copilot", [
                "-C", mirror.worktree,
                "-p",
                "Follow the attached RPM mirror walkthrough and context. " +
                  "Update the package spec and mirror metadata, create local " +
                  "commit(s), and do not push. Finish by printing every " +
                  "commit ID you created in chronological order on one line " +
                  "as COMMIT_OIDS: <full_oid> [<full_oid> ...].",
                "--attachment", instruction,
                "--attachment", mirror.context_path,
                "--model", "gpt-6-luna",
                "--reasoning-effort", "max",
                "--context", "long_context",
                "--allow-tool=write",
                "--allow-tool=shell",
                "-s",
              ], {
                cwd: mirror.worktree,
                encoding: "utf8",
                stdio: ["ignore", "pipe", "inherit"],
                env: process.env,
              });
              process.stdout.write(output);
              const match = output.match(
                /^COMMIT_OIDS:\s+([0-9a-f]{40}(?:\s+[0-9a-f]{40})*)\s*$/m,
              );
              if (!match) {
                throw new Error(
                  "Copilot did not print the required COMMIT_OIDS line.",
                );
              }
              const commitOids = match[1].trim().split(/\s+/);
              const headOid = commitOids[commitOids.length - 1];
              const workspace = process.env.GITHUB_WORKSPACE;
              const bundleRef = "refs/heads/rpm-mirror-agent";
              const bundlePath = path.join(
                process.env.RUNNER_TEMP,
                "rpm-mirror.bundle",
              );
              function git(args) {
                try {
                  return execFileSync("git", args, {
                    cwd: workspace,
                    encoding: "utf8",
                    stdio: ["ignore", "pipe", "pipe"],
                  }).trimEnd();
                } catch (error) {
                  const detail = error.stderr?.toString() ?? error.message;
                  throw new Error(`git ${args.join(" ")} failed: ${detail}`);
                }
              }
              git(["update-ref", bundleRef, headOid]);
              fs.mkdirSync(path.dirname(bundlePath), { recursive: true });
              git(["bundle", "create", bundlePath, bundleRef]);
              core.setOutput("commit_oids", commitOids.join(" "));
              core.setOutput("head_oid", headOid);
              core.info(`Agent-created commit IDs: ${commitOids.join(" ")}`);
            }

      - name: Upload agent commits
        uses: actions/upload-artifact@v4
        with:
          name: rpm-mirror-commits
          path: ${{ runner.temp }}/rpm-mirror.bundle
          if-no-files-found: error
          retention-days: 1

  commit:
    needs:
      - prepare
      - agent
    if: inputs.mirrors != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout mirror branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.target_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download agent commits
        uses: actions/download-artifact@v4.1.3
        with:
          name: rpm-mirror-commits
          path: ${{ runner.temp }}/rpm-mirror-commits

      - name: Fetch agent commits
        run: |
          git fetch \
            "$RUNNER_TEMP/rpm-mirror-commits/rpm-mirror.bundle" \
            refs/heads/rpm-mirror-agent:refs/remotes/agent/rpm-mirror-agent

      - name: Create signed mirror commit
        uses: pgaskin/push-signed-commits@v1.2.1
        with:
          path: .
          repository: ${{ github.repository }}
          branch: ${{ needs.prepare.outputs.target_branch }}
          revision: ${{ needs.prepare.outputs.base_sha }}..${{ needs.agent.outputs.head_oid }}
          github-token: ${{ github.token }}
