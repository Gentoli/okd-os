name: Sync RPM mirror branches

on:
  workflow_call:
    inputs:
      mirrors:
        description: JSON array of selected RPM mirrors requiring synchronization
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rpm-mirror
  cancel-in-progress: false
  queue: max

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      copilot-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare mirror worktrees and metadata
        if: inputs.mirrors != '[]'
        uses: actions/github-script@v9
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MIRRORS: ${{ inputs.mirrors }}
        with:
          script: |
            const { execFileSync } = require("node:child_process");
            const fs = require("node:fs");
            const path = require("node:path");

            function git(args, cwd, extraEnv = {}) {
              try {
                return execFileSync("git", args, {
                  cwd,
                  encoding: "utf8",
                  stdio: ["ignore", "pipe", "pipe"],
                  env: { ...process.env, ...extraEnv },
                }).trimEnd();
              } catch (error) {
                throw new Error(
                  `git ${args.join(" ")} failed: ${error.stderr?.toString() ?? error.message}`,
                );
              }
            }

            const mirrors = JSON.parse(process.env.MIRRORS);
            const prepared = [];
            for (const mirror of mirrors) {
              const currentSource = git([
                "ls-remote", "--heads", mirror.source_url,
                `refs/heads/${mirror.source_branch}`,
              ], process.env.GITHUB_WORKSPACE).split(/\s+/)[0];
              if (currentSource !== mirror.source_sha) {
                throw new Error(
                  `Upstream ${mirror.source_branch} changed after planning; retry.`,
                );
              }

              const currentTargetOutput = git([
                "ls-remote", "--heads", "https://github.com/" +
                  process.env.GITHUB_REPOSITORY + ".git",
                `refs/heads/${mirror.target_branch}`,
              ], process.env.GITHUB_WORKSPACE);
              const currentTarget = currentTargetOutput
                ? currentTargetOutput.split(/\s+/)[0]
                : "";
              if (
                mirror.target_exists
                  ? currentTarget !== mirror.target_sha
                  : Boolean(currentTarget)
              ) {
                throw new Error(
                  `Mirror ${mirror.target_branch} changed after planning; retry.`,
                );
              }

              const repoPath = process.env.GITHUB_WORKSPACE;
              const upstreamRemote = `rpm-upstream-${mirror.id}`;
              const sourceRef = `refs/remotes/${upstreamRemote}/source`;
              git(["remote", "add", upstreamRemote, mirror.source_url], repoPath);
              git([
                "fetch", "--quiet", "--no-tags", upstreamRemote,
                `refs/heads/${mirror.source_branch}:${sourceRef}`,
              ], repoPath);
              if (git(["rev-parse", sourceRef], repoPath) !== mirror.source_sha) {
                throw new Error(
                  `Upstream ${mirror.source_branch} changed during setup; retry.`,
                );
              }

              let baseSha = currentTarget;
              if (!baseSha) {
                const token = process.env.GITHUB_TOKEN;
                const authHeader = `AUTHORIZATION: basic ${Buffer.from(
                  `x-access-token:${token}`,
                ).toString("base64")}`;
                git([
                  "push", "--quiet",
                  `https://github.com/${process.env.GITHUB_REPOSITORY}.git`,
                  `${sourceRef}:refs/heads/${mirror.target_branch}`,
                ], repoPath, {
                  GIT_CONFIG_COUNT: "1",
                  GIT_CONFIG_KEY_0: "http.https://github.com/.extraheader",
                  GIT_CONFIG_VALUE_0: authHeader,
                });
                baseSha = mirror.source_sha;
              }

              const remoteRef = `refs/remotes/rpm-mirror/${mirror.id}`;
              git([
                "fetch", "--quiet", "--no-tags",
                `https://github.com/${process.env.GITHUB_REPOSITORY}.git`,
                `refs/heads/${mirror.target_branch}:${remoteRef}`,
              ], repoPath);
              const fetchedSha = git(
                ["rev-parse", remoteRef],
                repoPath,
              );
              if (fetchedSha !== baseSha) {
                throw new Error(`Mirror ${mirror.target_branch} changed during setup.`);
              }

              const worktree = path.join(
                process.env.RUNNER_TEMP,
                "rpm-mirrors",
                mirror.id,
              );
              fs.mkdirSync(path.dirname(worktree), { recursive: true });
              git(["worktree", "add", "--detach", worktree, fetchedSha], repoPath);
              git(["config", "user.name", "Copilot RPM Mirror"], worktree);
              git([
                "config", "user.email",
                "copilot-rpm-mirror@users.noreply.github.com",
              ], worktree);
              git(["config", "commit.gpgsign", "false"], worktree);

              const markerExists = Boolean(mirror.marker_patch_id);
              if (!markerExists) {
                git([
                  "commit", "--allow-empty",
                  "-m", `PATCH/${mirror.source_branch}`,
                  "-m", `Patch-ID: ${mirror.patch_id}`,
                ], worktree);
              }

              let pendingCommits = [];
              for (let index = 0; index < mirror.missing_commits.length; index++) {
                const commit = mirror.missing_commits[index];
                try {
                  git(["cherry-pick", commit], worktree);
                } catch (error) {
                  let cherryPick = false;
                  try {
                    git(
                      ["rev-parse", "--verify", "-q", "CHERRY_PICK_HEAD"],
                      worktree,
                    );
                    cherryPick = true;
                  } catch {
                    cherryPick = false;
                  }
                  if (!cherryPick) throw error;
                  core.info(
                    `Cherry-pick ${commit} needs Copilot conflict resolution.`,
                  );
                  pendingCommits = mirror.missing_commits.slice(index + 1);
                  break;
                }
              }

              const metadata = {
                project: mirror.project,
                target_el: mirror.target_el,
                target_version: mirror.target_version,
                source_url: mirror.source_url,
                source_branch: mirror.source_branch,
                spec: mirror.spec,
                source_sha: mirror.source_sha,
                patch_id: mirror.patch_id,
              };
              fs.writeFileSync(
                path.join(worktree, ".rpm-mirror.json"),
                `${JSON.stringify(metadata, null, 2)}\n`,
              );
              const contextPath = path.join(
                process.env.RUNNER_TEMP,
                `${mirror.id}.json`,
              );
              const sourceSpec = git(
                ["show", `${sourceRef}:${mirror.spec}`],
                worktree,
              );
              const upstreamSpecDiff = git([
                "diff", "--no-ext-diff",
                baseSha, sourceRef, "--", mirror.spec,
              ], worktree);
              const currentSpec = fs.readFileSync(
                path.join(worktree, mirror.spec),
                "utf8",
              );
              const conflictedFiles = git([
                "diff", "--name-only", "--diff-filter=U",
              ], worktree).split("\n").filter(Boolean);
              const conflictDiff = git([
                "diff", "--no-ext-diff", "--cc",
              ], worktree);
              const conflictedContents = Object.fromEntries(
                conflictedFiles.map((file) => [
                  file,
                  fs.readFileSync(path.join(worktree, file), "utf8"),
                ]),
              );
              fs.writeFileSync(contextPath, `${JSON.stringify({
                ...mirror,
                source_spec: sourceSpec,
                upstream_spec_diff: upstreamSpecDiff,
                current_spec: currentSpec,
                conflicted_files: conflictedFiles,
                conflicted_contents: conflictedContents,
                conflict_diff: conflictDiff,
              }, null, 2)}\n`);
              prepared.push({
                ...mirror,
                pending_commits: pendingCommits,
                metadata,
                source_spec: sourceSpec,
                upstream_spec_diff: upstreamSpecDiff,
                worktree,
                source_ref: sourceRef,
                context_path: contextPath,
                base_sha: baseSha,
                marker_exists: markerExists,
              });
            }

            fs.writeFileSync(
              path.join(process.env.RUNNER_TEMP, "rpm-mirrors.json"),
              `${JSON.stringify(prepared)}\n`,
            );
            core.setOutput("prepared", String(prepared.length > 0));

      - name: Install Copilot CLI
        if: inputs.mirrors != '[]'
        run: npm install --global @github/copilot@1.0.91

      - name: Recreate mirror patches with Copilot
        if: inputs.mirrors != '[]'
        uses: actions/github-script@v9
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          script: |
            const { execFileSync } = require("node:child_process");
            const fs = require("node:fs");
            function git(args, cwd, extraEnv = {}) {
              try {
                return execFileSync("git", args, {
                  cwd,
                  encoding: "utf8",
                  stdio: ["ignore", "pipe", "pipe"],
                  env: { ...process.env, ...extraEnv },
                }).trimEnd();
              } catch (error) {
                throw new Error(
                  `git ${args.join(" ")} failed: ${error.stderr?.toString() ?? error.message}`,
                );
              }
            }
            const mirrors = JSON.parse(
              fs.readFileSync(
                `${process.env.RUNNER_TEMP}/rpm-mirrors.json`,
                "utf8",
              ),
            );
            const instruction = `${process.env.GITHUB_WORKSPACE}/.github/prompts/rpm-mirror-maintenance.md`;
            for (const mirror of mirrors) {
              function currentConflict() {
                try {
                  git(
                    ["rev-parse", "--verify", "-q", "CHERRY_PICK_HEAD"],
                    mirror.worktree,
                  );
                  return true;
                } catch {
                  return false;
                }
              }
              function updateContext() {
                const currentSpec = fs.readFileSync(
                  `${mirror.worktree}/${mirror.spec}`,
                  "utf8",
                );
                const context = {
                  ...mirror,
                  current_spec: currentSpec,
                  conflicted_files: git([
                    "diff", "--name-only", "--diff-filter=U",
                  ], mirror.worktree).split("\n").filter(Boolean),
                  conflicted_contents: Object.fromEntries(
                    git([
                      "diff", "--name-only", "--diff-filter=U",
                    ], mirror.worktree)
                      .split("\n")
                      .filter(Boolean)
                      .map((file) => [
                        file,
                        fs.readFileSync(
                          `${mirror.worktree}/${file}`,
                          "utf8",
                        ),
                      ]),
                  ),
                  conflict_diff: git([
                    "diff", "--no-ext-diff", "--cc",
                  ], mirror.worktree),
                };
                fs.writeFileSync(
                  mirror.context_path,
                  `${JSON.stringify(context, null, 2)}\n`,
                );
              }
              function askCopilot(prompt) {
                updateContext();
                execFileSync("copilot", [
                  "-C", mirror.worktree,
                  "-p",
                  prompt,
                  "--attachment", instruction,
                  "--attachment", mirror.context_path,
                  "--model", "gpt-6-luna",
                  "--reasoning-effort", "max",
                  "--context", "long_context",
                  "--allow-tool=write",
                  "--deny-tool=shell",
                  "-s",
                ], {
                  cwd: mirror.worktree,
                  stdio: "inherit",
                  env: process.env,
                });
              }
              function resolveConflict() {
                if (!currentConflict()) return;
                askCopilot(
                  "Resolve the active upstream cherry-pick conflict using " +
                    "the attached instruction and context. Edit only the " +
                    "conflicted files " +
                    "needed for this mirror; do not run shell commands or " +
                    "stage or continue the cherry-pick.",
                );
                const conflictedFiles = git([
                  "diff", "--name-only", "--diff-filter=U",
                ], mirror.worktree).split("\n").filter(Boolean);
                const markersRemaining = conflictedFiles.filter((file) =>
                  fs.existsSync(`${mirror.worktree}/${file}`) &&
                    /^(<<<<<<< |=======$|>>>>>>> )/m.test(
                      fs.readFileSync(
                        `${mirror.worktree}/${file}`,
                        "utf8",
                      ),
                    )
                );
                git(["add", "--", ...conflictedFiles], mirror.worktree);
                const unresolved = git([
                  "diff", "--name-only", "--diff-filter=U",
                ], mirror.worktree);
                if (unresolved || markersRemaining.length) {
                  throw new Error(
                    `Copilot left unresolved conflicts in ${mirror.target_branch}`,
                  );
                }
                git(
                  ["cherry-pick", "--continue"],
                  mirror.worktree,
                  { GIT_EDITOR: "true" },
                );
              }

              resolveConflict();
              for (const commit of mirror.pending_commits) {
                try {
                  git(["cherry-pick", commit], mirror.worktree);
                } catch (error) {
                  if (!currentConflict()) throw error;
                  resolveConflict();
                }
              }
              askCopilot(
                "Read the attached repository instruction and mirror context, " +
                  "then update only this mirror's package spec.",
              );

              const spec = fs.readFileSync(
                `${mirror.worktree}/${mirror.spec}`,
                "utf8",
              );
              let expectedSpec = mirror.source_spec;
              if (
                mirror.project === "cri-o" &&
                String(mirror.target_el) === "9"
              ) {
                if (
                  !/^Suggests:\s+containernetworking-plugins\b/m.test(
                    expectedSpec,
                  )
                ) {
                  const recommendation = expectedSpec.match(
                    /^Recommends:.*$/m,
                  );
                  if (!recommendation) {
                    throw new Error("CRI-O source spec has no Recommends line");
                  }
                  expectedSpec = expectedSpec.replace(
                    recommendation[0],
                    `${recommendation[0]}\nSuggests:       containernetworking-plugins >= 1.0.0-1`,
                  );
                }
                if (
                  !/^\s*--cni-plugin-dir "%\{_libexecdir\}\/cni" \\$/m.test(
                    expectedSpec,
                  )
                ) {
                  const pluginDir = expectedSpec.match(
                    /^([ \t]*)--cni-plugin-dir \/opt\/cni\/bin[ \t]*\\$/m,
                  );
                  if (!pluginDir) {
                    throw new Error(
                      "CRI-O source spec has no /opt/cni/bin setting",
                    );
                  }
                  expectedSpec = expectedSpec.replace(
                    pluginDir[0],
                    `${pluginDir[0]}\n${pluginDir[1]}--cni-plugin-dir "%{_libexecdir}/cni" \\`,
                  );
                }
              }
              const sourceReleases = [
                ...expectedSpec.matchAll(/^Release:\s*(\S+)/gm),
              ];
              if (sourceReleases.length !== 1) {
                throw new Error(
                  `Expected one Release field in ${mirror.spec}`,
                );
              }
              const baseRelease = sourceReleases[0][1].replace(
                /\.fallback\.[^%\s]+/g,
                "",
              );
              const expectedSuffix = `.fallback.${mirror.patch_id}`;
              const release = baseRelease.includes("%{?dist}")
                ? baseRelease.replace(
                    "%{?dist}",
                    `${expectedSuffix}%{?dist}`,
                  )
                : `${baseRelease}${expectedSuffix}`;
              expectedSpec = expectedSpec.replace(
                /^(Release:\s*)\S+/m,
                (_match, prefix) => `${prefix}${release}`,
              );
              if (spec !== expectedSpec) {
                throw new Error(
                  `Copilot produced changes outside the allowed RPM spec patch for ${mirror.spec}`,
                );
              }
              const metadata = JSON.parse(fs.readFileSync(
                `${mirror.worktree}/.rpm-mirror.json`,
                "utf8",
              ));
              if (JSON.stringify(metadata) !== JSON.stringify(mirror.metadata)) {
                throw new Error(
                  `Copilot modified mirror metadata on ${mirror.target_branch}`,
                );
              }
              const releases = [
                ...spec.matchAll(/^Release:\s*(\S+)/gm),
              ].map((match) => match[1]);
              const suffix = `.fallback.${mirror.patch_id}`;
              if (
                releases.length !== 1 ||
                (releases[0].match(/\.fallback\./g) ?? []).length !== 1 ||
                !releases[0].includes(suffix) ||
                (releases[0].includes("%{?dist}") &&
                  releases[0].indexOf(suffix) >
                    releases[0].indexOf("%{?dist}"))
              ) {
                throw new Error(
                  `${mirror.spec} is missing deterministic Release suffix ${suffix}`,
                );
              }

              const unresolved = execFileSync(
                "git",
                ["diff", "--name-only", "--diff-filter=U"],
                { cwd: mirror.worktree, encoding: "utf8" },
              ).trim();
              let cherryPick = false;
              try {
                execFileSync(
                  "git",
                  ["rev-parse", "--verify", "-q", "CHERRY_PICK_HEAD"],
                  {
                    cwd: mirror.worktree,
                    encoding: "utf8",
                    stdio: ["ignore", "pipe", "ignore"],
                  },
                );
                cherryPick = true;
              } catch {
                cherryPick = false;
              }
              if (unresolved || cherryPick) {
                throw new Error(`Unresolved cherry-pick in ${mirror.target_branch}`);
              }
              const changedFiles = execFileSync(
                "git",
                ["diff", "--name-only", "-z", mirror.source_ref, "HEAD"],
                { cwd: mirror.worktree, encoding: "utf8" },
              ).split("\0").filter(Boolean);
              const stagedFiles = execFileSync(
                "git",
                ["diff", "--cached", "--name-only", "-z"],
                { cwd: mirror.worktree, encoding: "utf8" },
              ).split("\0").filter(Boolean);
              const unstagedFiles = execFileSync(
                "git",
                ["diff", "--name-only", "-z"],
                { cwd: mirror.worktree, encoding: "utf8" },
              ).split("\0").filter(Boolean);
              const untrackedFiles = execFileSync(
                "git",
                ["ls-files", "--others", "--exclude-standard", "-z"],
                { cwd: mirror.worktree, encoding: "utf8" },
              ).split("\0").filter(Boolean);
              const allowedFiles = new Set([
                mirror.spec,
                ".rpm-mirror.json",
              ]);
              const unexpectedFiles = [
                ...new Set([
                  ...changedFiles,
                  ...stagedFiles,
                  ...unstagedFiles,
                  ...untrackedFiles,
                ]),
              ].filter((file) => !allowedFiles.has(file));
              if (unexpectedFiles.length) {
                throw new Error(
                  `Unexpected mirror changes: ${unexpectedFiles.join(", ")}`,
                );
              }
              const missing = execFileSync(
                "git",
                ["cherry", "HEAD", mirror.source_ref],
                { cwd: mirror.worktree, encoding: "utf8" },
              ).split("\n").filter((line) => line.startsWith("+ "));
              if (missing.length) {
                throw new Error(
                  `${mirror.target_branch} still lacks upstream commits`,
                );
              }
              execFileSync(
                "git",
                ["add", "-A", "--", mirror.spec, ".rpm-mirror.json"],
                { cwd: mirror.worktree },
              );
              const stagedPaths = execFileSync(
                "git",
                ["diff", "--cached", "--name-only", "-z"],
                { cwd: mirror.worktree, encoding: "utf8" },
              ).split("\0").filter(Boolean);
              const unexpectedStaged = stagedPaths.filter(
                (file) => !allowedFiles.has(file),
              );
              if (unexpectedStaged.length) {
                throw new Error(
                  `Unexpected staged mirror changes: ${unexpectedStaged.join(", ")}`,
                );
              }
              try {
                execFileSync(
                  "git",
                  ["diff", "--cached", "--quiet"],
                  { cwd: mirror.worktree, stdio: "ignore" },
                );
              } catch {
                execFileSync(
                  "git",
                  ["commit", "-m", `Update ${mirror.project} RPM mirror`],
                  { cwd: mirror.worktree, stdio: "inherit" },
                );
              }
            }

      - name: Push signed mirror commits
        if: inputs.mirrors != '[]'
        uses: actions/github-script@v9
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          script: |
            const { execFileSync } = require("node:child_process");
            const fs = require("node:fs");
            const mirrors = JSON.parse(
              fs.readFileSync(
                `${process.env.RUNNER_TEMP}/rpm-mirrors.json`,
                "utf8",
              ),
            );
            for (const mirror of mirrors) {
              execFileSync(
                "npx",
                [
                  "--yes",
                  "push-signed-commits@1.2.1",
                  process.env.GITHUB_REPOSITORY,
                  mirror.target_branch,
                  `${mirror.base_sha}..HEAD`,
                ],
                {
                  cwd: mirror.worktree,
                  stdio: "inherit",
                  env: process.env,
                },
              );
            }
