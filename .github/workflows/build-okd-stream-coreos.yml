name: Build and Publish OKD Stream CoreOS

on:
  workflow_call:
    inputs:
      version:
        description: OKD release version
        required: true
        type: string
      release_tag:
        description: Stable OKD release tag
        required: true
        type: string
      release_image:
        description: Digest-pinned OKD release payload
        required: true
        type: string
      release_commit:
        description: Source commit for the OKD release
        required: true
        type: string
      base_stream:
        description: CentOS Stream base identifier
        required: true
        type: string
      os_major:
        description: CentOS Stream major version
        required: true
        type: string
      repo_version:
        description: OpenShift package repository version
        required: true
        type: string
      rpm_targets:
        description: JSON array of RPM build targets
        required: true
        type: string
permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: ${{ inputs.version }}-${{ inputs.base_stream }}
  cancel-in-progress: false

jobs:
  resolve-source:
    runs-on: ubuntu-latest
    outputs:
      stream_image: ${{ steps.images.outputs.stream_image }}
      stream_info: ${{ steps.images.outputs.stream_info }}
      dtk_image: ${{ steps.images.outputs.dtk_image }}
      dtk_info: ${{ steps.images.outputs.dtk_info }}
      compose: ${{ steps.images.outputs.compose }}
      skip_build: ${{ steps.images.outputs.skip_build }}
    env:
      OKD_VERSION: ${{ inputs.version }}
      RELEASE_IMAGE: ${{ inputs.release_image }}
      BASE_STREAM: ${{ inputs.base_stream }}
    steps:
      - name: Install oc
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "4"

      - name: Install registry inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y skopeo

      - name: Resolve release images
        id: images
        uses: actions/github-script@v9
        env:
          RELEASE_IMAGE: ${{ inputs.release_image }}
          BASE_STREAM: ${{ inputs.base_stream }}
        with:
          script: |
            const { execFileSync } = require("node:child_process");
            const releaseImage = process.env.RELEASE_IMAGE;
            const baseStream = process.env.BASE_STREAM;

            function run(command, args) {
              return execFileSync(command, args, {
                encoding: "utf8",
                stdio: ["ignore", "pipe", "ignore"],
              }).trim();
            }

            function releaseImageFor(component) {
              try {
                return run("oc", [
                  "adm",
                  "release",
                  "info",
                  "--image-for",
                  component,
                  releaseImage,
                ]);
              } catch {
                return "";
              }
            }

            function inspectImage(imageRef) {
              const image = JSON.parse(
                run("skopeo", ["inspect", `docker://${imageRef}`])
              );
              const labels = image.Labels ?? {};
              return {
                digest: image.Digest,
                stream: labels["com.coreos.stream"] ?? "",
                version:
                  labels["org.opencontainers.image.version"] ??
                  labels["com.coreos.buildid"] ??
                  "unknown",
                revision:
                  labels["org.opencontainers.image.revision"] ??
                  labels["io.openshift.build.commit.id"] ??
                  "unknown",
                scos_base_digest:
                  labels["io.okd.source.scos-base.digest"] ?? "unknown",
                scos_base_version:
                  labels["io.okd.source.scos-base.version"] ?? "unknown",
                scos_base_revision:
                  labels["io.okd.source.scos-base.revision"] ?? "unknown",
                openshift_os_revision:
                  labels["io.okd.source.openshift-os.revision"] ?? "unknown",
                rpm_build_run:
                  labels["io.okd.source.rpm-build.run"] ?? "unknown",
              };
            }

            let streamImage = releaseImageFor("stream-coreos");
            let dtkImage = releaseImageFor("driver-toolkit");
            let streamInfo = {};
            let dtkInfo = {};
            let compose = false;
            let skipBuild = false;

            if (streamImage) {
              streamInfo = inspectImage(streamImage);
              if (streamInfo.stream !== baseStream) {
                core.info(
                  `Release stream-coreos is for ${streamInfo.stream}, ` +
                  `not ${baseStream}.`
                );
                streamImage = "";
                streamInfo = {};
              }
            }
            if (!streamImage) {
              if (baseStream === "c10s") {
                core.info(
                  "No matching c10s stream-coreos image; " +
                  "c10s has no base fallback."
                );
                skipBuild = true;
              } else {
                compose = true;
              }
            }

            if (dtkImage) {
              dtkInfo = inspectImage(dtkImage);
              if (dtkInfo.stream && dtkInfo.stream !== baseStream) {
                core.info(
                  `Release driver-toolkit is for ${dtkInfo.stream}, ` +
                  `not ${baseStream}.`
                );
                dtkImage = "";
                dtkInfo = {};
              } else if (!dtkInfo.stream && !streamImage) {
                dtkImage = "";
                dtkInfo = {};
              }
            }
            if (!dtkImage && streamImage) {
              dtkImage = streamImage;
              dtkInfo = streamInfo;
            }

            core.setOutput("stream_image", streamImage);
            core.setOutput("stream_info", JSON.stringify(streamInfo));
            core.setOutput("dtk_image", dtkImage);
            core.setOutput("dtk_info", JSON.stringify(dtkInfo));
            core.setOutput("compose", String(compose));
            core.setOutput("skip_build", String(skipBuild));

  build-rpms:
    needs: resolve-source
    if: needs.resolve-source.outputs.compose == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.rpm_targets) }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/rpm-build.yml
    with:
      okd_version: ${{ matrix.okd_version }}
      os_version: ${{ matrix.os_version }}
      build_sig: ${{ matrix.build_sig }}
      run_test: ${{ matrix.run_test }}

  compose-base-image:
    needs:
      - resolve-source
      - build-rpms
    if: needs.resolve-source.outputs.compose == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      image_ref: ${{ steps.compose.outputs.image_ref }}
    env:
      OKD_VERSION: ${{ inputs.version }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_IMAGE: ${{ inputs.release_image }}
      RELEASE_COMMIT: ${{ inputs.release_commit }}
      BASE_STREAM: ${{ inputs.base_stream }}
      OS_MAJOR: ${{ inputs.os_major }}
      REPO_VERSION: ${{ inputs.repo_version }}
    steps:
      - name: Checkout matching openshift/os source
        uses: actions/checkout@v4
        with:
          repository: openshift/os
          ref: release-${{ inputs.version }}
          path: openshift-os
          persist-credentials: false

      - name: Install image and RPM repository tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            createrepo-c podman skopeo

      - name: Allow provider RPM package names in the local repo
        working-directory: openshift-os
        run: |
          set -euo pipefail
          script=build-node-image.sh
          old="ose-gcp-gcr-*'"
          new="ose-gcp-gcr-*,ecr-credential-provider*,acr-credential-provider*"
          new+=",gcr-credential-provider*'"
          if [[ $(grep -Fo "$old" "$script" | wc -l) -ne 1 ]]; then
            echo "Pinned OS repo package allowlist not found as expected." >&2
            exit 1
          fi
          sed -i "s/ose-gcp-gcr-\\*'/${new}/" "$script"
          grep -F "includepkgs=" "$script"

      - name: Download matching RPM artifacts
        uses: actions/download-artifact@v4.1.3
        with:
          pattern: "*-rpms-okd${{ inputs.version }}-el${{ inputs.os_major }}"
          path: ${{ runner.temp }}/okd-rpms
          merge-multiple: true

      - name: Prepare the local RPM repository
        env:
          RPM_REPO_VERSION: ${{ inputs.repo_version }}
        run: |
          set -euo pipefail
          rpm_dir="$RUNNER_TEMP/okd-rpms"
          mapfile -d '' rpms < <(
            find "$rpm_dir" -type f -name '*.rpm' -print0
          )
          if (( ${#rpms[@]} == 0 )); then
            echo "The selected run has no matching EL${OS_MAJOR} RPMs." >&2
            exit 1
          fi
          for package in \
            cri-o \
            cri-tools \
            conmon-rs \
            ecr-credential-provider \
            acr-credential-provider \
            gcr-credential-provider; do
            if ! find "$rpm_dir" -type f \
              -name "${package}-*.rpm" -print -quit | grep -q .; then
              echo "The selected run is missing ${package} RPMs." >&2
              exit 1
            fi
          done

          createrepo_c "$rpm_dir"
          cat > "$RUNNER_TEMP/yumrepos" <<EOF
          [rhel-${RPM_REPO_VERSION}-server-ose-${OKD_VERSION}]
          name=OpenShift RPM build artifacts
          baseurl=file:///var/tmp/okd-rpm-repo
          enabled=1
          gpgcheck=0
          EOF

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" |
            podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Compose and publish machine image
        id: compose
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          BASE_IMAGE="ghcr.io/${IMAGE_OWNER,,}/scos-base:${BASE_STREAM}"
          base_info=$(skopeo inspect "docker://${BASE_IMAGE}")
          base_digest=$(jq -r '.Digest' <<< "$base_info")
          base_version=$(jq -r \
            '.Labels["org.opencontainers.image.version"] // "unknown"' \
            <<< "$base_info")
          base_revision=$(jq -r \
            '.Labels["org.opencontainers.image.revision"] // "unknown"' \
            <<< "$base_info")
          os_revision=$(git -C "$GITHUB_WORKSPACE/openshift-os" rev-parse HEAD)
          image_ref="ghcr.io/${IMAGE_OWNER,,}/stream-coreos:compose-${OKD_VERSION}-${BASE_STREAM}-${GITHUB_RUN_ID}"
          podman build \
            --from "$BASE_IMAGE" \
            --label "org.opencontainers.image.version=${OKD_VERSION}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.base.name=${BASE_IMAGE}" \
            --label "org.opencontainers.image.base.digest=${base_digest}" \
            --label "io.okd.source.release.tag=${RELEASE_TAG}" \
            --label "io.okd.source.release.payload=${RELEASE_IMAGE}" \
            --label "io.okd.source.release.revision=${RELEASE_COMMIT}" \
            --label "io.okd.source.scos-base.version=${base_version}" \
            --label "io.okd.source.scos-base.digest=${base_digest}" \
            --label "io.okd.source.scos-base.revision=${base_revision}" \
            --label "io.okd.source.openshift-os.revision=${os_revision}" \
            --label "io.okd.source.rpm-build.run=${GITHUB_RUN_ID}" \
            --secret id=yumrepos,src="$RUNNER_TEMP/yumrepos" \
            --volume "$RUNNER_TEMP/okd-rpms:/var/tmp/okd-rpm-repo:ro" \
            --security-opt label=disable \
            --tag "$image_ref" \
            "$GITHUB_WORKSPACE/openshift-os"
          podman push "$image_ref" "docker://${image_ref}"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"

  publish-overlays:
    needs:
      - resolve-source
      - build-rpms
      - compose-base-image
    if: >-
      ${{
        always() &&
        needs.resolve-source.result == 'success' &&
        needs.resolve-source.outputs.skip_build != 'true' &&
        (
          needs.build-rpms.result == 'success' ||
          needs.build-rpms.result == 'skipped'
        ) &&
        (
          needs.compose-base-image.result == 'success' ||
          needs.compose-base-image.result == 'skipped'
        )
      }}
    runs-on: ubuntu-latest
    env:
      OKD_VERSION: ${{ inputs.version }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_IMAGE: ${{ inputs.release_image }}
      RELEASE_COMMIT: ${{ inputs.release_commit }}
      BASE_STREAM: ${{ inputs.base_stream }}
      OS_MAJOR: ${{ inputs.os_major }}
      STREAM_IMAGE: ${{ needs.resolve-source.outputs.stream_image }}
      DTK_IMAGE: ${{ needs.resolve-source.outputs.dtk_image }}
      COMPOSED_IMAGE: ${{ needs.compose-base-image.outputs.image_ref }}
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y jq podman skopeo

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" |
            podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Select kernel package version
        id: kernel
        run: |
          set -euo pipefail
          kernel_version=$(
            podman run --rm --pull=always \
              "quay.io/centos/centos:stream${OS_MAJOR}" \
              bash -ec '
                dnf install -y dnf-plugins-core >/dev/null 2>&1
                dnf repoquery --latest-limit=1 \
                  --qf "%{VERSION}-%{RELEASE}" kernel-core
              '
          )
          kernel_pattern="^[0-9][A-Za-z0-9._+-]*\\.el${OS_MAJOR}$"
          if [[ ! "$kernel_version" =~ $kernel_pattern ]]; then
            echo "Could not resolve a valid EL${OS_MAJOR} kernel version." >&2
            exit 1
          fi
          echo "version=$kernel_version" >> "$GITHUB_OUTPUT"

      - name: Resolve image provenance
        id: provenance
        uses: actions/github-script@v9
        env:
          STREAM_IMAGE: ${{ needs.resolve-source.outputs.stream_image }}
          STREAM_INFO: ${{ needs.resolve-source.outputs.stream_info }}
          DTK_IMAGE: ${{ needs.resolve-source.outputs.dtk_image }}
          DTK_INFO: ${{ needs.resolve-source.outputs.dtk_info }}
          COMPOSED_IMAGE: ${{ needs.compose-base-image.outputs.image_ref }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        with:
          script: |
            const { execFileSync } = require("node:child_process");
            const streamImage =
              process.env.STREAM_IMAGE || process.env.COMPOSED_IMAGE;
            const dtkImage = process.env.DTK_IMAGE || streamImage;
            if (!streamImage || !dtkImage) {
              throw new Error("Could not select overlay source images.");
            }

            function inspectImage(imageRef) {
              const result = execFileSync(
                "skopeo",
                ["inspect", `docker://${imageRef}`],
                { encoding: "utf8" }
              );
              return JSON.parse(result);
            }

            function metadata(rawInfo, imageRef) {
              const info = JSON.parse(rawInfo || "{}");
              const source = info && Object.keys(info).length
                ? info
                : inspectImage(imageRef);
              const labels = source.Labels ?? {};
              const value = (key, fallback = "unknown") =>
                labels[key] ?? fallback;
              const resolved = {
                digest: source.digest ?? source.Digest ?? "unknown",
                version:
                  source.version ??
                  value("org.opencontainers.image.version",
                    labels["com.coreos.buildid"] ?? "unknown"),
                revision:
                  source.revision ??
                  value("org.opencontainers.image.revision",
                    labels["io.openshift.build.commit.id"] ?? "unknown"),
                scos_base_version:
                  source.scos_base_version ??
                  value("io.okd.source.scos-base.version"),
                scos_base_digest:
                  source.scos_base_digest ??
                  value("io.okd.source.scos-base.digest"),
                scos_base_revision:
                  source.scos_base_revision ??
                  value("io.okd.source.scos-base.revision"),
                openshift_os_revision:
                  source.openshift_os_revision ??
                  value("io.okd.source.openshift-os.revision"),
                rpm_build_run:
                  source.rpm_build_run ??
                  value("io.okd.source.rpm-build.run"),
              };
              if (resolved.version === "unknown") {
                resolved.version = process.env.RELEASE_TAG;
              }
              if (resolved.revision === "unknown") {
                resolved.revision = process.env.RELEASE_COMMIT;
              }
              if (imageRef === process.env.COMPOSED_IMAGE) {
                resolved.version = process.env.RELEASE_TAG;
                resolved.revision = process.env.RELEASE_COMMIT;
              }
              return resolved;
            }

            const sources = {
              STREAM: {
                image: streamImage,
                info: process.env.STREAM_INFO,
              },
              DTK: {
                image: dtkImage,
                info: process.env.DTK_INFO,
              },
            };
            for (const [prefix, source] of Object.entries(sources)) {
              core.exportVariable(`${prefix}_SOURCE_IMAGE`, source.image);
              for (const [key, value] of Object.entries(
                metadata(source.info, source.image)
              )) {
                const name = `${prefix}_SOURCE_${key.toUpperCase()}`;
                core.exportVariable(name, value);
              }
            }

      - name: Build and publish overlay images
        uses: actions/github-script@v9
        env:
          KERNEL_VERSION: ${{ steps.kernel.outputs.version }}
        with:
          script: |
            const { execFileSync } = require("node:child_process");
            const owner = process.env.GITHUB_REPOSITORY_OWNER.toLowerCase();
            const sourceUrl =
              `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}`;
            const imageTag =
              `${process.env.OKD_VERSION}-${process.env.BASE_STREAM}`;
            const commonLabels = {
              "org.opencontainers.image.source": sourceUrl,
              "org.opencontainers.image.version": process.env.OKD_VERSION,
              "org.opencontainers.image.revision": process.env.GITHUB_SHA,
              "io.okd.source.release.tag": process.env.RELEASE_TAG,
              "io.okd.source.release.payload": process.env.RELEASE_IMAGE,
              "io.okd.source.release.revision": process.env.RELEASE_COMMIT,
              "io.okd.source.base.stream": process.env.BASE_STREAM,
              "io.okd.source.kernel.version": process.env.KERNEL_VERSION,
            };
            const images = [
              {
                name: "stream-coreos",
                prefix: "STREAM",
                dockerfile: "Dockerfile",
              },
              {
                name: "driver-toolkit",
                prefix: "DTK",
                dockerfile: "Dockerfile.dtk",
              },
            ];
            for (const image of images) {
              const prefix = image.prefix;
              const sourceImage = process.env[`${prefix}_SOURCE_IMAGE`];
              const labels = {
                ...commonLabels,
                "org.opencontainers.image.base.name": sourceImage,
                "org.opencontainers.image.base.digest":
                  process.env[`${prefix}_SOURCE_DIGEST`],
                "io.okd.source.image.version":
                  process.env[`${prefix}_SOURCE_VERSION`],
                "io.okd.source.image.revision":
                  process.env[`${prefix}_SOURCE_REVISION`],
                "io.okd.source.image.digest":
                  process.env[`${prefix}_SOURCE_DIGEST`],
                "io.okd.source.scos-base.version":
                  process.env[`${prefix}_SOURCE_SCOS_BASE_VERSION`],
                "io.okd.source.scos-base.digest":
                  process.env[`${prefix}_SOURCE_SCOS_BASE_DIGEST`],
                "io.okd.source.scos-base.revision":
                  process.env[`${prefix}_SOURCE_SCOS_BASE_REVISION`],
                "io.okd.source.openshift-os.revision":
                  process.env[`${prefix}_SOURCE_OPENSHIFT_OS_REVISION`],
                "io.okd.source.rpm-build.run":
                  process.env[`${prefix}_SOURCE_RPM_BUILD_RUN`],
              };
              const imageRef = `ghcr.io/${owner}/${image.name}:${imageTag}`;
              const args = [
                "build",
                "--build-arg",
                `BASE_IMAGE=${sourceImage}`,
                "--build-arg",
                `VERSION=${process.env.KERNEL_VERSION}`,
                "--build-arg",
                `STREAM_MAJOR=${process.env.OS_MAJOR}`,
              ];
              for (const [key, value] of Object.entries(labels)) {
                args.push("--label", `${key}=${value ?? "unknown"}`);
              }
              args.push(
                "--file",
                image.dockerfile,
                "--tag",
                imageRef,
                "."
              );
              execFileSync("podman", args, { stdio: "inherit" });
              execFileSync("podman", ["push", imageRef], { stdio: "inherit" });
            }
