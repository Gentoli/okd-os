name: Build and Publish OKD Stream CoreOS

on:
  workflow_call:
    inputs:
      version:
        description: OKD release version
        required: true
        type: string
      release_tag:
        description: Stable OKD release tag
        required: true
        type: string
      release_image:
        description: Digest-pinned OKD release payload
        required: true
        type: string
      release_commit:
        description: Source commit for the OKD release
        required: true
        type: string
      base_stream:
        description: CentOS Stream base identifier
        required: true
        type: string
      os_major:
        description: CentOS Stream major version
        required: true
        type: string
      repo_version:
        description: OpenShift package repository version
        required: true
        type: string
      rpm_run_id:
        description: Successful RPM Build Reproduction run ID for base composes
        required: false
        type: string

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: ${{ inputs.version }}-${{ inputs.base_stream }}
  cancel-in-progress: false

jobs:
  resolve-source:
    runs-on: ubuntu-latest
    outputs:
      stream_image: ${{ steps.images.outputs.stream_image }}
      stream_info: ${{ steps.images.outputs.stream_info }}
      dtk_image: ${{ steps.images.outputs.dtk_image }}
      dtk_info: ${{ steps.images.outputs.dtk_info }}
      compose: ${{ steps.images.outputs.compose }}
      skip_build: ${{ steps.images.outputs.skip_build }}
    env:
      OKD_VERSION: ${{ inputs.version }}
      RELEASE_IMAGE: ${{ inputs.release_image }}
      BASE_STREAM: ${{ inputs.base_stream }}
    steps:
      - name: Install oc
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "4"

      - name: Install registry inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y jq skopeo

      - name: Resolve release images
        id: images
        run: |
          set -euo pipefail
          inspect_image() {
            local image_ref=$1
            local inspection
            inspection=$(skopeo inspect "docker://${image_ref}")
            jq -cn \
              --argjson image "$inspection" \
              '{
                digest: $image.Digest,
                stream: ($image.Labels["com.coreos.stream"] // ""),
                version: (
                  $image.Labels["org.opencontainers.image.version"]
                  // $image.Labels["com.coreos.buildid"]
                  // "unknown"
                ),
                revision: (
                  $image.Labels["org.opencontainers.image.revision"]
                  // $image.Labels["io.openshift.build.commit.id"]
                  // "unknown"
                ),
                scos_base_digest: (
                  $image.Labels["io.okd.source.scos-base.digest"] // "unknown"
                ),
                scos_base_revision: (
                  $image.Labels["io.okd.source.scos-base.revision"] // "unknown"
                ),
                openshift_os_revision: (
                  $image.Labels["io.okd.source.openshift-os.revision"]
                  // "unknown"
                ),
                rpm_build_run: (
                  $image.Labels["io.okd.source.rpm-build.run"] // "unknown"
                )
              }'
          }

          stream_image=$(oc adm release info \
            --image-for stream-coreos "$RELEASE_IMAGE" 2>/dev/null || true)
          dtk_image=$(oc adm release info \
            --image-for driver-toolkit "$RELEASE_IMAGE" 2>/dev/null || true)
          stream_info='{}'
          dtk_info='{}'
          compose=false
          skip_build=false

          if [[ -n "$stream_image" ]]; then
            stream_info=$(inspect_image "$stream_image")
            stream_base=$(jq -r '.stream' <<< "$stream_info")
            if [[ "$stream_base" != "$BASE_STREAM" ]]; then
              echo "Release stream-coreos is for $stream_base," \
                "not $BASE_STREAM."
              stream_image=""
              stream_info='{}'
            fi
          fi
          if [[ -z "$stream_image" ]]; then
            if [[ "$BASE_STREAM" == "c10s" ]]; then
              echo "No matching c10s stream-coreos image;" \
                "c10s has no base fallback."
              skip_build=true
            else
              compose=true
            fi
          fi

          if [[ -n "$dtk_image" ]]; then
            dtk_info=$(inspect_image "$dtk_image")
            dtk_base=$(jq -r '.stream' <<< "$dtk_info")
            if [[ -n "$dtk_base" && "$dtk_base" != "$BASE_STREAM" ]]; then
              echo "Release driver-toolkit is for $dtk_base, not $BASE_STREAM."
              dtk_image=""
              dtk_info='{}'
            elif [[ -z "$dtk_base" && -z "$stream_image" ]]; then
              dtk_image=""
              dtk_info='{}'
            fi
          fi
          if [[ -z "$dtk_image" && -n "$stream_image" ]]; then
            dtk_image=$stream_image
            dtk_info=$stream_info
          fi
          echo "stream_image=$stream_image" >> "$GITHUB_OUTPUT"
          echo "stream_info=$stream_info" >> "$GITHUB_OUTPUT"
          echo "dtk_image=$dtk_image" >> "$GITHUB_OUTPUT"
          echo "dtk_info=$dtk_info" >> "$GITHUB_OUTPUT"
          echo "compose=$compose" >> "$GITHUB_OUTPUT"
          echo "skip_build=$skip_build" >> "$GITHUB_OUTPUT"

  compose-base-image:
    needs: resolve-source
    if: needs.resolve-source.outputs.compose == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      image_ref: ${{ steps.compose.outputs.image_ref }}
    env:
      RPM_RUN_ID: ${{ inputs.rpm_run_id }}
      OKD_VERSION: ${{ inputs.version }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_IMAGE: ${{ inputs.release_image }}
      RELEASE_COMMIT: ${{ inputs.release_commit }}
      BASE_STREAM: ${{ inputs.base_stream }}
      OS_MAJOR: ${{ inputs.os_major }}
      REPO_VERSION: ${{ inputs.repo_version }}
    steps:
      - name: Validate RPM artifact run ID
        id: rpm-run
        run: |
          set -euo pipefail
          if [[ ! "$RPM_RUN_ID" =~ ^[0-9]{1,20}$ ]]; then
            echo "A numeric rpm_run_id input is required when" \
              "the payload has no matching stream-coreos image." >&2
            exit 1
          fi
          echo "run_id=$RPM_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Checkout matching openshift/os source
        uses: actions/checkout@v4
        with:
          repository: openshift/os
          ref: release-${{ inputs.version }}
          path: openshift-os
          persist-credentials: false

      - name: Install image and RPM repository tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            createrepo-c podman skopeo

      - name: Allow provider RPM package names in the local repo
        working-directory: openshift-os
        run: |
          set -euo pipefail
          script=build-node-image.sh
          old="ose-gcp-gcr-*'"
          new="ose-gcp-gcr-*,ecr-credential-provider*,acr-credential-provider*"
          new+=",gcr-credential-provider*'"
          if [[ $(grep -Fo "$old" "$script" | wc -l) -ne 1 ]]; then
            echo "Pinned OS repo package allowlist not found as expected." >&2
            exit 1
          fi
          sed -i "s/ose-gcp-gcr-\\*'/${new}/" "$script"
          grep -F "includepkgs=" "$script"

      - name: Download matching RPM artifacts
        uses: actions/download-artifact@v4.1.3
        with:
          pattern: "*-rpms-okd${{ inputs.version }}-el${{ inputs.os_major }}"
          path: ${{ runner.temp }}/okd-rpms
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.rpm-run.outputs.run_id }}

      - name: Prepare the local RPM repository
        env:
          RPM_REPO_VERSION: ${{ inputs.repo_version }}
        run: |
          set -euo pipefail
          rpm_dir="$RUNNER_TEMP/okd-rpms"
          mapfile -d '' rpms < <(
            find "$rpm_dir" -type f -name '*.rpm' -print0
          )
          if (( ${#rpms[@]} == 0 )); then
            echo "The selected run has no matching EL${OS_MAJOR} RPMs." >&2
            exit 1
          fi
          for package in \
            cri-o \
            cri-tools \
            conmon-rs \
            ecr-credential-provider \
            acr-credential-provider \
            gcr-credential-provider; do
            if ! find "$rpm_dir" -type f \
              -name "${package}-*.rpm" -print -quit | grep -q .; then
              echo "The selected run is missing ${package} RPMs." >&2
              exit 1
            fi
          done

          createrepo_c "$rpm_dir"
          cat > "$RUNNER_TEMP/yumrepos" <<EOF
          [rhel-${RPM_REPO_VERSION}-server-ose-${OKD_VERSION}]
          name=OpenShift RPM build artifacts
          baseurl=file:///var/tmp/okd-rpm-repo
          enabled=1
          gpgcheck=0
          EOF

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" |
            podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Compose and publish machine image
        id: compose
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          BASE_IMAGE="ghcr.io/${IMAGE_OWNER,,}/scos-base:${BASE_STREAM}"
          base_info=$(skopeo inspect "docker://${BASE_IMAGE}")
          base_digest=$(jq -r '.Digest' <<< "$base_info")
          base_version=$(jq -r \
            '.Labels["org.opencontainers.image.version"] // "unknown"' \
            <<< "$base_info")
          base_revision=$(jq -r \
            '.Labels["org.opencontainers.image.revision"] // "unknown"' \
            <<< "$base_info")
          os_revision=$(git -C "$GITHUB_WORKSPACE/openshift-os" rev-parse HEAD)
          image_ref="ghcr.io/${IMAGE_OWNER,,}/stream-coreos:compose-${OKD_VERSION}-${BASE_STREAM}-${GITHUB_RUN_ID}"
          podman build \
            --from "$BASE_IMAGE" \
            --label "org.opencontainers.image.version=${OKD_VERSION}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.base.name=${BASE_IMAGE}" \
            --label "org.opencontainers.image.base.digest=${base_digest}" \
            --label "io.okd.source.release.tag=${RELEASE_TAG}" \
            --label "io.okd.source.release.payload=${RELEASE_IMAGE}" \
            --label "io.okd.source.release.revision=${RELEASE_COMMIT}" \
            --label "io.okd.source.scos-base.version=${base_version}" \
            --label "io.okd.source.scos-base.digest=${base_digest}" \
            --label "io.okd.source.scos-base.revision=${base_revision}" \
            --label "io.okd.source.openshift-os.revision=${os_revision}" \
            --label "io.okd.source.rpm-build.run=${RPM_RUN_ID}" \
            --secret id=yumrepos,src="$RUNNER_TEMP/yumrepos" \
            --volume "$RUNNER_TEMP/okd-rpms:/var/tmp/okd-rpm-repo:ro" \
            --security-opt label=disable \
            --tag "$image_ref" \
            "$GITHUB_WORKSPACE/openshift-os"
          podman push "$image_ref" "docker://${image_ref}"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"

  publish-overlays:
    needs:
      - resolve-source
      - compose-base-image
    if: >-
      ${{
        always() &&
        needs.resolve-source.result == 'success' &&
        needs.resolve-source.outputs.skip_build != 'true' &&
        (
          needs.compose-base-image.result == 'success' ||
          needs.compose-base-image.result == 'skipped'
        )
      }}
    runs-on: ubuntu-latest
    env:
      OKD_VERSION: ${{ inputs.version }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_IMAGE: ${{ inputs.release_image }}
      RELEASE_COMMIT: ${{ inputs.release_commit }}
      BASE_STREAM: ${{ inputs.base_stream }}
      OS_MAJOR: ${{ inputs.os_major }}
      STREAM_IMAGE: ${{ needs.resolve-source.outputs.stream_image }}
      DTK_IMAGE: ${{ needs.resolve-source.outputs.dtk_image }}
      COMPOSED_IMAGE: ${{ needs.compose-base-image.outputs.image_ref }}
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y jq podman skopeo

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" |
            podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Select overlay source images
        id: overlay-inputs
        run: |
          set -euo pipefail
          stream_image="${STREAM_IMAGE:-$COMPOSED_IMAGE}"
          dtk_image="${DTK_IMAGE:-$stream_image}"
          if [[ -z "$stream_image" || -z "$dtk_image" ]]; then
            echo "Could not select source images for the kernel/GCC overlays." \
              >&2
            exit 1
          fi
          echo "stream_image=$stream_image" >> "$GITHUB_OUTPUT"
          echo "dtk_image=$dtk_image" >> "$GITHUB_OUTPUT"

      - name: Select kernel package version
        id: kernel
        run: |
          set -euo pipefail
          kernel_version=$(
            podman run --rm --pull=always \
              "quay.io/centos/centos:stream${OS_MAJOR}" \
              bash -ec '
                dnf install -y dnf-plugins-core >/dev/null 2>&1
                dnf repoquery --latest-limit=1 \
                  --qf "%{VERSION}-%{RELEASE}" kernel-core
              '
          )
          kernel_pattern="^[0-9][A-Za-z0-9._+-]*\\.el${OS_MAJOR}$"
          if [[ ! "$kernel_version" =~ $kernel_pattern ]]; then
            echo "Could not resolve a valid EL${OS_MAJOR} kernel version." >&2
            exit 1
          fi
          echo "version=$kernel_version" >> "$GITHUB_OUTPUT"

      - name: Resolve image provenance
        id: provenance
        env:
          STREAM_INFO: ${{ needs.resolve-source.outputs.stream_info }}
          DTK_INFO: ${{ needs.resolve-source.outputs.dtk_info }}
          STREAM_IMAGE_REF: ${{ steps.overlay-inputs.outputs.stream_image }}
          DTK_IMAGE_REF: ${{ steps.overlay-inputs.outputs.dtk_image }}
        run: |
          set -euo pipefail
          resolve_metadata() {
            local prefix=$1
            local source_info=$2
            local image_ref=$3
            local digest version revision
            local scos_base_version scos_base_digest scos_base_revision
            local openshift_os_revision rpm_build_run

            if [[ "$source_info" == '{}' ]]; then
              source_info=$(skopeo inspect "docker://${image_ref}")
              digest=$(jq -r '.Digest // "unknown"' <<< "$source_info")
              scos_base_version=$(jq -r \
                '.Labels["io.okd.source.scos-base.version"] // "unknown"' \
                <<< "$source_info")
              scos_base_digest=$(jq -r \
                '.Labels["io.okd.source.scos-base.digest"] // "unknown"' \
                <<< "$source_info")
              scos_base_revision=$(jq -r \
                '.Labels["io.okd.source.scos-base.revision"] // "unknown"' \
                <<< "$source_info")
              openshift_os_revision=$(jq -r \
                '.Labels["io.okd.source.openshift-os.revision"] // "unknown"' \
                <<< "$source_info")
              rpm_build_run=$(jq -r \
                '.Labels["io.okd.source.rpm-build.run"] // "unknown"' \
                <<< "$source_info")
              version=$RELEASE_TAG
              revision=$RELEASE_COMMIT
            else
              digest=$(jq -r '.digest // "unknown"' <<< "$source_info")
              version=$(jq -r '.version // "unknown"' <<< "$source_info")
              revision=$(jq -r '.revision // "unknown"' <<< "$source_info")
              scos_base_version=$(jq -r \
                '.scos_base_version // "unknown"' <<< "$source_info")
              scos_base_digest=$(jq -r \
                '.scos_base_digest // "unknown"' <<< "$source_info")
              scos_base_revision=$(jq -r \
                '.scos_base_revision // "unknown"' <<< "$source_info")
              openshift_os_revision=$(jq -r \
                '.openshift_os_revision // "unknown"' <<< "$source_info")
              rpm_build_run=$(jq -r \
                '.rpm_build_run // "unknown"' <<< "$source_info")
            fi

            [[ "$version" != "unknown" ]] || version=$RELEASE_TAG
            [[ "$revision" != "unknown" ]] || revision=$RELEASE_COMMIT
            {
              echo "${prefix}_digest=$digest"
              echo "${prefix}_version=$version"
              echo "${prefix}_revision=$revision"
              echo "${prefix}_scos_base_version=$scos_base_version"
              echo "${prefix}_scos_base_digest=$scos_base_digest"
              echo "${prefix}_scos_base_revision=$scos_base_revision"
              echo "${prefix}_openshift_os_revision=$openshift_os_revision"
              echo "${prefix}_rpm_build_run=$rpm_build_run"
            } >> "$GITHUB_OUTPUT"
          }

          resolve_metadata stream "$STREAM_INFO" "$STREAM_IMAGE_REF"
          resolve_metadata dtk "$DTK_INFO" "$DTK_IMAGE_REF"

      - name: Build and publish stream-coreos
        env:
          BASE_IMAGE: ${{ steps.overlay-inputs.outputs.stream_image }}
          KERNEL_VERSION: ${{ steps.kernel.outputs.version }}
          SOURCE_IMAGE_REF: ${{ steps.overlay-inputs.outputs.stream_image }}
          SOURCE_DIGEST: ${{ steps.provenance.outputs.stream_digest }}
          SOURCE_VERSION: ${{ steps.provenance.outputs.stream_version }}
          SOURCE_REVISION: ${{ steps.provenance.outputs.stream_revision }}
          SCOS_BASE_VERSION: >-
            ${{ steps.provenance.outputs.stream_scos_base_version }}
          SCOS_BASE_DIGEST: >-
            ${{ steps.provenance.outputs.stream_scos_base_digest }}
          SCOS_BASE_REVISION: >-
            ${{ steps.provenance.outputs.stream_scos_base_revision }}
          OPENSHIFT_OS_REVISION: >-
            ${{ steps.provenance.outputs.stream_openshift_os_revision }}
          RPM_BUILD_RUN: ${{ steps.provenance.outputs.stream_rpm_build_run }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner=${GITHUB_REPOSITORY_OWNER,,}
          image_ref="ghcr.io/${owner}/stream-coreos"
          image_tag="${OKD_VERSION}-${BASE_STREAM}"
          source_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          labels=(
            --label "org.opencontainers.image.source=${source_url}"
            --label "org.opencontainers.image.version=${OKD_VERSION}"
            --label "org.opencontainers.image.revision=${GITHUB_SHA}"
            --label "org.opencontainers.image.base.name=${SOURCE_IMAGE_REF}"
            --label "org.opencontainers.image.base.digest=${SOURCE_DIGEST}"
            --label "io.okd.source.release.tag=${RELEASE_TAG}"
            --label "io.okd.source.release.payload=${RELEASE_IMAGE}"
            --label "io.okd.source.release.revision=${RELEASE_COMMIT}"
            --label "io.okd.source.image.version=${SOURCE_VERSION}"
            --label "io.okd.source.image.revision=${SOURCE_REVISION}"
            --label "io.okd.source.image.digest=${SOURCE_DIGEST}"
            --label "io.okd.source.scos-base.version=${SCOS_BASE_VERSION}"
            --label "io.okd.source.scos-base.digest=${SCOS_BASE_DIGEST}"
            --label "io.okd.source.scos-base.revision=${SCOS_BASE_REVISION}"
            --label \
              "io.okd.source.openshift-os.revision=${OPENSHIFT_OS_REVISION}"
            --label "io.okd.source.rpm-build.run=${RPM_BUILD_RUN}"
            --label "io.okd.source.base.stream=${BASE_STREAM}"
            --label "io.okd.source.kernel.version=${KERNEL_VERSION}"
          )
          podman build \
            --build-arg "BASE_IMAGE=${BASE_IMAGE}" \
            --build-arg "VERSION=${KERNEL_VERSION}" \
            --build-arg "STREAM_MAJOR=${OS_MAJOR}" \
            "${labels[@]}" \
            --file Dockerfile \
            --tag "${image_ref}:${image_tag}" \
            .
          podman push "${image_ref}:${image_tag}"

      - name: Build and publish driver-toolkit
        env:
          BASE_IMAGE: ${{ steps.overlay-inputs.outputs.dtk_image }}
          KERNEL_VERSION: ${{ steps.kernel.outputs.version }}
          SOURCE_IMAGE_REF: ${{ steps.overlay-inputs.outputs.dtk_image }}
          SOURCE_DIGEST: ${{ steps.provenance.outputs.dtk_digest }}
          SOURCE_VERSION: ${{ steps.provenance.outputs.dtk_version }}
          SOURCE_REVISION: ${{ steps.provenance.outputs.dtk_revision }}
          SCOS_BASE_VERSION: >-
            ${{ steps.provenance.outputs.dtk_scos_base_version }}
          SCOS_BASE_DIGEST: >-
            ${{ steps.provenance.outputs.dtk_scos_base_digest }}
          SCOS_BASE_REVISION: >-
            ${{ steps.provenance.outputs.dtk_scos_base_revision }}
          OPENSHIFT_OS_REVISION: >-
            ${{ steps.provenance.outputs.dtk_openshift_os_revision }}
          RPM_BUILD_RUN: ${{ steps.provenance.outputs.dtk_rpm_build_run }}
        run: |
          set -euo pipefail
          owner=${GITHUB_REPOSITORY_OWNER,,}
          image_ref="ghcr.io/${owner}/driver-toolkit"
          image_tag="${OKD_VERSION}-${BASE_STREAM}"
          source_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          labels=(
            --label "org.opencontainers.image.source=${source_url}"
            --label "org.opencontainers.image.version=${OKD_VERSION}"
            --label "org.opencontainers.image.revision=${GITHUB_SHA}"
            --label "org.opencontainers.image.base.name=${SOURCE_IMAGE_REF}"
            --label "org.opencontainers.image.base.digest=${SOURCE_DIGEST}"
            --label "io.okd.source.release.tag=${RELEASE_TAG}"
            --label "io.okd.source.release.payload=${RELEASE_IMAGE}"
            --label "io.okd.source.release.revision=${RELEASE_COMMIT}"
            --label "io.okd.source.image.version=${SOURCE_VERSION}"
            --label "io.okd.source.image.revision=${SOURCE_REVISION}"
            --label "io.okd.source.image.digest=${SOURCE_DIGEST}"
            --label "io.okd.source.scos-base.version=${SCOS_BASE_VERSION}"
            --label "io.okd.source.scos-base.digest=${SCOS_BASE_DIGEST}"
            --label "io.okd.source.scos-base.revision=${SCOS_BASE_REVISION}"
            --label \
              "io.okd.source.openshift-os.revision=${OPENSHIFT_OS_REVISION}"
            --label "io.okd.source.rpm-build.run=${RPM_BUILD_RUN}"
            --label "io.okd.source.base.stream=${BASE_STREAM}"
            --label "io.okd.source.kernel.version=${KERNEL_VERSION}"
          )
          podman build \
            --build-arg "BASE_IMAGE=${BASE_IMAGE}" \
            --build-arg "VERSION=${KERNEL_VERSION}" \
            --build-arg "STREAM_MAJOR=${OS_MAJOR}" \
            "${labels[@]}" \
            --file Dockerfile.dtk \
            --tag "${image_ref}:${image_tag}" \
            .
          podman push "${image_ref}:${image_tag}"
