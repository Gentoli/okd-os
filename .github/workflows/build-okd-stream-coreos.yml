name: Build and Publish OKD Stream CoreOS

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-okd-stream-coreos.yml
      - Dockerfile
      - Dockerfile.dtk
  schedule:
    - cron: "17 6 1,15 * *"
  workflow_dispatch:
    inputs:
      rpm_run_id:
        description: Successful RPM Build Reproduction run ID for base composes
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-okd-stream-coreos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.releases.outputs.matrix }}
    steps:
      - name: Find the latest stable OKD release payloads
        id: releases
        uses: actions/github-script@v9
        with:
          script: |
            const versions = ["4.20", "4.21", "4.22"];
            const releases = [];
            const releasePattern = /^4\.(20|21|22)\.\d+-okd-scos\.\d+$/;
            const imagePattern =
              /^quay\.io\/okd\/scos-release@sha256:[0-9a-f]{64}$/;

            for (let page = 1; page <= 20; page++) {
              const { data } = await github.rest.repos.listReleases({
                owner: "okd-project",
                repo: "okd",
                per_page: 100,
                page,
              });

              for (const release of data) {
                if (release.draft || release.prerelease) continue;
                if (!releasePattern.test(release.tag_name)) continue;
                const image = release.body?.match(/Pull From:\s*(\S+)/)?.[1];
                if (!imagePattern.test(image ?? "")) continue;

                releases.push({
                  version: release.tag_name.match(/^(4\.(?:20|21|22))\./)[1],
                  tag: release.tag_name,
                  image,
                  published_at: release.published_at,
                });
              }

              if (versions.every((version) =>
                releases.some((release) => release.version === version)
              )) break;
              if (data.length < 100) break;
            }

            const latestReleases = Object.fromEntries(
              versions.map((version) => {
                const matching = releases
                  .filter((release) => release.version === version)
                  .sort((a, b) =>
                    (a.published_at ?? "").localeCompare(b.published_at ?? "")
                  );
                return [version, matching.at(-1)];
              })
            );
            if (versions.some((version) => !latestReleases[version])) {
              throw new Error(
                "Could not find stable release payloads for 4.20, 4.21, and 4.22."
              );
            }

            const matrix = [];
            for (const version of versions) {
              const release = latestReleases[version];
              const { data: commit } = await github.rest.repos.getCommit({
                owner: "okd-project",
                repo: "okd",
                ref: release.tag,
              });

              for (const base of ["c9s", "c10s"]) {
                matrix.push({
                  version,
                  release_tag: release.tag,
                  release_image: release.image,
                  release_commit: commit.sha,
                  base,
                  os_major: base.match(/^c(\d+)s$/)[1],
                  repo_version:
                    base === "c10s"
                      ? "10.0"
                      : version === "4.20"
                        ? "9.6"
                        : version === "4.21"
                          ? "9.7"
                          : "9.8",
                });
              }
            }
            core.setOutput("matrix", JSON.stringify(matrix));

  build-and-publish:
    needs: release-matrix
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.release-matrix.outputs.matrix) }}
    env:
      RPM_RUN_ID: ${{ inputs.rpm_run_id }}
      OKD_VERSION: ${{ matrix.version }}
      RELEASE_TAG: ${{ matrix.release_tag }}
      RELEASE_IMAGE: ${{ matrix.release_image }}
      RELEASE_COMMIT: ${{ matrix.release_commit }}
      BASE_STREAM: ${{ matrix.base }}
      OS_MAJOR: ${{ matrix.os_major }}
      REPO_VERSION: ${{ matrix.repo_version }}
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install oc
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "4"

      - name: Install image and RPM repository tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            createrepo-c podman skopeo

      - name: Resolve release images
        id: source-images
        run: |
          set -euo pipefail
          inspect_image() {
            local image_ref=$1
            local inspection
            inspection=$(skopeo inspect "docker://${image_ref}")
            jq -cn \
              --argjson image "$inspection" \
              '{
                digest: $image.Digest,
                stream: ($image.Labels["com.coreos.stream"] // ""),
                version: (
                  $image.Labels["org.opencontainers.image.version"]
                  // $image.Labels["com.coreos.buildid"]
                  // "unknown"
                ),
                revision: (
                  $image.Labels["org.opencontainers.image.revision"]
                  // $image.Labels["io.openshift.build.commit.id"]
                  // "unknown"
                )
              }'
          }

          stream_image=$(oc adm release info \
            --image-for stream-coreos "$RELEASE_IMAGE" 2>/dev/null || true)
          dtk_image=$(oc adm release info \
            --image-for driver-toolkit "$RELEASE_IMAGE" 2>/dev/null || true)
          compose_from_base=false
          stream_info='{}'
          dtk_info='{}'

          if [[ -n "$stream_image" ]]; then
            stream_info=$(inspect_image "$stream_image")
            stream_base=$(jq -r '.stream' <<< "$stream_info")
            if [[ "$stream_base" != "$BASE_STREAM" ]]; then
              echo "Release stream-coreos is for $stream_base," \
                "not $BASE_STREAM."
              stream_image=""
              stream_info='{}'
            fi
          fi
          if [[ -z "$stream_image" ]]; then
            compose_from_base=true
          fi

          if [[ -n "$dtk_image" ]]; then
            dtk_info=$(inspect_image "$dtk_image")
            dtk_base=$(jq -r '.stream' <<< "$dtk_info")
            if [[ -n "$dtk_base" && "$dtk_base" != "$BASE_STREAM" ]]; then
              echo "Release driver-toolkit is for $dtk_base, not $BASE_STREAM."
              dtk_image=""
              dtk_info='{}'
            elif [[ -z "$dtk_base" && -z "$stream_image" ]]; then
              dtk_image=""
              dtk_info='{}'
            fi
          fi
          if [[ -z "$dtk_image" && -n "$stream_image" ]]; then
            dtk_image=$stream_image
            dtk_info=$stream_info
          fi
          echo "stream_image=$stream_image" >> "$GITHUB_OUTPUT"
          echo "stream_info=$stream_info" >> "$GITHUB_OUTPUT"
          echo "dtk_image=$dtk_image" >> "$GITHUB_OUTPUT"
          echo "dtk_info=$dtk_info" >> "$GITHUB_OUTPUT"
          echo "compose=$compose_from_base" >> "$GITHUB_OUTPUT"

      - name: Validate RPM artifact run ID
        id: rpm-run
        if: steps.source-images.outputs.compose == 'true'
        run: |
          set -euo pipefail
          if [[ ! "$RPM_RUN_ID" =~ ^[0-9]{1,20}$ ]]; then
            echo "A numeric rpm_run_id input is required when" \
              "the payload has no matching stream-coreos image." >&2
            exit 1
          fi
          echo "run_id=$RPM_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Checkout matching openshift/os source
        if: steps.source-images.outputs.compose == 'true'
        uses: actions/checkout@v4
        with:
          repository: openshift/os
          ref: release-${{ matrix.version }}
          path: openshift-os
          persist-credentials: false

      - name: Allow provider RPM package names in the local repo
        if: steps.source-images.outputs.compose == 'true'
        working-directory: openshift-os
        run: |
          set -euo pipefail
          script=build-node-image.sh
          old="ose-gcp-gcr-*'"
          new="ose-gcp-gcr-*,ecr-credential-provider*,acr-credential-provider*"
          new+=",gcr-credential-provider*'"
          if [[ $(grep -Fo "$old" "$script" | wc -l) -ne 1 ]]; then
            echo "Pinned OS repo package allowlist not found as expected." >&2
            exit 1
          fi
          sed -i "s/ose-gcp-gcr-\\*'/${new}/" "$script"
          grep -F "includepkgs=" "$script"

      - name: Download matching RPM artifacts
        if: steps.source-images.outputs.compose == 'true'
        uses: actions/download-artifact@v4.1.3
        with:
          pattern: "*-rpms-okd${{ matrix.version }}-el${{ matrix.os_major }}"
          path: ${{ runner.temp }}/okd-rpms
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.rpm-run.outputs.run_id }}

      - name: Prepare the local RPM repository
        if: steps.source-images.outputs.compose == 'true'
        env:
          RPM_REPO_VERSION: ${{ matrix.repo_version }}
        run: |
          set -euo pipefail
          rpm_dir="$RUNNER_TEMP/okd-rpms"
          mapfile -d '' rpms < <(
            find "$rpm_dir" -type f -name '*.rpm' -print0
          )
          if (( ${#rpms[@]} == 0 )); then
            echo "The selected run has no matching EL${OS_MAJOR} RPMs." >&2
            exit 1
          fi
          for package in \
            cri-o \
            cri-tools \
            conmon-rs \
            ecr-credential-provider \
            acr-credential-provider \
            gcr-credential-provider; do
            if ! find "$rpm_dir" -type f \
              -name "${package}-*.rpm" -print -quit | grep -q .; then
              echo "The selected run is missing ${package} RPMs." >&2
              exit 1
            fi
          done

          createrepo_c "$rpm_dir"
          cat > "$RUNNER_TEMP/yumrepos" <<EOF
          [rhel-${RPM_REPO_VERSION}-server-ose-${OKD_VERSION}]
          name=OpenShift RPM build artifacts
          baseurl=file:///var/tmp/okd-rpm-repo
          enabled=1
          gpgcheck=0
          EOF

      - name: Log in to GHCR
        if: steps.source-images.outputs.compose == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" |
            podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Compose the machine image from the latest SCOS base
        id: compose
        if: steps.source-images.outputs.compose == 'true'
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          BASE_IMAGE="ghcr.io/${IMAGE_OWNER,,}/scos-base:${BASE_STREAM}"
          base_info=$(skopeo inspect "docker://${BASE_IMAGE}")
          base_digest=$(jq -r '.Digest' <<< "$base_info")
          base_revision=$(jq -r \
            '.Labels["org.opencontainers.image.revision"] // "unknown"' \
            <<< "$base_info")
          os_revision=$(git -C "$GITHUB_WORKSPACE/openshift-os" rev-parse HEAD)
          image_ref="localhost/stream-coreos:${OKD_VERSION}-${BASE_STREAM}"
          podman build \
            --from "$BASE_IMAGE" \
            --label "org.opencontainers.image.version=${OKD_VERSION}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.base.name=${BASE_IMAGE}" \
            --label "org.opencontainers.image.base.digest=${base_digest}" \
            --label "io.okd.source.scos-base.revision=${base_revision}" \
            --label "io.okd.source.openshift-os.revision=${os_revision}" \
            --label "io.okd.source.rpm-build.run=${RPM_RUN_ID}" \
            --secret id=yumrepos,src="$RUNNER_TEMP/yumrepos" \
            --volume "$RUNNER_TEMP/okd-rpms:/var/tmp/okd-rpm-repo:ro" \
            --security-opt label=disable \
            --tag "$image_ref" \
            "$GITHUB_WORKSPACE/openshift-os"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"

      - name: Select overlay source images
        id: overlay-inputs
        env:
          STREAM_IMAGE: ${{ steps.source-images.outputs.stream_image }}
          DTK_IMAGE: ${{ steps.source-images.outputs.dtk_image }}
          COMPOSED_IMAGE: ${{ steps.compose.outputs.image_ref }}
        run: |
          set -euo pipefail
          stream_image="${STREAM_IMAGE:-$COMPOSED_IMAGE}"
          dtk_image="${DTK_IMAGE:-$stream_image}"
          if [[ -z "$stream_image" || -z "$dtk_image" ]]; then
            echo "Could not select source images for the kernel/GCC overlays." \
              >&2
            exit 1
          fi
          echo "stream_image=$stream_image" >> "$GITHUB_OUTPUT"
          echo "dtk_image=$dtk_image" >> "$GITHUB_OUTPUT"

      - name: Select kernel package version
        id: kernel
        run: |
          set -euo pipefail
          kernel_version=$(
            podman run --rm --pull=always \
              "quay.io/centos/centos:stream${OS_MAJOR}" \
              bash -ec '
                dnf install -y dnf-plugins-core >/dev/null 2>&1
                dnf repoquery --latest-limit=1 \
                  --qf "%{VERSION}-%{RELEASE}" kernel-core
              '
          )
          kernel_pattern="^[0-9][A-Za-z0-9._+-]*\\.el${OS_MAJOR}$"
          if [[ ! "$kernel_version" =~ $kernel_pattern ]]; then
            echo "Could not resolve a valid EL${OS_MAJOR} kernel version." >&2
            exit 1
          fi
          echo "version=$kernel_version" >> "$GITHUB_OUTPUT"

      - name: Resolve image provenance
        id: provenance
        env:
          STREAM_INFO: ${{ steps.source-images.outputs.stream_info }}
          DTK_INFO: ${{ steps.source-images.outputs.dtk_info }}
          STREAM_IMAGE_REF: ${{ steps.overlay-inputs.outputs.stream_image }}
          DTK_IMAGE_REF: ${{ steps.overlay-inputs.outputs.dtk_image }}
        run: |
          set -euo pipefail
          resolve_metadata() {
            local prefix=$1
            local source_info=$2
            local image_ref=$3
            local digest version revision

            if [[ "$source_info" == '{}' ]]; then
              source_info=$(skopeo inspect "containers-storage:${image_ref}")
              digest=$(jq -r '.Digest // "unknown"' <<< "$source_info")
              version=$(jq -r \
                '.Labels["org.opencontainers.image.version"] // "unknown"' \
                <<< "$source_info")
              revision=$(jq -r \
                '.Labels["org.opencontainers.image.revision"] // "unknown"' \
                <<< "$source_info")
            else
              digest=$(jq -r '.digest // "unknown"' <<< "$source_info")
              version=$(jq -r '.version // "unknown"' <<< "$source_info")
              revision=$(jq -r '.revision // "unknown"' <<< "$source_info")
            fi

            [[ "$version" != "unknown" ]] || version=$RELEASE_TAG
            [[ "$revision" != "unknown" ]] || revision=$RELEASE_COMMIT
            {
              echo "${prefix}_digest=$digest"
              echo "${prefix}_version=$version"
              echo "${prefix}_revision=$revision"
            } >> "$GITHUB_OUTPUT"
          }

          resolve_metadata stream "$STREAM_INFO" "$STREAM_IMAGE_REF"
          resolve_metadata dtk "$DTK_INFO" "$DTK_IMAGE_REF"

      - name: Build and publish stream-coreos
        env:
          BASE_IMAGE: ${{ steps.overlay-inputs.outputs.stream_image }}
          KERNEL_VERSION: ${{ steps.kernel.outputs.version }}
          SOURCE_IMAGE_REF: ${{ steps.overlay-inputs.outputs.stream_image }}
          SOURCE_DIGEST: ${{ steps.provenance.outputs.stream_digest }}
          SOURCE_VERSION: ${{ steps.provenance.outputs.stream_version }}
          SOURCE_REVISION: ${{ steps.provenance.outputs.stream_revision }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner=${GITHUB_REPOSITORY_OWNER,,}
          image_ref="ghcr.io/${owner}/stream-coreos"
          image_tag="${OKD_VERSION}-${BASE_STREAM}"

          source_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          labels=(
            --label "org.opencontainers.image.source=${source_url}"
            --label "org.opencontainers.image.version=${OKD_VERSION}"
            --label "org.opencontainers.image.revision=${GITHUB_SHA}"
            --label "org.opencontainers.image.base.name=${SOURCE_IMAGE_REF}"
            --label "org.opencontainers.image.base.digest=${SOURCE_DIGEST}"
            --label "io.okd.source.release.tag=${RELEASE_TAG}"
            --label "io.okd.source.release.payload=${RELEASE_IMAGE}"
            --label "io.okd.source.release.revision=${RELEASE_COMMIT}"
            --label "io.okd.source.image.version=${SOURCE_VERSION}"
            --label "io.okd.source.image.revision=${SOURCE_REVISION}"
            --label "io.okd.source.image.digest=${SOURCE_DIGEST}"
            --label "io.okd.source.base.stream=${BASE_STREAM}"
            --label "io.okd.source.kernel.version=${KERNEL_VERSION}"
          )
          printf '%s' "$GHCR_TOKEN" |
            podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          podman build \
            --build-arg "BASE_IMAGE=${BASE_IMAGE}" \
            --build-arg "VERSION=${KERNEL_VERSION}" \
            --build-arg "STREAM_MAJOR=${OS_MAJOR}" \
            "${labels[@]}" \
            --file Dockerfile \
            --tag "${image_ref}:${image_tag}" \
            .
          podman push "${image_ref}:${image_tag}"

      - name: Build and publish driver-toolkit
        env:
          BASE_IMAGE: ${{ steps.overlay-inputs.outputs.dtk_image }}
          KERNEL_VERSION: ${{ steps.kernel.outputs.version }}
          SOURCE_IMAGE_REF: ${{ steps.overlay-inputs.outputs.dtk_image }}
          SOURCE_DIGEST: ${{ steps.provenance.outputs.dtk_digest }}
          SOURCE_VERSION: ${{ steps.provenance.outputs.dtk_version }}
          SOURCE_REVISION: ${{ steps.provenance.outputs.dtk_revision }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner=${GITHUB_REPOSITORY_OWNER,,}
          image_ref="ghcr.io/${owner}/driver-toolkit"
          image_tag="${OKD_VERSION}-${BASE_STREAM}"

          source_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          labels=(
            --label "org.opencontainers.image.source=${source_url}"
            --label "org.opencontainers.image.version=${OKD_VERSION}"
            --label "org.opencontainers.image.revision=${GITHUB_SHA}"
            --label "org.opencontainers.image.base.name=${SOURCE_IMAGE_REF}"
            --label "org.opencontainers.image.base.digest=${SOURCE_DIGEST}"
            --label "io.okd.source.release.tag=${RELEASE_TAG}"
            --label "io.okd.source.release.payload=${RELEASE_IMAGE}"
            --label "io.okd.source.release.revision=${RELEASE_COMMIT}"
            --label "io.okd.source.image.version=${SOURCE_VERSION}"
            --label "io.okd.source.image.revision=${SOURCE_REVISION}"
            --label "io.okd.source.image.digest=${SOURCE_DIGEST}"
            --label "io.okd.source.base.stream=${BASE_STREAM}"
            --label "io.okd.source.kernel.version=${KERNEL_VERSION}"
          )
          podman build \
            --build-arg "BASE_IMAGE=${BASE_IMAGE}" \
            --build-arg "VERSION=${KERNEL_VERSION}" \
            --build-arg "STREAM_MAJOR=${OS_MAJOR}" \
            "${labels[@]}" \
            --file Dockerfile.dtk \
            --tag "${image_ref}:${image_tag}" \
            .
          podman push "${image_ref}:${image_tag}"
