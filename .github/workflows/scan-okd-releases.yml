name: Scan OKD releases and build images

on:
  push:
    paths:
      - .github/workflows/build-okd-stream-coreos.yml
      - .github/workflows/rpm-build.yml
      - .github/workflows/scan-okd-releases.yml
      - .github/workflows/prepare-rpm-sources.yml
      - .github/workflows/sync-repo-mirror.yml
      - .github/actions/collect-rpm-sources/action.yml
      - .github/actions/prepare-rpm-build-matrices/action.yml
      - .github/prompts/source-mirror-maintenance.md
      - docs/module-patch.md
      - rpms/mirror-plan.json
      - Dockerfile
      - Dockerfile.dtk
  schedule:
    - cron: "17 6 1,15 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.releases.outputs.matrix }}
      source_matrix: ${{ steps.releases.outputs.source_matrix }}
      mirror_matrix: ${{ steps.releases.outputs.mirror_matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Find the latest stable OKD release payloads
        id: releases
        uses: actions/github-script@v9
        with:
          script: |
            const plan = JSON.parse(require("node:fs").readFileSync("rpms/mirror-plan.json", "utf8"));
            const targets = plan.build_targets.map((target) => ({ ...target, version: target.okd_version }));
            const versions = [
              ...new Set(targets.map(({ version }) => version)),
            ];
            const releases = [];
            const releasePattern = /^4\.(20|21|22)\.\d+-okd-scos\.\d+$/;
            const imagePattern =
              /^quay\.io\/okd\/scos-release@sha256:[0-9a-f]{64}$/;

            for (let page = 1; page <= 20; page++) {
              const { data } = await github.rest.repos.listReleases({
                owner: "okd-project",
                repo: "okd",
                per_page: 100,
                page,
              });

              for (const release of data) {
                if (release.draft || release.prerelease) continue;
                if (!releasePattern.test(release.tag_name)) continue;
                const image = release.body?.match(/Pull From:\s*(\S+)/)?.[1];
                if (!imagePattern.test(image ?? "")) continue;

                releases.push({
                  version: release.tag_name.match(
                    /^(4\.(?:20|21|22))\./
                  )[1],
                  tag: release.tag_name,
                  image,
                  published_at: release.published_at,
                });
              }

              if (versions.every((version) =>
                releases.some((release) => release.version === version)
              )) break;
              if (data.length < 100) break;
            }

            const latestReleases = Object.fromEntries(
              versions.map((version) => {
                const matching = releases
                  .filter((release) => release.version === version)
                  .sort((a, b) =>
                    (a.published_at ?? "").localeCompare(b.published_at ?? "")
                  );
                return [version, matching.at(-1)];
              })
            );
            if (versions.some((version) => !latestReleases[version])) {
              throw new Error(
                "Could not find stable release payloads for " +
                  versions.join(", ") +
                  "."
              );
            }

            const matrix = [];
            for (const { version, base, os_version, repo_version, run_test } of targets) {
              const release = latestReleases[version];
              const { data: commit } = await github.rest.repos.getCommit({
                owner: "okd-project",
                repo: "okd",
                ref: release.tag,
              });

              matrix.push({
                version,
                release_tag: release.tag,
                release_image: release.image,
                release_commit: commit.sha,
                base,
                os_major: os_version,
                run_test,
                repo_version,
              });
            }
            core.setOutput("matrix", JSON.stringify(matrix));
            const mirrorMatrix = versions.map((version) => ({
              version,
              os_targets: matrix
                .filter((entry) => entry.version === version)
                .map((entry) => Number(entry.os_major))
                .sort((left, right) => left - right)
                .join(", "),
            }));
            core.setOutput("mirror_matrix", JSON.stringify(mirrorMatrix));
            const sourceMatrix = matrix.flatMap((release) => plan.sources.projects.map((project) => ({
              okd_version: release.version,
              os_version: release.os_major,
              project,
              artifact_name: `rpm-source-${release.version}-el${release.os_major}-${project}`,
            })));
            core.setOutput("source_matrix", JSON.stringify(sourceMatrix));

  prepare-rpm-sources:
    needs: release-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.release-matrix.outputs.source_matrix) }}
    permissions:
      contents: read
      copilot-requests: write
    uses: ./.github/workflows/prepare-rpm-sources.yml
    secrets: inherit
    with:
      okd_version: ${{ matrix.okd_version }}
      os_version: ${{ matrix.os_version }}
      project: ${{ matrix.project }}
      artifact_name: ${{ matrix.artifact_name }}

  compose-build-configs:
    needs: [release-matrix, prepare-rpm-sources]
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.configs.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect prepared RPM sources
        id: sources
        uses: ./.github/actions/collect-rpm-sources
      - name: Compose release build configurations
        id: configs
        uses: ./.github/actions/prepare-rpm-build-matrices
        with:
          targets: ${{ needs.release-matrix.outputs.matrix }}
          sources: ${{ steps.sources.outputs.sources }}

  sync-os-source:
    name: Maintain okd/os-${{ matrix.version }} mirror
    needs: release-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.release-matrix.outputs.mirror_matrix) }}
    permissions:
      contents: read
      copilot-requests: write
    uses: ./.github/workflows/sync-repo-mirror.yml
    secrets: inherit
    with:
      mirror: >-
        {
          "project": "openshift/os",
          "source_url": "https://github.com/openshift/os.git",
          "source_branch": "release-${{ matrix.version }}",
          "target_branch": "okd/os-${{ matrix.version }}",
          "target_version": "${{ matrix.version }}",
          "reference_branch": "${{ matrix.version == '4.22' && 'release-4.20' || '' }}"
        }
      repository_instructions: |
        - Target EL versions: ${{ matrix.os_targets }}. Maintain this mirror
          once for all of them.
        - Rewind `openshift/os` history until it contains the definitions for
          each listed EL (`centos-<N>` conditionals and `c<N>s.repo`), restore
          them, then apply the changes made since their removal: keep the
          current release's package requirements and postprocessing, and bring
          repository IDs, package sets, and selection logic up to date for each
          EL.
        - When the branch still defines a RHEL build for a listed EL
          (`rhel-<version>` conditionals and repositories), treat the changes
          between those RHEL definitions and the removed `centos-<N>`
          definitions as the changes to carry into the restored definitions.
        - Use `reference_ref`, when present, as an additional reference for the
          requested EL conditionals and repository IDs. Do not carry over an
          older Cloud SIG runtime repository; the caller workflow supplies the
          local repository with the built RPMs.
        - Restore `build-node-image.sh` repository-file selection so each listed
          EL's `osversion=centos-<N>` loads `c<N>s.repo` while other EL versions
          keep their own repository files.
        - Do not modify `build-node-image.sh` for the local built-RPM allowlist;
          the caller workflow handles that local repository configuration.
        - Produce only the identity marker when the branch already supports
          every listed EL.

  build:
    needs: [compose-build-configs, sync-os-source]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.compose-build-configs.outputs.matrix) }}
    permissions:
      actions: read
      contents: write
      copilot-requests: write
      packages: write
    uses: ./.github/workflows/build-okd-stream-coreos.yml
    with:
      version: ${{ matrix.version }}
      release_tag: ${{ matrix.release_tag }}
      release_image: ${{ matrix.release_image }}
      release_commit: ${{ matrix.release_commit }}
      base_stream: ${{ matrix.base }}
      os_major: ${{ matrix.os_major }}
      repo_version: ${{ matrix.repo_version }}
      upstream_matrix: ${{ matrix.upstream_matrix }}
      sig_matrix: ${{ matrix.sig_matrix }}
      run_test: ${{ matrix.run_test }}
    secrets: inherit
