name: RPM Build Reproduction

on:
  push:
    paths:
      - .github/workflows/rpm-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rpms:
    name: >-
      Build RPMs for ${{ matrix.okd_version }}
      (EL${{ matrix.os_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        okd_version: ["4.20", "4.21", "4.22"]
        os_version: [9, 10]
    container:
      image: quay.io/centos/centos:stream${{ matrix.os_version }}
    steps:
      - name: Install Git and Toolchain
        env:
          OS_VERSION: ${{ matrix.os_version }}
        run: |
          dnf install -y dnf-plugins-core epel-release
          if [[ "$OS_VERSION" == "9" ]]; then
            dnf install -y epel-next-release
          fi
          dnf config-manager --set-enabled crb
          dnf makecache
          dnf install -y \
            git \
            rpm-build \
            rsync \
            createrepo \
            gcc \
            gcc-c++ \
            make \
            golang \
            krb5-devel \
            bsdtar \
            systemd \
            cargo \
            findutils

      - name: Checkout Workflow Repository
        uses: actions/checkout@v4

      - name: Checkout Kubernetes
        uses: actions/checkout@v4
        with:
          repository: openshift/kubernetes
          ref: release-${{ matrix.okd_version }}
          fetch-depth: 1
          path: source/kubernetes

      - name: Checkout OpenShift CLI
        uses: actions/checkout@v4
        with:
          repository: openshift/oc
          ref: release-${{ matrix.okd_version }}
          fetch-depth: 1
          path: source/oc

      - name: Checkout ECR credential provider
        uses: actions/checkout@v4
        with:
          repository: openshift/cloud-provider-aws
          ref: release-${{ matrix.okd_version }}
          fetch-depth: 1
          path: source/ecr-credential-provider

      - name: Checkout ACR credential provider
        uses: actions/checkout@v4
        with:
          repository: openshift/cloud-provider-azure
          ref: release-${{ matrix.okd_version }}
          fetch-depth: 1
          path: source/acr-credential-provider

      - name: Checkout GCR credential provider
        uses: actions/checkout@v4
        with:
          repository: openshift/cloud-provider-gcp
          ref: release-${{ matrix.okd_version }}
          fetch-depth: 1
          path: source/gcr-credential-provider

      - name: Build RPMs
        run: |
          set -euo pipefail
          export GOTOOLCHAIN=auto

          go install \
            github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest
          export PATH=$PATH:$(go env GOPATH)/bin

          for entry in \
            "kubernetes|openshift.spec" \
            "oc|oc.spec" \
            "ecr-credential-provider|ecr-credential-provider.spec" \
            "acr-credential-provider|acr-credential-provider.spec" \
            "gcr-credential-provider|gcr-credential-provider.spec"; do
            IFS='|' read -r component spec <<< "$entry"
            source_dir="$GITHUB_WORKSPACE/source/$component"
            cd "$source_dir"
            echo "Building $component on CentOS Stream ${{ matrix.os_version }}"

            git config --global --add safe.directory "$source_dir"
            COMMIT=$(git rev-parse --short HEAD)
            VERSION_RAW=$(git describe --tags --abbrev=0 2>/dev/null || true)
            VERSION_RAW="${VERSION_RAW#v}"
            if [ "$component" == "kubernetes" ]; then
              KUBERNETES_VERSION=$(
                grep -oE \
                  'kubernetes=1\.[0-9]+\.[0-9]+(-rc\.[0-9])?' \
                  openshift-hack/images/hyperkube/Dockerfile.rhel |
                  head -n 1 | cut -d= -f2 || true
              )
              VERSION_RAW="${KUBERNETES_VERSION:-$VERSION_RAW}"
            fi
            VERSION_RAW="${VERSION_RAW:-0.0.1}"
            if [ ! -f "$spec" ]; then
              echo "A valid RPM spec_file is required for $component." >&2
              exit 1
            fi

            VERSION="v${VERSION_RAW}"
            export OS_GIT_VERSION="${VERSION}+${COMMIT}"
            export OS_GIT_COMMIT="$COMMIT"
            export OS_GIT_MAJOR
            OS_GIT_MAJOR=$(cut -d. -f1 <<< "$VERSION_RAW")
            export OS_GIT_MINOR
            OS_GIT_MINOR=$(cut -d. -f2 <<< "$VERSION_RAW")
            export OS_GIT_PATCH
            OS_GIT_PATCH=$(cut -d. -f3 <<< "$VERSION_RAW")
            export OS_GIT_TREE_STATE=dirty

            if [ "$spec" == "oc.spec" ]; then
              sed -i '/BuildRequires:.*goversioninfo/d' "$spec"
            fi
            dnf builddep -y "$spec"

            VERSION_SPEC=$(rpmspec -q --qf "%{version}\n" "$spec" | head -n 1)
            if [ "$component" == "kubernetes" ]; then
              VERSION_SPEC="$VERSION_RAW"
            fi
            NAME=$(
              rpmspec --define "version $VERSION_SPEC" \
                -q --qf "%{name}\n" "$spec" | head -n 1
            )
            VERSION_SPEC=$(
              rpmspec --define "version $VERSION_SPEC" \
                -q --qf "%{version}\n" "$spec" | head -n 1
            )
            SOURCE0=$(
              rpmspec --define "version $VERSION_SPEC" -P "$spec" |
                sed -n 's/^Source0:[[:space:]]*//p' |
                head -n 1
            )
            SOURCE_FILE="${SOURCE0##*/}"
            if [ -z "$SOURCE_FILE" ] || [ "$SOURCE_FILE" == "(none)" ]; then
              echo "Unable to determine source archive name from $spec." >&2
              exit 1
            fi
            mkdir -p _rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
            tar -czf "_rpmbuild/SOURCES/${SOURCE_FILE}" \
              --exclude='./.git' \
              --exclude='./_output' \
              --exclude='./_rpmbuild' \
              --transform="s|^|$NAME-$VERSION_SPEC/|rSH" ./
            rpmbuild_args=(
              -ba "$spec"
              --define "_topdir $PWD/_rpmbuild"
              --define "version $VERSION_SPEC"
              --define "release 1"
              --define "commit $COMMIT"
              --define "os_git_vars \
                OS_GIT_VERSION='$OS_GIT_VERSION' \
                OS_GIT_COMMIT='$OS_GIT_COMMIT' \
                OS_GIT_MAJOR='$OS_GIT_MAJOR' \
                OS_GIT_MINOR='$OS_GIT_MINOR' \
                OS_GIT_TREE_STATE='$OS_GIT_TREE_STATE'"
            )
            if [[ "$component" == *credential-provider ]]; then
              rpmbuild_args+=(--define "build_ldflags %{nil}")
            fi
            rpmbuild "${rpmbuild_args[@]}"
          done

      - name: Archive RPM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: >-
            ${{ format('upstream-rpms-okd{0}-el{1}',
            matrix.okd_version, matrix.os_version) }}
          path: |
            source/*/_output/local/releases/rpms/
            source/*/_output/releases/rpms/
            source/*/RPMS/
            source/*/_rpmbuild/RPMS/
          if-no-files-found: error

  build-rpms-centos-sig:
    name: >-
      Build CentOS SIG RPMs for ${{ matrix.okd_version }}
      (EL${{ matrix.os_version }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      image: quay.io/centos/centos:stream${{ matrix.os_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - okd_version: "4.20"
            os_version: 9
          - okd_version: "4.20"
            os_version: 10
          - okd_version: "4.21"
            os_version: 10
          - okd_version: "4.22"
            os_version: 10
    steps:
      - name: Install local RPM build tools
        env:
          OS_VERSION: ${{ matrix.os_version }}
        run: |
          dnf install -y epel-release
          dnf install -y dnf-plugins-core
          if [[ "$OS_VERSION" == "9" ]]; then
            dnf install -y epel-next-release
          fi
          dnf config-manager --set-enabled crb
          dnf makecache
          dnf install -y \
            centpkg-sig \
            gcc \
            gcc-c++ \
            git \
            go-rpm-macros \
            golang \
            make \
            rpm-build
          mkdir -p /etc/containers
          cat > /etc/containers/storage.conf <<'EOF'
          [storage]
          driver = "overlay"
          runroot = "/run/containers/storage"
          graphroot = "/var/lib/containers/storage"
          EOF

      - name: Build CentOS SIG RPMs locally
        env:
          OKD_VERSION: ${{ matrix.okd_version }}
          OS_VERSION: ${{ matrix.os_version }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/source"
          for SIG_PROJECT in cri-o cri-tools conmon-rs; do
            if [[ "$SIG_PROJECT" == "conmon-rs" ]]; then
              if [[ "$OS_VERSION" == "9" ]]; then
                sig_ref="c9s-sig-cloud"
              elif [[ "$OKD_VERSION" == "4.22" ]]; then
                sig_ref="cloud10s-okd-${OKD_VERSION}-el10s"
              else
                sig_ref="c10s-sig-cloud"
              fi
            else
              sig_ref="c${OS_VERSION}s-sig-cloud-okd-${OKD_VERSION}"
            fi
            source_url="https://gitlab.com/CentOS/cloud/rpms/${SIG_PROJECT}.git"
            source_dir="$GITHUB_WORKSPACE/source/$SIG_PROJECT"
            git clone --depth 1 --single-branch \
              --branch "$sig_ref" "$source_url" "$source_dir"
            source_commit=$(git -C "$source_dir" rev-parse HEAD)
            echo "Using ${SIG_PROJECT} source ${sig_ref} at ${source_commit}"

            cd "$source_dir"
            centpkg-sig sources
            spec="SPECS/${SIG_PROJECT}.spec"
            if [ ! -f "$spec" ] || [ ! -f sources ]; then
              echo "Expected $spec and the package sources manifest."
              exit 1
            fi
            topdir="$GITHUB_WORKSPACE/rpmbuild/$SIG_PROJECT"
            mkdir -p "$topdir"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
            while IFS= read -r filename; do
              source_file="$filename"
              if [ ! -f "$source_file" ] && [ -f "SOURCES/$filename" ]; then
                source_file="SOURCES/$filename"
              fi
              if [ ! -f "$source_file" ]; then
                echo "Missing lookaside source: $filename"
                exit 1
              fi
              cp "$source_file" "$topdir/SOURCES/"
            done < <(sed -nE 's/^[^ ]+ \(([^)]+)\) = .*/\1/p' sources)
            if [ -d SOURCES ]; then
              cp -a SOURCES/. "$topdir/SOURCES/"
            fi
            dnf builddep -y "$spec"
            rpmbuild -ba "$spec" \
              --define "_topdir $topdir" \
              --define "_sourcedir $topdir/SOURCES"
            if ! find "$topdir/RPMS" -type f -name '*.rpm' -print -quit \
              | grep -q .; then
              echo "Local rpmbuild produced no RPM artifacts for $SIG_PROJECT."
              exit 1
            fi
          done

      - name: Archive CentOS SIG source build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: >-
            ${{ format('sig-rpms-okd{0}-el{1}',
            matrix.okd_version, matrix.os_version) }}
          path: rpmbuild/RPMS/**/*.rpm
          if-no-files-found: error

  test-rpm-install:
    name: >-
      Test installing RPMs for ${{ matrix.okd_version }}
      (EL${{ matrix.os_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        okd_version: ["4.20", "4.21", "4.22"]
        os_version: [9, 10]
    container:
      image: quay.io/centos/centos:stream${{ matrix.os_version }}
    needs:
      - build-rpms
      - build-rpms-centos-sig
    steps:
      - name: Download matching RPM artifacts
        uses: actions/download-artifact@v4.1.3
        with:
          pattern: >-
            ${{ format('*-rpms-okd{0}-el{1}', matrix.okd_version,
            matrix.os_version) }}
          path: rpms
          merge-multiple: true

      - name: Install all RPMs
        env:
          OS_VERSION: ${{ matrix.os_version }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/rpm-test-report"
          printf "RPM and binary version report\n" > \
            "$GITHUB_WORKSPACE/rpm-test-report/rpm-versions.txt"
          dnf install -y dnf-plugins-core epel-release
          if [[ "$OS_VERSION" == "9" ]]; then
            dnf install -y epel-next-release
          fi
          dnf config-manager --set-enabled crb
          dnf makecache
          mapfile -d "" rpms < <(
            find "$GITHUB_WORKSPACE/rpms" -type f -name "*.rpm" -print0
          )
          if [ "${#rpms[@]}" -eq 0 ]; then
            echo "No RPM artifacts were downloaded." >&2
            exit 1
          fi
          dnf install -y "${rpms[@]}"
          for capability in \
            ose-aws-ecr-image-credential-provider \
            ose-azure-acr-image-credential-provider \
            ose-gcp-gcr-image-credential-provider; do
            if ! rpm -q --whatprovides "$capability" >/dev/null; then
              echo "No installed RPM provides $capability." >&2
              exit 1
            fi
          done
        shell: bash

      - name: Check binaries and record full version output
        run: |
          import os
          import shlex
          import stat
          import subprocess
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          report_path = workspace / "rpm-test-report" / "rpm-versions.txt"
          rpm_files = sorted((workspace / "rpms").rglob("*.rpm"))
          binary_dirs = (
              "/bin/",
              "/sbin/",
              "/usr/bin/",
              "/usr/sbin/",
              "/usr/libexec/",
          )

          def rpm_query(rpm_file, query):
              result = subprocess.run(
                  ["rpm", "-qp", "--qf", query, str(rpm_file)],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              return result.stdout

          report = ["RPM and binary version report", "", "Installed RPMs:"]
          binaries = {}
          for rpm_file in rpm_files:
              package = rpm_query(
                  rpm_file, "%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}"
              ).strip()
              report.append(f"  {package}")
              file_entries = rpm_query(
                  rpm_file, "[%{FILEMODES}\t%{FILENAMES}\n]"
              )
              for entry in file_entries.splitlines():
                  mode, path = entry.split("\t", 1)
                  if (
                      path.startswith(binary_dirs)
                      and (
                          stat.S_ISREG(int(mode))
                          or stat.S_ISLNK(int(mode))
                      )
                      and int(mode) & 0o111
                  ):
                      binaries.setdefault(path, set()).add(package)

          version_args = {
              "/usr/bin/oc": ["version", "--client"],
              "/usr/bin/kubectl": ["version", "--client"],
              "/usr/bin/hyperkube": ["kubelet", "--version"],
          }
          failures = []
          report.extend(["", "Executable binaries and full version output:"])
          for binary, owners in sorted(binaries.items()):
              path = Path(binary)
              owners_text = ", ".join(sorted(owners))
              if not path.is_file() or not os.access(path, os.X_OK):
                  failures.append(binary)
                  report.extend(
                      [
                          "",
                          f"$ {binary} (from {owners_text})",
                          "NOT FOUND OR NOT EXECUTABLE",
                      ]
                  )
                  continue

              args = [binary, *version_args.get(binary, ["--version"])]
              report.extend(["", f"$ {shlex.join(args)} (from {owners_text})"])
              try:
                  result = subprocess.run(
                      args,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      text=True,
                      errors="replace",
                      timeout=30,
                      check=False,
                  )
                  report.append(f"exit status: {result.returncode}")
                  report.extend((result.stdout or "").rstrip().splitlines())
              except subprocess.TimeoutExpired as error:
                  report.append("timed out after 30 seconds")
                  output = error.stdout or ""
                  if isinstance(output, bytes):
                      output = output.decode(errors="replace")
                  report.extend(output.rstrip().splitlines())
              except OSError as error:
                  report.append(f"could not run version probe: {error}")

          report_path.write_text("\n".join(report) + "\n")
          print(report_path.read_text())
          if not binaries:
              raise SystemExit("No executable files were found in the RPMs.")
          if failures:
              raise SystemExit(
                  "RPM binaries are missing or not executable: "
                  + ", ".join(failures)
              )
        shell: python3 {0}

      - name: Archive RPM version report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: >-
            ${{ format('rpm-binary-versions-okd{0}-el{1}',
            matrix.okd_version, matrix.os_version) }}
          path: rpm-test-report/rpm-versions.txt
          if-no-files-found: error
