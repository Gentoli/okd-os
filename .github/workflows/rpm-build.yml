name: RPM Build Reproduction

on:
  workflow_call:
    inputs:
      okd_version:
        description: OKD version to build
        required: true
        type: string
      os_version:
        description: CentOS Stream major version
        required: true
        type: string
      sig_sources:
        description: Pre-resolved SIG RPM source URLs and branches
        required: true
        type: string
      run_test:
        description: Install and test the built RPMs
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  build-rpms:
    name: >-
      Build RPMs for ${{ inputs.okd_version }}
      (EL${{ inputs.os_version }})
    runs-on: ubuntu-latest
    container:
      image: quay.io/centos/centos:stream${{ inputs.os_version }}
    steps:
      - name: Install Git and Toolchain
        env:
          OS_VERSION: ${{ inputs.os_version }}
        run: |
          dnf install -y dnf-plugins-core epel-release
          if [[ "$OS_VERSION" == "9" ]]; then
            dnf install -y epel-next-release
          fi
          dnf config-manager --set-enabled crb
          dnf makecache
          dnf install -y \
            git \
            rpm-build \
            rsync \
            createrepo \
            gcc \
            gcc-c++ \
            make \
            golang \
            krb5-devel \
            bsdtar \
            systemd \
            cargo \
            findutils

      - name: Checkout Workflow Repository
        uses: actions/checkout@v4

      - name: Install Go version information generator
        env:
          GOTOOLCHAIN: auto
        run: |
          go install \
            github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build Kubernetes RPM
        uses: ./.github/actions/build-upstream-rpm
        with:
          component: kubernetes
          repository: openshift/kubernetes
          spec-file: openshift.spec
          okd-version: ${{ inputs.okd_version }}
          os-version: ${{ inputs.os_version }}

      - name: Build OpenShift CLI RPM
        uses: ./.github/actions/build-upstream-rpm
        with:
          component: oc
          repository: openshift/oc
          spec-file: oc.spec
          okd-version: ${{ inputs.okd_version }}
          os-version: ${{ inputs.os_version }}

      - name: Build ECR credential provider RPM
        uses: ./.github/actions/build-upstream-rpm
        with:
          component: ecr-credential-provider
          repository: openshift/cloud-provider-aws
          spec-file: ecr-credential-provider.spec
          okd-version: ${{ inputs.okd_version }}
          os-version: ${{ inputs.os_version }}

      - name: Build ACR credential provider RPM
        uses: ./.github/actions/build-upstream-rpm
        with:
          component: acr-credential-provider
          repository: openshift/cloud-provider-azure
          spec-file: acr-credential-provider.spec
          okd-version: ${{ inputs.okd_version }}
          os-version: ${{ inputs.os_version }}

      - name: Build GCR credential provider RPM
        uses: ./.github/actions/build-upstream-rpm
        with:
          component: gcr-credential-provider
          repository: openshift/cloud-provider-gcp
          spec-file: gcr-credential-provider.spec
          okd-version: ${{ inputs.okd_version }}
          os-version: ${{ inputs.os_version }}

      - name: Build CRI-O credential provider RPM
        if: inputs.okd_version == '4.22'
        uses: ./.github/actions/build-upstream-rpm
        with:
          component: crio-credential-provider
          repository: openshift/crio-credential-provider
          spec-file: crio-credential-provider.spec
          okd-version: ${{ inputs.okd_version }}
          os-version: ${{ inputs.os_version }}

      - name: Archive RPM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: >-
            ${{ format('upstream-rpms-okd{0}-el{1}',
            inputs.okd_version, inputs.os_version) }}
          path: |
            source/*/_output/local/releases/rpms/
            source/*/_output/releases/rpms/
            source/*/RPMS/
            source/*/_rpmbuild/RPMS/
          if-no-files-found: error

  build-rpms-centos-sig:
    name: >-
      Build CentOS SIG RPMs for ${{ inputs.okd_version }}
      (EL${{ inputs.os_version }})
    needs: build-rpms
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      image: quay.io/centos/centos:stream${{ inputs.os_version }}
    steps:
      - name: Install local RPM build tools
        env:
          OS_VERSION: ${{ inputs.os_version }}
        run: |
          dnf install -y epel-release
          dnf install -y dnf-plugins-core
          if [[ "$OS_VERSION" == "9" ]]; then
            dnf install -y epel-next-release
          fi
          dnf config-manager --set-enabled crb
          dnf makecache
          dnf install -y \
            centpkg-sig \
            gcc \
            gcc-c++ \
            git \
            go-rpm-macros \
            golang \
            make \
            rpm-build
          mkdir -p /etc/containers
          cat > /etc/containers/storage.conf <<'EOF'
          [storage]
          driver = "overlay"
          runroot = "/run/containers/storage"
          graphroot = "/var/lib/containers/storage"
          EOF

      - name: Checkout Workflow Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build CentOS SIG RPMs from source plan
        env:
          SIG_SOURCES: ${{ inputs.sig_sources }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import json
          import re
          import shutil
          import subprocess

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          sources = json.loads(os.environ["SIG_SOURCES"])

          (workspace / "source").mkdir(exist_ok=True)
          (workspace / "rpmbuild").mkdir(exist_ok=True)
          for project in ("cri-o", "cri-tools", "conmon-rs"):
              source = sources[project]
              source_dir = workspace / "source" / project
              topdir = workspace / "rpmbuild" / project
              spec = Path("SPECS") / f"{project}.spec"
              subprocess.run(
                  [
                      "git", "clone", "--depth", "1", "--single-branch",
                      "--branch", source["branch"], source["url"],
                      str(source_dir),
                  ],
                  check=True,
              )
              revision = subprocess.check_output(
                ["git", "-C", str(source_dir), "rev-parse", "HEAD"],
                text=True,
              ).strip()
              print(
                f"Using {project} source {source['branch']} at {revision}",
                flush=True,
              )

              if not (source_dir / spec).is_file() or not (
                source_dir / "sources"
              ).is_file():
                raise SystemExit(
                    f"Expected {spec} and the package sources manifest."
                )
              subprocess.run(
                ["centpkg-sig", "sources"],
                cwd=source_dir,
                check=True,
              )
              for directory in (
                "BUILD", "BUILDROOT", "RPMS", "SOURCES", "SPECS", "SRPMS"
              ):
                (topdir / directory).mkdir(parents=True, exist_ok=True)

              manifest = (source_dir / "sources").read_text().splitlines()
              filenames = []
              for line in manifest:
                match = re.match(r"^[^ ]+ \(([^)]+)\) = ", line)
                if match:
                    filenames.append(match.group(1))
              for filename in filenames:
                candidates = (
                    source_dir / filename,
                    source_dir / "SOURCES" / filename,
                )
                source_file = next(
                    (candidate for candidate in candidates if candidate.is_file()),
                    None,
                )
                if source_file is None:
                    raise SystemExit(f"Missing lookaside source: {filename}")
                shutil.copy2(source_file, topdir / "SOURCES" / filename)
              source_dir_sources = source_dir / "SOURCES"
              if source_dir_sources.is_dir():
                shutil.copytree(
                    source_dir_sources,
                    topdir / "SOURCES",
                    dirs_exist_ok=True,
                )

              subprocess.run(
                ["dnf", "builddep", "-y", str(spec)],
                cwd=source_dir,
                check=True,
              )
              subprocess.run(
                [
                    "rpmbuild", "-ba", str(spec),
                    "--define", f"_topdir {topdir}",
                    "--define", f"_sourcedir {topdir / 'SOURCES'}",
                ],
                cwd=source_dir,
                check=True,
              )
              rpms = list((topdir / "RPMS").rglob("*.rpm"))
              if not rpms:
                raise SystemExit(
                    f"Local rpmbuild produced no RPM artifacts for {project}."
                )
          PY

      - name: Archive CentOS SIG source build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: >-
            ${{ format('sig-rpms-okd{0}-el{1}',
            inputs.okd_version, inputs.os_version) }}
          path: rpmbuild/**/RPMS/**/*.rpm
          if-no-files-found: error

  test-rpm-install:
    name: >-
      Test installing RPMs for ${{ inputs.okd_version }}
      (EL${{ inputs.os_version }})
    if: inputs.run_test
    runs-on: ubuntu-latest
    container:
      image: quay.io/centos/centos:stream${{ inputs.os_version }}
    needs:
      - build-rpms
      - build-rpms-centos-sig
    steps:
      - name: Download matching RPM artifacts
        uses: actions/download-artifact@v4.1.3
        with:
          pattern: >-
            ${{ format('*-rpms-okd{0}-el{1}', inputs.okd_version,
            inputs.os_version) }}
          path: rpms
          merge-multiple: true

      - name: Install all RPMs
        env:
          OS_VERSION: ${{ inputs.os_version }}
          OKD_VERSION: ${{ inputs.okd_version }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/rpm-test-report"
          printf "RPM and binary version report\n" > \
            "$GITHUB_WORKSPACE/rpm-test-report/rpm-versions.txt"
          dnf install -y dnf-plugins-core epel-release
          if [[ "$OS_VERSION" == "9" ]]; then
            dnf install -y epel-next-release
          fi
          dnf config-manager --set-enabled crb
          dnf makecache
          mapfile -d "" rpms < <(
            find "$GITHUB_WORKSPACE/rpms" -type f -name "*.rpm" \
              ! -name "*.src.rpm" ! -name "*.nosrc.rpm" -print0
          )
          if [ "${#rpms[@]}" -eq 0 ]; then
            echo "No RPM artifacts were downloaded." >&2
            exit 1
          fi
          dnf install -y "${rpms[@]}"
          capabilities=(
            ose-aws-ecr-image-credential-provider \
            ose-azure-acr-image-credential-provider \
            ose-gcp-gcr-image-credential-provider
          )
          if [[ "$OKD_VERSION" == "4.22" ]]; then
            capabilities+=(ose-crio-credential-provider)
          fi
          for capability in "${capabilities[@]}"; do
            if ! rpm -q --whatprovides "$capability" >/dev/null; then
              echo "No installed RPM provides $capability." >&2
              exit 1
            fi
          done
        shell: bash

      - name: Check binaries and record full version output
        run: |
          import os
          import shlex
          import stat
          import subprocess
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          report_path = workspace / "rpm-test-report" / "rpm-versions.txt"
          rpm_files = sorted(
              path
              for path in (workspace / "rpms").rglob("*.rpm")
              if not path.name.endswith((".src.rpm", ".nosrc.rpm"))
          )
          binary_dirs = (
              "/bin/",
              "/sbin/",
              "/usr/bin/",
              "/usr/sbin/",
              "/usr/libexec/",
          )

          def rpm_query(rpm_file, query):
              result = subprocess.run(
                  ["rpm", "-qp", "--qf", query, str(rpm_file)],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              return result.stdout

          report = ["RPM and binary version report", "", "Installed RPMs:"]
          binaries = {}
          for rpm_file in rpm_files:
              package = rpm_query(
                  rpm_file, "%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}"
              ).strip()
              report.append(f"  {package}")
              file_entries = rpm_query(
                  rpm_file, "[%{FILEMODES}\t%{FILENAMES}\n]"
              )
              for entry in file_entries.splitlines():
                  mode, path = entry.split("\t", 1)
                  if (
                      path.startswith(binary_dirs)
                      and (
                          stat.S_ISREG(int(mode))
                          or stat.S_ISLNK(int(mode))
                      )
                      and int(mode) & 0o111
                  ):
                      binaries.setdefault(path, set()).add(package)

          version_args = {
              "/usr/bin/oc": ["version", "--client"],
              "/usr/bin/kubectl": ["version", "--client"],
              "/usr/bin/hyperkube": ["kubelet", "--version"],
          }
          failures = []
          report.extend(["", "Executable binaries and full version output:"])
          for binary, owners in sorted(binaries.items()):
              path = Path(binary)
              owners_text = ", ".join(sorted(owners))
              if not path.is_file() or not os.access(path, os.X_OK):
                  failures.append(binary)
                  report.extend(
                      [
                          "",
                          f"$ {binary} (from {owners_text})",
                          "NOT FOUND OR NOT EXECUTABLE",
                      ]
                  )
                  continue

              args = [binary, *version_args.get(binary, ["--version"])]
              report.extend(["", f"$ {shlex.join(args)} (from {owners_text})"])
              try:
                  result = subprocess.run(
                      args,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      text=True,
                      errors="replace",
                      timeout=30,
                      check=False,
                  )
                  report.append(f"exit status: {result.returncode}")
                  report.extend((result.stdout or "").rstrip().splitlines())
              except subprocess.TimeoutExpired as error:
                  report.append("timed out after 30 seconds")
                  output = error.stdout or ""
                  if isinstance(output, bytes):
                      output = output.decode(errors="replace")
                  report.extend(output.rstrip().splitlines())
              except OSError as error:
                  report.append(f"could not run version probe: {error}")

          report_path.write_text("\n".join(report) + "\n")
          print(report_path.read_text())
          if not binaries:
              raise SystemExit("No executable files were found in the RPMs.")
          if failures:
              raise SystemExit(
                  "RPM binaries are missing or not executable: "
                  + ", ".join(failures)
              )
        shell: python3 {0}

      - name: Archive RPM version report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: >-
            ${{ format('rpm-binary-versions-okd{0}-el{1}',
            inputs.okd_version, inputs.os_version) }}
          path: rpm-test-report/rpm-versions.txt
          if-no-files-found: error
