name: Build RPMs

on:
  workflow_call:
    inputs:
      okd_version:
        description: OKD version to build
        required: true
        type: string
      os_version:
        description: CentOS Stream major version
        required: true
        type: string
      upstream_matrix:
        description: Prepared upstream component build matrix
        required: true
        type: string
      sig_matrix:
        description: Prepared SIG package build matrix with source URLs and branches
        required: true
        type: string
      run_test:
        description: Install and test the built RPMs
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  build-rpms:
    name: >-
      Build ${{ matrix.component }} for ${{ inputs.okd_version }}
      (EL${{ inputs.os_version }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.upstream_matrix) }}
    runs-on: ubuntu-latest
    container:
      image: quay.io/centos/centos:stream${{ inputs.os_version }}
    steps:
      - name: Install Git and Toolchain
        env:
          OS_VERSION: ${{ inputs.os_version }}
        run: |
          dnf install -y dnf-plugins-core epel-release
          if [[ "$OS_VERSION" == "9" ]]; then
            dnf install -y epel-next-release
          fi
          dnf config-manager --set-enabled crb
          dnf makecache
          dnf install -y \
            git \
            rpm-build \
            rsync \
            createrepo \
            gcc \
            gcc-c++ \
            make \
            golang \
            krb5-devel \
            bsdtar \
            systemd \
            cargo \
            findutils

      - name: Checkout Workflow Repository
        uses: actions/checkout@v4

      - name: Install Go version information generator
        env:
          GOTOOLCHAIN: auto
        run: |
          go install \
            github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build upstream component RPMs
        uses: ./.github/actions/build-upstream-rpm
        with:
          component: ${{ matrix.component }}
          repository: ${{ matrix.repository }}
          spec-file: ${{ matrix.spec }}
          okd-version: ${{ inputs.okd_version }}
          os-version: ${{ inputs.os_version }}

      - name: Archive RPM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            source/*/_output/local/releases/rpms/
            source/*/_output/releases/rpms/
            source/*/RPMS/
            source/*/_rpmbuild/RPMS/
          if-no-files-found: error

  build-rpms-centos-sig:
    name: >-
      Build SIG ${{ matrix.project }} for ${{ inputs.okd_version }}
      (EL${{ inputs.os_version }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.sig_matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      image: quay.io/centos/centos:stream${{ inputs.os_version }}
    steps:
      - name: Install local RPM build tools
        env:
          OS_VERSION: ${{ inputs.os_version }}
        run: |
          dnf install -y epel-release
          dnf install -y dnf-plugins-core
          if [[ "$OS_VERSION" == "9" ]]; then
            dnf install -y epel-next-release
          fi
          dnf config-manager --set-enabled crb
          dnf makecache
          dnf install -y \
            centpkg-sig \
            gcc \
            gcc-c++ \
            git \
            go-rpm-macros \
            golang \
            make \
            rpm-build
          mkdir -p /etc/containers
          cat > /etc/containers/storage.conf <<'EOF'
          [storage]
          driver = "overlay"
          runroot = "/run/containers/storage"
          graphroot = "/var/lib/containers/storage"
          EOF

      - name: Build CentOS SIG RPMs from the prepared branch
        env:
          SIG_PROJECT: ${{ matrix.project }}
          SOURCE_URL: ${{ matrix.source_url }}
          SOURCE_BRANCH: ${{ matrix.source_branch }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/source"
          source_dir="$GITHUB_WORKSPACE/source/$SIG_PROJECT"
          git clone --depth 1 --single-branch \
            --branch "$SOURCE_BRANCH" "$SOURCE_URL" "$source_dir"
          source_commit=$(git -C "$source_dir" rev-parse HEAD)
          echo "Using ${SIG_PROJECT} source ${SOURCE_BRANCH} at ${source_commit}"

          cd "$source_dir"
          centpkg-sig --name "$SIG_PROJECT" --namespace rpms sources
          spec="SPECS/${SIG_PROJECT}.spec"
          if [ ! -f "$spec" ] || [ ! -f sources ]; then
            echo "Expected $spec and the package sources manifest."
            exit 1
          fi
          topdir="$GITHUB_WORKSPACE/rpmbuild/$SIG_PROJECT"
          mkdir -p "$topdir"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          while IFS= read -r filename; do
            source_file="$filename"
            if [ ! -f "$source_file" ] && [ -f "SOURCES/$filename" ]; then
              source_file="SOURCES/$filename"
            fi
            if [ ! -f "$source_file" ]; then
              echo "Missing lookaside source: $filename"
              exit 1
            fi
            cp "$source_file" "$topdir/SOURCES/"
          done < <(sed -nE 's/^[^ ]+ \(([^)]+)\) = .*/\1/p' sources)
          if [ -d SOURCES ]; then
            cp -a SOURCES/. "$topdir/SOURCES/"
          fi
          dnf builddep -y "$spec"
          rpmbuild -ba "$spec" \
            --define "_topdir $topdir" \
            --define "_sourcedir $topdir/SOURCES"
        shell: bash

      - name: Archive CentOS SIG source build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: rpmbuild/**/RPMS/**/*.rpm
          if-no-files-found: error

  test-rpm-install:
    name: >-
      Test installing RPMs for ${{ inputs.okd_version }}
      (EL${{ inputs.os_version }})
    if: inputs.run_test
    runs-on: ubuntu-latest
    container:
      image: quay.io/centos/centos:stream${{ inputs.os_version }}
    needs:
      - build-rpms
      - build-rpms-centos-sig
    steps:
      - name: Download matching RPM artifacts
        uses: actions/download-artifact@v4.1.3
        with:
          pattern: >-
            ${{ format('*-rpms-okd{0}-el{1}', inputs.okd_version,
            inputs.os_version) }}
          path: rpms
          merge-multiple: true

      - name: Install all RPMs
        env:
          OS_VERSION: ${{ inputs.os_version }}
          OKD_VERSION: ${{ inputs.okd_version }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/rpm-test-report"
          printf "RPM and binary version report\n" > \
            "$GITHUB_WORKSPACE/rpm-test-report/rpm-versions.txt"
          dnf install -y dnf-plugins-core epel-release
          if [[ "$OS_VERSION" == "9" ]]; then
            dnf install -y epel-next-release
          fi
          dnf config-manager --set-enabled crb
          dnf makecache
          mapfile -d "" rpms < <(
            find "$GITHUB_WORKSPACE/rpms" -type f -name "*.rpm" \
              ! -name "*.src.rpm" ! -name "*.nosrc.rpm" -print0
          )
          if [ "${#rpms[@]}" -eq 0 ]; then
            echo "No RPM artifacts were downloaded." >&2
            exit 1
          fi
          dnf install -y "${rpms[@]}"
          capabilities=(
            ose-aws-ecr-image-credential-provider \
            ose-azure-acr-image-credential-provider \
            ose-gcp-gcr-image-credential-provider
          )
          if [[ "$OKD_VERSION" == "4.21" || "$OKD_VERSION" == "4.22" ]]; then
            capabilities+=(ose-crio-credential-provider)
          fi
          for capability in "${capabilities[@]}"; do
            if ! rpm -q --whatprovides "$capability" >/dev/null; then
              echo "No installed RPM provides $capability." >&2
              exit 1
            fi
          done
        shell: bash

      - name: Check binaries and record full version output
        run: |
          import os
          import shlex
          import stat
          import subprocess
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          report_path = workspace / "rpm-test-report" / "rpm-versions.txt"
          rpm_files = sorted(
              path
              for path in (workspace / "rpms").rglob("*.rpm")
              if not path.name.endswith((".src.rpm", ".nosrc.rpm"))
          )
          binary_dirs = (
              "/bin/",
              "/sbin/",
              "/usr/bin/",
              "/usr/sbin/",
              "/usr/libexec/",
          )

          def rpm_query(rpm_file, query):
              result = subprocess.run(
                  ["rpm", "-qp", "--qf", query, str(rpm_file)],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              return result.stdout

          report = ["RPM and binary version report", "", "Installed RPMs:"]
          binaries = {}
          for rpm_file in rpm_files:
              package = rpm_query(
                  rpm_file, "%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}"
              ).strip()
              report.append(f"  {package}")
              file_entries = rpm_query(
                  rpm_file, "[%{FILEMODES}\t%{FILENAMES}\n]"
              )
              for entry in file_entries.splitlines():
                  mode, path = entry.split("\t", 1)
                  if (
                      path.startswith(binary_dirs)
                      and (
                          stat.S_ISREG(int(mode))
                          or stat.S_ISLNK(int(mode))
                      )
                      and int(mode) & 0o111
                  ):
                      binaries.setdefault(path, set()).add(package)

          version_args = {
              "/usr/bin/oc": ["version", "--client"],
              "/usr/bin/kubectl": ["version", "--client"],
              "/usr/bin/hyperkube": ["kubelet", "--version"],
          }
          failures = []
          report.extend(["", "Executable binaries and full version output:"])
          for binary, owners in sorted(binaries.items()):
              path = Path(binary)
              owners_text = ", ".join(sorted(owners))
              if not path.is_file() or not os.access(path, os.X_OK):
                  failures.append(binary)
                  report.extend(
                      [
                          "",
                          f"$ {binary} (from {owners_text})",
                          "NOT FOUND OR NOT EXECUTABLE",
                      ]
                  )
                  continue

              args = [binary, *version_args.get(binary, ["--version"])]
              report.extend(["", f"$ {shlex.join(args)} (from {owners_text})"])
              try:
                  result = subprocess.run(
                      args,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      text=True,
                      errors="replace",
                      timeout=30,
                      check=False,
                  )
                  report.append(f"exit status: {result.returncode}")
                  report.extend((result.stdout or "").rstrip().splitlines())
              except subprocess.TimeoutExpired as error:
                  report.append("timed out after 30 seconds")
                  output = error.stdout or ""
                  if isinstance(output, bytes):
                      output = output.decode(errors="replace")
                  report.extend(output.rstrip().splitlines())
              except OSError as error:
                  report.append(f"could not run version probe: {error}")

          report_path.write_text("\n".join(report) + "\n")
          print(report_path.read_text())
          if not binaries:
              raise SystemExit("No executable files were found in the RPMs.")
          if failures:
              raise SystemExit(
                  "RPM binaries are missing or not executable: "
                  + ", ".join(failures)
              )
        shell: python3 {0}

      - name: Archive RPM version report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: >-
            ${{ format('rpm-binary-versions-okd{0}-el{1}',
            inputs.okd_version, inputs.os_version) }}
          path: rpm-test-report/rpm-versions.txt
          if-no-files-found: error
