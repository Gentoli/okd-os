name: RPM Build Reproduction

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-rpms:
    name: Build ${{ matrix.component.name }} (EL${{ matrix.os_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os_version: [9]
        component:
          - name: kubernetes
            repository: openshift/kubernetes
            ref: master
            build_script: openshift-hack/build-rpms.sh
            spec_file: openshift.spec
          - name: cri-o
            repository: cri-o/cri-o
            ref: main
            build_script: hack/build-rpms.sh
          - name: cri-tools
            repository: kubernetes-sigs/cri-tools
            ref: master
            rpm_spec_template: .github/rpm-specs/cri-tools.spec.in
          - name: oc
            repository: openshift/oc
            ref: main
            spec_file: oc.spec
          - name: conmon-rs
            repository: containers/conmon-rs
            ref: main
            rpm_spec_template: .github/rpm-specs/conmon-rs.spec.in
          - name: crio-credential-provider
            repository: openshift/crio-credential-provider
            ref: main
            spec_file: crio-credential-provider.spec
    container:
      image: quay.io/centos/centos:stream${{ matrix.os_version }}
    steps:
      - name: Install Git and Toolchain
        run: |
          dnf install -y dnf-plugins-core epel-release epel-next-release
          dnf config-manager --set-enabled crb
          dnf makecache
          dnf install -y \
            git \
            rpm-build \
            rsync \
            createrepo \
            gcc \
            gcc-c++ \
            make \
            golang \
            krb5-devel \
            bsdtar \
            systemd \
            cargo \
            findutils

      - name: Checkout RPM Spec Templates
        uses: actions/checkout@v4

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.component.repository }}
          ref: ${{ matrix.component.ref }}
          fetch-depth: 1
          path: source

      - name: Build RPMs
        run: |
          cd "$GITHUB_WORKSPACE/source"
          echo "Starting build for ${{ matrix.component.name }} on CentOS Stream ${{ matrix.os_version }}..."
          
          # Fix git ownership issue in container
          git config --global --add safe.directory "$GITHUB_WORKSPACE/source"
          
          # Generic Metadata Extraction
          # Shallow checkouts may not contain tags, so use a valid fallback.
          COMMIT=$(git rev-parse --short HEAD)
          VERSION_RAW=$(git describe --tags --abbrev=0 2>/dev/null || true)
          VERSION_RAW="${VERSION_RAW#v}"

          if [ "${{ matrix.component.name }}" == "kubernetes" ]; then
            # Override with Kubernetes specialized versioning if possible
            KUBERNETES_VERSION=$(sed -rn 's/.*io.openshift.build.versions="kubernetes=(1\.[0-9]+\.[0-9]+(-rc\.[0-9])?)".*/\1/p' openshift-hack/images/hyperkube/Dockerfile.rhel | head -n 1)
            VERSION_RAW="${KUBERNETES_VERSION:-$VERSION_RAW}"
          elif [ "${{ matrix.component.name }}" == "cri-o" ]; then
            CRIO_VERSION=$(sed -rn 's/^[[:space:]]*var Version = "([^"]+)".*/\1/p' internal/version/version.go | head -n 1)
            VERSION_RAW="${CRIO_VERSION:-$VERSION_RAW}"
          elif [ "${{ matrix.component.name }}" == "conmon-rs" ]; then
            VERSION_RAW=$(sed -n 's/^[[:space:]]*version = "\([^"]*\)".*/\1/p' conmon-rs/common/Cargo.toml | head -n 1 | tr '-' '~')
          fi

          if [ -z "$VERSION_RAW" ]; then
            VERSION_RAW="0.0.1"
          fi

          SPEC="${{ matrix.component.spec_file }}"
          SPEC_TEMPLATE="${{ matrix.component.rpm_spec_template }}"
          if [ -n "$SPEC_TEMPLATE" ]; then
            SPEC="$RUNNER_TEMP/${{ matrix.component.name }}.spec"
            sed "s/@VERSION@/$VERSION_RAW/g" "$GITHUB_WORKSPACE/$SPEC_TEMPLATE" > "$SPEC"
          fi

          VERSION="v${VERSION_RAW}"
          export OS_GIT_VERSION="${VERSION}+${COMMIT}"
          export OS_GIT_COMMIT="${COMMIT}"
          export OS_GIT_MAJOR=$(echo $VERSION_RAW | cut -d. -f1)
          export OS_GIT_MINOR=$(echo $VERSION_RAW | cut -d. -f2)
          export OS_GIT_PATCH=$(echo $VERSION_RAW | cut -d. -f3)
          export OS_GIT_TREE_STATE="dirty"
          
          echo "Build Metadata:"
          echo "  OS_GIT_VERSION: $OS_GIT_VERSION"

          export GOTOOLCHAIN=auto

          # Install goversioninfo (missing in EL9 repos but needed by oc)
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest
          export PATH=$PATH:$(go env GOPATH)/bin

          # Install build dependencies if spec exists
          if [ -n "$SPEC" ]; then
            # Hack for oc: remove goversioninfo dependency if not in repo
            if [ "$SPEC" == "oc.spec" ]; then
              sed -i '/BuildRequires:.*goversioninfo/d' "$SPEC"
            fi
            dnf builddep -y "$SPEC"
          fi

          if [ -n "${{ matrix.component.build_script }}" ]; then
            echo "Using explicit build script: ${{ matrix.component.build_script }}"
            chmod +x "${{ matrix.component.build_script }}"
            ./${{ matrix.component.build_script }}
          elif [ -n "$SPEC" ]; then
            echo "Building RPM from $SPEC..."
            NAME=$(rpmspec -q --qf "%{name}\n" "$SPEC" | head -n 1)
            VERSION_SPEC=$(rpmspec -q --qf "%{version}\n" "$SPEC" | head -n 1)
            SOURCE0=$(rpmspec -P "$SPEC" | sed -n 's/^Source0:[[:space:]]*//p' | head -n 1)
            SOURCE_FILE="${SOURCE0##*/}"
            if [ -z "$SOURCE_FILE" ] || [ "$SOURCE_FILE" == "(none)" ]; then
              echo "Unable to determine source archive name from $SPEC."
              exit 1
            fi
            mkdir -p _rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
            tar -czf "_rpmbuild/SOURCES/${SOURCE_FILE}" \
              --exclude='./.git' \
              --exclude='./_output' \
              --exclude='./_rpmbuild' \
              --transform="s|^.|$NAME-$VERSION_SPEC|" ./
            rpmbuild -ba "$SPEC" \
              --define "_topdir $PWD/_rpmbuild" \
              --define "release 1" \
              --define "commit $COMMIT" \
              --define "os_git_vars OS_GIT_VERSION='$OS_GIT_VERSION' OS_GIT_COMMIT='$OS_GIT_COMMIT' OS_GIT_MAJOR='$OS_GIT_MAJOR' OS_GIT_MINOR='$OS_GIT_MINOR' OS_GIT_TREE_STATE='$OS_GIT_TREE_STATE'"
          elif [ -f "Makefile" ] && make -n rpm >/dev/null 2>&1; then
            echo "Makefile has rpm target, using make rpm..."
            make rpm
          else
            echo "No build script, Makefile rpm target, or .spec file defined."
            exit 1
          fi
          
      - name: Archive RPM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.component.name }}-rpms-el${{ matrix.os_version }}
          path: |
            source/_output/local/releases/rpms/
            source/_output/releases/rpms/
            source/RPMS/
            source/_rpmbuild/RPMS/
          if-no-files-found: warn
