name: Test OKD Stream CoreOS OCI

on:
  workflow_run:
    workflows:
      - Build and Publish OKD Stream CoreOS
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      scos_run_id:
        description: Successful SCOS base workflow run ID for the GHCR QEMU image
        required: true
        type: string
      oci_image_ref:
        description: Full GHCR image pullspec (tag or sha256 digest)
        required: true
        default: ghcr.io/gentoli/stream-coreos:4.22-c9s
        type: string
      release_image:
        description: >-
          Release payload to resolve the upstream stream-coreos image from.
        required: false
        default: ""
        type: string

env:
  DEFAULT_OKD_IMAGE_REF: ghcr.io/gentoli/stream-coreos:4.22-c9s

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: test-okd-stream-coreos-${{ github.event.workflow_run.id || inputs.oci_image_ref }}
  cancel-in-progress: false

jobs:
  kola-pivot:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: quay.io/coreos-assembler/coreos-assembler:latest
      options: >-
        --user 0
        --privileged
        --device /dev/kvm
        --device /dev/fuse
        --tmpfs /tmp
      volumes:
        - /var/tmp:/var/tmp
    steps:
      - name: Prepare COSA container
        run: |
          set -euo pipefail
          if [[ ! -e /dev/kvm ]]; then
            echo "::error::Kola QEMU testing requires /dev/kvm."
            exit 1
          fi

          dnf install -y nodejs curl jq

          kvm_gid=$(stat -c '%g' /dev/kvm)
          if kvm_group=$(getent group "$kvm_gid"); then
            kvm_group=${kvm_group%%:*}
          else
            kvm_group="runner-kvm-${kvm_gid}"
            groupadd --gid "$kvm_gid" "$kvm_group"
          fi
          usermod --append --groups "$kvm_group" builder

      - name: Checkout workflow repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install oc
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "4"

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" |
            skopeo login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Select image references and SCOS base run
        id: test-inputs
        env:
          INPUT_SCOS_RUN_ID: ${{ inputs.scos_run_id }}
          INPUT_OKD_IMAGE_REF: ${{ inputs.oci_image_ref }}
          INPUT_RELEASE_IMAGE: ${{ inputs.release_image }}
          CONFIGURED_SCOS_RUN_ID: ${{ vars.OKD_SCOS_BASE_RUN_ID }}
        run: |
          set -euo pipefail
          latest_release_image() {
            local version=$1
            for page in $(seq 1 20); do
              api_url=https://api.github.com/repos/okd-project/okd/releases
              page_json=$(curl -fsSL \
                --get "$api_url" \
                --data-urlencode per_page=100 \
                --data-urlencode "page=${page}")
              image=$(jq -r --arg version "$version" '
                [
                  .[]
                  | select(.draft == false and .prerelease == false)
                  | select(
                      .tag_name
                      | test("^" + $version + "\\.[0-9]+-okd-scos\\.[0-9]+$")
                    )
                  | (.body
                      | try capture(
                          "Pull From:\\s*(?<image>[^[:space:]]+)"
                        ).image
                      catch ""
                    ) as $image
                  | select(
                      $image
                      | test("^quay\\.io/okd/scos-release@sha256:[0-9a-f]{64}$")
                    )
                  | {image: $image, published_at: .published_at}
                ]
                | sort_by(.published_at)
                | last
                | .image // empty
              ' <<< "$page_json")
              if [[ -n "$image" ]]; then
                printf '%s' "$image"
                return 0
              fi
              if [[ $(jq 'length' <<< "$page_json") -lt 100 ]]; then
                break
              fi
            done
            return 1
          }

          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            scos_run_id="$CONFIGURED_SCOS_RUN_ID"
            oci_image_ref="$DEFAULT_OKD_IMAGE_REF"
            release_version=4.22
            test_version=4.22
            kola_stream=4.22-c9s
            release_image=""
          else
            scos_run_id="$INPUT_SCOS_RUN_ID"
            oci_image_ref="$INPUT_OKD_IMAGE_REF"
            release_image="$INPUT_RELEASE_IMAGE"
            kola_stream=4.22-c9s
            release_version=""
            test_version=4.22
            image_tag_pattern=':([0-9]+\.(20|21|22))-(c9s|c10s)(@sha256:[0-9a-f]{64})?$'
            if [[ "$oci_image_ref" =~ $image_tag_pattern ]]; then
              release_version="${BASH_REMATCH[1]}"
              test_version=$release_version
              kola_stream="${BASH_REMATCH[1]}-${BASH_REMATCH[3]}"
            fi
          fi

          candidate_info=$(skopeo inspect "docker://${oci_image_ref}")
          candidate_release=$(jq -r \
            '.Labels["io.okd.source.release.payload"] // ""' \
            <<< "$candidate_info")
          candidate_version=$(jq -r \
            '.Labels["org.opencontainers.image.version"] // ""' \
            <<< "$candidate_info")
          candidate_base=$(jq -r \
            '.Labels["io.okd.source.base.stream"] // ""' \
            <<< "$candidate_info")
          if [[ "$candidate_version" =~ ^4\.(20|21|22)$ ]]; then
            release_version=$candidate_version
            test_version=$candidate_version
          fi
          base_pattern='^c(9|10)s$'
          if [[ "$candidate_base" =~ $base_pattern &&
            -n "$release_version" ]]; then
            kola_stream="${release_version}-${candidate_base}"
          fi
          if [[ -z "$release_image" ]]; then
            release_image=$candidate_release
          fi

          if [[ -z "$release_image" ]]; then
            if [[ ! "$release_version" =~ ^4\.(20|21|22)$ ]]; then
              echo "Provide a release_image when testing a digest-only" \
                "image ref." >&2
              exit 1
            fi
            release_image=$(latest_release_image "$release_version") || {
              echo "Could not find a stable $release_version OKD release." >&2
              exit 1
            }
          fi

          if [[ ! "$scos_run_id" =~ ^[0-9]{1,20}$ ]]; then
            echo "Set scos_run_id or the OKD_SCOS_BASE_RUN_ID repository variable" \
              "to a successful SCOS base workflow run ID." >&2
            exit 1
          fi
          for image_ref in "$oci_image_ref" "$release_image"; do
            if [[ ! "$image_ref" =~ ^[^[:space:]\|]+$ || "$image_ref" == docker://* ]]; then
              echo "Provide full image pullspecs without whitespace or docker://." >&2
              exit 1
            fi
          done
          release_pattern='^quay\.io/okd/scos-release@sha256:[0-9a-f]{64}$'
          if [[ ! "$release_image" =~ $release_pattern ]]; then
            echo "Expected a digest-pinned OKD SCOS release payload." >&2
            exit 1
          fi
          upstream_image_ref=$(
            oc adm release info --image-for stream-coreos "$release_image"
          )
          if [[ ! "$upstream_image_ref" =~ ^[^[:space:]\|]+$ ||
            "$upstream_image_ref" == docker://* ]]; then
            echo "The release payload did not resolve to a valid" \
              "stream-coreos image." >&2
            exit 1
          fi
          echo "oci_image_ref=$oci_image_ref" >> "$GITHUB_OUTPUT"
          echo "upstream_image_ref=$upstream_image_ref" >> "$GITHUB_OUTPUT"
          echo "scos_run_id=$scos_run_id" >> "$GITHUB_OUTPUT"
          echo "kola_stream=$kola_stream" >> "$GITHUB_OUTPUT"
          echo "test_version=$test_version" >> "$GITHUB_OUTPUT"

      - name: Pull OCI images from registries
        env:
          OKD_IMAGE_REF: ${{ steps.test-inputs.outputs.oci_image_ref }}
          UPSTREAM_IMAGE_REF: ${{ steps.test-inputs.outputs.upstream_image_ref }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/okd-image" "$RUNNER_TEMP/upstream-image"
          for image in \
            "okd|$OKD_IMAGE_REF|$RUNNER_TEMP/okd-image/okd.ociarchive" \
            "upstream|$UPSTREAM_IMAGE_REF|$RUNNER_TEMP/upstream-image/upstream.ociarchive"; do
            IFS='|' read -r label image_ref archive <<< "$image"
            if [[ "$image_ref" == *" "* || "$image_ref" == docker://* ]]; then
              echo "Provide a full image pullspec without the docker:// prefix." >&2
              exit 1
            fi
            skopeo copy --override-arch amd64 \
              "docker://${image_ref}" "oci-archive:${archive}"
            image_info=$(skopeo inspect "oci-archive:${archive}")
            image_arch=$(jq -r '.Architecture' <<< "$image_info")
            image_digest=$(jq -r '.Digest' <<< "$image_info")
            image_version=$(jq -r '.Labels["org.opencontainers.image.version"] // "unknown"' <<< "$image_info")
            if [[ "$image_arch" != "amd64" ]]; then
              echo "Expected an amd64 $label image, got: $image_arch" >&2
              exit 1
            fi
            echo "$label image: $image_ref ($image_digest, version $image_version)"
            sha256sum "$archive"
          done

      - name: Pull SCOS QEMU base image
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          SCOS_RUN_ID: ${{ steps.test-inputs.outputs.scos_run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scos-qemu"
          image_ref="ghcr.io/${IMAGE_OWNER,,}/scos-base:c9s-qemu-${SCOS_RUN_ID}"
          podman pull "$image_ref"
          container_id=$(podman create "$image_ref")
          trap 'podman rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          podman cp \
            "$container_id:/scos-qemu.qcow2" \
            "$RUNNER_TEMP/scos-qemu/scos-qemu.qcow2"
          podman rm "$container_id"
          trap - EXIT

      - name: Checkout matching openshift/os Kola tests
        uses: actions/checkout@v4
        with:
          repository: openshift/os
          ref: release-${{ steps.test-inputs.outputs.test_version }}
          path: openshift-os
          persist-credentials: false

      - name: Validate SCOS QEMU artifact
        run: |
          set -euo pipefail
          mapfile -t images < <(
            find "$RUNNER_TEMP/scos-qemu" -maxdepth 1 -type f \
              -name "*.qcow2" -print
          )
          if (( ${#images[@]} != 1 )); then
            echo "Expected one x86_64 SCOS QEMU artifact," \
              "found ${#images[@]}." >&2
            exit 1
          fi
          chown builder:builder "${images[0]}"
          echo "QEMU_IMAGE=${images[0]}" >> "$GITHUB_ENV"

      - name: Disable Zincati for the Kola pivot
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/disable-zincati.ign" <<'EOF'
          {"ignition":{"version":"3.4.0"},"systemd":{"units":[{"name":"zincati.service","mask":true}]}}
          EOF

      - name: Run openshift-tagged Kola tests against the pivoted image
        env:
          KOLA_STREAM: ${{ steps.test-inputs.outputs.kola_stream }}
        run: |
          set -euo pipefail
          build_dir="$RUNNER_TEMP/kola-workdir"
          mkdir -p "$build_dir/tmp"
          results_dir="$build_dir/tmp/kola-${GITHUB_RUN_ID}"
          if [[ -e "$results_dir" ]]; then
            echo "Kola output directory already exists: $results_dir" >&2
            exit 1
          fi
          mkdir "$results_dir"
          chown -R builder:builder "$build_dir"
          test_status=0
          for image in \
            "okd|$RUNNER_TEMP/okd-image/okd.ociarchive" \
            "upstream|$RUNNER_TEMP/upstream-image/upstream.ociarchive"; do
            IFS='|' read -r label archive <<< "$image"
            image_results_dir="$results_dir/$label"
            if ! runuser -u builder -- env \
              GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
              RUNNER_TEMP="$RUNNER_TEMP" \
              QEMU_IMAGE="$QEMU_IMAGE" \
              KOLA_OUTPUT_DIR="$image_results_dir" \
              OCI_ARCHIVE="$archive" \
              /bin/bash -euo pipefail -c '
                kola \
                  --qemu-image "$QEMU_IMAGE" \
                  run \
                  --output-dir "$KOLA_OUTPUT_DIR" \
                  --platform qemu --distro scos --tag openshift \
                  --denylist-stream "$KOLA_STREAM" \
                  --denylist-test ext.openshift-os.version.rhaos-pkgs-match-openshift \
                  --oscontainer "$OCI_ARCHIVE" \
                  --append-ignition "$RUNNER_TEMP/disable-zincati.ign" \
                  --exttest "$GITHUB_WORKSPACE/openshift-os"
              '; then
              echo "::error::Kola tests failed for the $label image."
              test_status=1
            fi
          done
          exit "$test_status"

      - name: Upload Kola results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: okd-kola-results-${{ github.run_id }}
          path: ${{ runner.temp }}/kola-workdir/tmp/kola-${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 14
