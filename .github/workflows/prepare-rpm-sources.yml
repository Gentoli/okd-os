name: Prepare RPM sources

on:
  workflow_call:
    inputs:
      okd_version:
        description: OKD release version
        required: true
        type: string
      os_version:
        description: CentOS Stream major version
        required: true
        type: string
      project:
        description: RPM project
        required: true
        type: string
      artifact_name:
        description: Unique artifact name for the resolved package source
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-rpm-sources
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      mirrors: ${{ steps.plan.outputs.mirrors }}
      sources: ${{ steps.plan.outputs.sources }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check package source mirror
        id: plan
        uses: actions/github-script@v9
        env:
          GH_REPOSITORY: ${{ github.repository }}
          OKD_VERSION: ${{ inputs.okd_version }}
          OS_VERSION: ${{ inputs.os_version }}
          PROJECT: ${{ inputs.project }}
          PLAN_FILE: rpms/mirror-plan.json
        with:
          script: |
            const { execFileSync } = require("node:child_process");
            const fs = require("node:fs");
            const os = require("node:os");
            const path = require("node:path");

            const plan = JSON.parse(
              fs.readFileSync(process.env.PLAN_FILE, "utf8"),
            );
            const githubUrl = [
              "https://github.com/",
              process.env.GH_REPOSITORY,
              ".git",
            ].join("");
            const mirrorUrl = plan.sources.mirror_url_pattern.replace(
              "{repository}",
              process.env.GH_REPOSITORY,
            );
            const project = process.env.PROJECT;
            const version = process.env.OKD_VERSION;
            const osVersion = process.env.OS_VERSION;

            function git(args, cwd, allowFailure = false) {
              try {
                return execFileSync("git", args, {
                  cwd,
                  encoding: "utf8",
                  stdio: ["ignore", "pipe", "pipe"],
                }).trimEnd();
              } catch (error) {
                if (allowFailure) return "";
                const detail = error.stderr?.toString() ?? error.message;
                throw new Error(
                  `git ${args.join(" ")} failed: ${detail}`,
                );
              }
            }

            function gitSucceeded(args, cwd) {
              try {
                execFileSync("git", args, {
                  cwd,
                  stdio: "ignore",
                });
                return true;
              } catch {
                return false;
              }
            }

            function branchSha(url, branch) {
              const result = execFileSync(
                "git",
                ["ls-remote", "--heads", url, `refs/heads/${branch}`],
                { encoding: "utf8" },
              ).trim();
              return result ? result.split(/\s+/)[0] : "";
            }

            function format(pattern, project, osVersion, version) {
              return pattern
                .replaceAll("{project}", project)
                .replaceAll("{os_version}", osVersion)
                .replaceAll("{okd_version}", version);
            }

            function rpmIdentity(spec) {
              const macros = Object.fromEntries(
                [...spec.matchAll(/^%(?:global|define)\s+(\w+)\s+(\S+)/gm)]
                  .map((match) => [match[1], match[2]]),
              );
              function field(name) {
                const match = spec.match(
                  new RegExp(`^${name}:\\s*(\\S+)`, "m"),
                );
                if (!match) throw new Error(`Spec missing ${name}: field`);
                let value = match[1];
                for (let i = 0; i < 10; i++) {
                  const expanded = value.replace(
                    /%\{(\w+)\}/g,
                    (macro, key) => macros[key] ?? macro,
                  );
                  if (expanded === value) break;
                  value = expanded;
                }
                if (value.includes("%{")) {
                  throw new Error(`Cannot resolve RPM ${name}: ${value}`);
                }
                return value;
              }
              return { name: field("Name"), version: field("Version") };
            }

            function patchId(sourceVersion, packageName, targetVersion) {
              const safe = (value) => value.replace(/[^A-Za-z0-9_.]+/g, "_");
              return `source_${safe(sourceVersion)}` +
                `_package_${safe(packageName)}` +
                `_target_${safe(targetVersion)}`;
            }

            function inspect(row, metadataFile) {
              const temp = fs.mkdtempSync(
                path.join(os.tmpdir(), "rpm-mirror-"),
              );
              try {
                git(["init", "--quiet", temp], temp);
                git(["remote", "add", "upstream", row.source_url], temp);
                git([
                  "fetch", "--quiet", "--no-tags", "upstream",
                  `refs/heads/${row.source_branch}:refs/remotes/upstream/source`,
                ], temp);
                const sourceRef = "refs/remotes/upstream/source";
                const sourceSha = git(["rev-parse", sourceRef], temp);
                const spec = git(["show", `${sourceSha}:${row.spec}`], temp);
                const identity = rpmIdentity(spec);
                git(["remote", "add", "origin", githubUrl], temp);
                const targetSha = branchSha(githubUrl, row.target_branch);
                let missingCommits = [];
                let markerPatchId = "";
                let metadataMissing = false;
                let bootstrapOnly = false;
                let targetSpec = "";
                if (targetSha) {
                  const targetRef = "refs/remotes/origin/mirror";
                  git([
                    "fetch", "--quiet", "--no-tags", "origin",
                    `refs/heads/${row.target_branch}:${targetRef}`,
                  ], temp);
                  const metadataText = git(
                    ["show", `${targetRef}:${metadataFile}`],
                    temp,
                    true,
                  );
                  if (!metadataText) {
                    metadataMissing = true;
                    bootstrapOnly = gitSucceeded([
                      "merge-base", "--is-ancestor", targetRef, sourceRef,
                    ], temp);
                    const messages = git(
                      ["log", "--format=%B%x00", targetRef],
                      temp,
                    ).split("\0");
                    const marker = messages.find((message) =>
                      message.trimStart().startsWith(`PATCH/${row.source_branch}\n`)
                    );
                    markerPatchId =
                      marker?.match(/^Patch-ID:\s*(\S+)/m)?.[1] ?? "";
                    if (!bootstrapOnly && !markerPatchId) {
                      throw new Error(
                        `${row.target_branch} has neither ${metadataFile} ` +
                          "nor a PATCH marker",
                      );
                    }
                  } else {
                    const metadata = JSON.parse(metadataText);
                    const expected = [
                      row.project,
                      String(row.target_el),
                      row.target_version,
                      row.source_url,
                      row.source_branch,
                      row.spec,
                    ];
                    const actual = [
                      metadata.project,
                      String(metadata.target_el),
                      metadata.target_version,
                      metadata.source_url,
                      metadata.source_branch,
                      metadata.spec,
                    ];
                    if (JSON.stringify(actual) !== JSON.stringify(expected)) {
                      throw new Error(
                        `Metadata mismatch on ${row.target_branch}`,
                      );
                    }
                  }
                  missingCommits = git(["cherry", targetRef, sourceRef], temp)
                    .split("\n")
                    .filter((line) => line.startsWith("+ "))
                    .map((line) => line.split(/\s+/)[1]);
                  targetSpec = git(["show", `${targetRef}:${row.spec}`], temp);
                  if (!markerPatchId) {
                    const messages = git(
                      ["log", "--format=%B%x00", targetRef],
                      temp,
                    ).split("\0");
                    const marker = messages.find((message) =>
                      message.trimStart().startsWith(`PATCH/${row.source_branch}\n`)
                    );
                    markerPatchId =
                      marker?.match(/^Patch-ID:\s*(\S+)/m)?.[1] ?? "";
                  }
                }

                const id = patchId(
                  identity.version,
                  identity.name,
                  row.target_version,
                );
                const releases = [
                  ...targetSpec.matchAll(/^Release:\s*(\S+)/gm),
                ].map((match) => match[1]);
                const suffix = `.fallback.${id}`;
                const releasePatched =
                  releases.length === 1 &&
                  (releases[0].match(/\.fallback\./g) ?? []).length === 1 &&
                  releases[0].includes(suffix) &&
                  (!releases[0].includes("%{?dist}") ||
                    releases[0].indexOf(suffix) <
                      releases[0].indexOf("%{?dist}"));
                return {
                  ...row,
                  source_sha: sourceSha,
                  source_version: identity.version,
                  package_name: identity.name,
                  target_exists: Boolean(targetSha),
                  target_sha: targetSha,
                  missing_commits: missingCommits,
                  marker_patch_id: markerPatchId,
                  metadata_missing: metadataMissing,
                  bootstrap_only: bootstrapOnly,
                  release_patched: releasePatched,
                  patch_id: id,
                  needs_sync:
                    !targetSha ||
                    missingCommits.length > 0 ||
                    !markerPatchId ||
                    metadataMissing ||
                    !releasePatched,
                };
              } finally {
                fs.rmSync(temp, { recursive: true, force: true });
              }
            }

            if (!plan.sources.projects.includes(project)) {
              throw new Error(`RPM project is not in the source plan: ${project}`);
            }
            const key = `${version}/el${osVersion}`;
            const allowedTargets = new Set(
              plan.build_targets.map((target) =>
                `${target.okd_version}/el${target.os_version}`,
              ),
            );
            if (!allowedTargets.has(key)) {
              throw new Error(`RPM target is not in the source plan: ${key}`);
            }

            const sourceUrl = plan.sources.upstream_url_pattern.replace(
              "{project}",
              project,
            );
            const sharedPattern =
              plan.sources.shared_branch_patterns?.[project]?.[osVersion];
            const shared = Boolean(sharedPattern);
            const directBranch = format(
              plan.sources.branch_patterns[project][osVersion],
              project,
              osVersion,
              version,
            );
            const targetVersion = shared ? `el${osVersion}` : version;
            const targetBranch = format(
              plan.sources.mirror_branch_patterns[
                shared ? "shared" : "okd_release"
              ],
              project,
              osVersion,
              targetVersion,
            );
            const sources = { [key]: {} };
            let source = null;
            let mirror = null;
            if (!shared && branchSha(sourceUrl, directBranch)) {
              source = { url: sourceUrl, branch: directBranch };
            } else {
              let sourceBranch;
              if (shared) {
                sourceBranch = format(
                  sharedPattern,
                  project,
                  osVersion,
                  version,
                );
                if (!branchSha(sourceUrl, sourceBranch)) {
                  throw new Error(
                    `Missing shared upstream branch ${sourceBranch}`,
                  );
                }
              } else {
                const fallbackPattern =
                  plan.sources.fallback_branch_patterns?.[project]?.[osVersion];
                if (!fallbackPattern) {
                  throw new Error(
                    `No exact source branch or fallback for ${project} ` +
                      `EL${osVersion} OKD ${version}`,
                  );
                }
                sourceBranch = format(
                  fallbackPattern,
                  project,
                  osVersion,
                  version,
                );
                if (!branchSha(sourceUrl, sourceBranch)) {
                  throw new Error(
                    `Missing fallback branch ${sourceBranch}`,
                  );
                }
              }
              mirror = inspect({
                id: shared
                  ? `${project}-el${osVersion}`
                  : `${project}-el${osVersion}-${version}`,
                project,
                target_el: osVersion,
                target_version: targetVersion,
                request_version: version,
                source_url: sourceUrl,
                source_branch: sourceBranch,
                target_branch: targetBranch,
                spec: plan.sources.spec_pattern.replace(
                  "{project}",
                  project,
                ),
              }, plan.sources.metadata_file);
              source = { url: mirrorUrl, branch: targetBranch };
            }
            sources[key][project] = source;
            core.setOutput(
              "mirrors",
              JSON.stringify(mirror?.needs_sync ? [mirror] : []),
            );
            core.setOutput("sources", JSON.stringify(sources));

  sync:
    needs: plan
    if: needs.plan.outputs.mirrors != '[]'
    permissions:
      contents: write
      copilot-requests: write
    uses: ./.github/workflows/sync-rpm-mirror.yml
    with:
      mirrors: ${{ needs.plan.outputs.mirrors }}

  save-sources:
    needs:
      - plan
      - sync
    if: >-
      ${{
        always() &&
        needs.plan.result == 'success' &&
        (needs.sync.result == 'success' || needs.sync.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Save source map
        uses: actions/github-script@v9
        env:
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          SOURCES: ${{ needs.plan.outputs.sources }}
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            fs.writeFileSync(
              path.join(
                process.env.RUNNER_TEMP,
                `${process.env.ARTIFACT_NAME}.json`,
              ),
              `${JSON.stringify(JSON.parse(process.env.SOURCES))}\n`,
            );

      - name: Upload source map
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/${{ inputs.artifact_name }}.json
          if-no-files-found: error
          retention-days: 1
