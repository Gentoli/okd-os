name: Prepare RPM sources

on:
  workflow_call:
    inputs:
      okd_version:
        description: OKD release version
        required: true
        type: string
      os_version:
        description: CentOS Stream major version
        required: true
        type: string
      project:
        description: RPM project
        required: true
        type: string
      artifact_name:
        description: Unique artifact name for the resolved package source
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-rpm-sources
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      mirrors: ${{ steps.plan.outputs.mirrors }}
      sources: ${{ steps.plan.outputs.sources }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check package source mirror
        id: plan
        uses: actions/github-script@v9
        env:
          GH_REPOSITORY: ${{ github.repository }}
          OKD_VERSION: ${{ inputs.okd_version }}
          OS_VERSION: ${{ inputs.os_version }}
          PROJECT: ${{ inputs.project }}
          PLAN_FILE: rpms/mirror-plan.json
        with:
          script: |
            const { execFileSync } = require("node:child_process");
            const fs = require("node:fs");
            const os = require("node:os");
            const path = require("node:path");

            const plan = JSON.parse(fs.readFileSync(process.env.PLAN_FILE, "utf8"));
            const repository = process.env.GH_REPOSITORY;
            const githubUrl = `https://github.com/${repository}.git`;
            const mirrorUrl = plan.sources.mirror_url_pattern.replace(
              "{repository}",
              repository,
            );
            const project = process.env.PROJECT;
            const version = process.env.OKD_VERSION;
            const osVersion = process.env.OS_VERSION;

            function git(args, cwd, allowFailure = false) {
              try {
                return execFileSync("git", args, {
                  cwd,
                  encoding: "utf8",
                  stdio: ["ignore", "pipe", "pipe"],
                }).trimEnd();
              } catch (error) {
                if (allowFailure) return "";
                const detail = error.stderr?.toString() ?? error.message;
                throw new Error(`git ${args.join(" ")} failed: ${detail}`);
              }
            }

            function branchHead(url, branch) {
              const result = git([
                "ls-remote", "--heads", url, `refs/heads/${branch}`,
              ], process.env.GITHUB_WORKSPACE);
              return result ? result.split(/\s+/)[0] : "";
            }

            function branchExists(url, branch) {
              return Boolean(branchHead(url, branch));
            }

            function format(pattern, project, osVersion, version) {
              return pattern
                .replaceAll("{project}", project)
                .replaceAll("{os_version}", osVersion)
                .replaceAll("{okd_version}", version);
            }

            function mirroredSourceSha(branch, metadataFile) {
              const temp = fs.mkdtempSync(path.join(os.tmpdir(), "rpm-mirror-check-"));
              try {
                git(["init", "--quiet", temp], temp);
                git(["remote", "add", "mirror", mirrorUrl], temp);
                git([
                  "fetch", "--quiet", "--no-tags", "mirror",
                  `refs/heads/${branch}:refs/remotes/mirror/source`,
                ], temp);
                const metadata = git([
                  "show", `refs/remotes/mirror/source:${metadataFile}`,
                ], temp, true);
                if (!metadata) return "";
                try {
                  return JSON.parse(metadata).source_sha ?? "";
                } catch {
                  return "";
                }
              } finally {
                fs.rmSync(temp, { recursive: true, force: true });
              }
            }

            if (!plan.sources.projects.includes(project)) {
              throw new Error(`RPM project is not in the source plan: ${project}`);
            }
            const key = `${version}/el${osVersion}`;
            const allowedTargets = new Set(
              plan.build_targets.map((target) =>
                `${target.okd_version}/el${target.os_version}`,
              ),
            );
            if (!allowedTargets.has(key)) {
              throw new Error(`RPM target is not in the source plan: ${key}`);
            }

            const sourceUrl = plan.sources.upstream_url_pattern.replace(
              "{project}",
              project,
            );
            const sharedPattern =
              plan.sources.shared_branch_patterns?.[project]?.[osVersion];
            const shared = Boolean(sharedPattern);
            const directBranch = format(
              plan.sources.branch_patterns[project][osVersion],
              project,
              osVersion,
              version,
            );
            const sources = { [key]: {} };
            let mirror = null;

            if (!shared && branchExists(sourceUrl, directBranch)) {
              sources[key][project] = { url: sourceUrl, branch: directBranch };
            } else {
              let sourceBranch;
              if (shared) {
                sourceBranch = format(sharedPattern, project, osVersion, version);
              } else {
                const fallbackPattern =
                  plan.sources.fallback_branch_patterns?.[project]?.[osVersion];
                if (!fallbackPattern) {
                  throw new Error(
                    `No exact source branch or fallback for ${project} ` +
                      `EL${osVersion} OKD ${version}`,
                  );
                }
                sourceBranch = format(fallbackPattern, project, osVersion, version);
              }
              if (!branchExists(sourceUrl, sourceBranch)) {
                throw new Error(`Missing source branch ${sourceBranch}`);
              }

              const targetVersion = shared ? `el${osVersion}` : version;
              const targetBranch = format(
                plan.sources.mirror_branch_patterns[shared ? "shared" : "okd_release"],
                project,
                osVersion,
                targetVersion,
              );
              const targetExists = branchExists(mirrorUrl, targetBranch);
              const sourceSha = targetExists ? branchHead(sourceUrl, sourceBranch) : "";
              const currentSourceSha = targetExists
                ? mirroredSourceSha(targetBranch, plan.sources.metadata_file)
                : "";
              const needsSync = !targetExists || sourceSha !== currentSourceSha;

              mirror = {
                id: shared
                  ? `${project}-el${osVersion}`
                  : `${project}-el${osVersion}-${version}`,
                project,
                target_el: osVersion,
                target_version: targetVersion,
                request_version: version,
                source_url: sourceUrl,
                source_branch: sourceBranch,
                target_branch: targetBranch,
                spec: plan.sources.spec_pattern.replace("{project}", project),
              };
              sources[key][project] = { url: mirrorUrl, branch: targetBranch };
              core.setOutput("mirrors", JSON.stringify(needsSync ? [mirror] : []));
            }

            if (!mirror) core.setOutput("mirrors", "[]");
            core.setOutput("sources", JSON.stringify(sources));

  sync:
    needs: plan
    if: needs.plan.outputs.mirrors != '[]'
    permissions:
      contents: write
      copilot-requests: write
    uses: ./.github/workflows/sync-rpm-mirror.yml
    with:
      mirrors: ${{ needs.plan.outputs.mirrors }}

  save-sources:
    needs:
      - plan
      - sync
    if: >-
      ${{
        always() &&
        needs.plan.result == 'success' &&
        (needs.sync.result == 'success' || needs.sync.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Save source map
        uses: actions/github-script@v9
        env:
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          SOURCES: ${{ needs.plan.outputs.sources }}
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            fs.writeFileSync(
              path.join(
                process.env.RUNNER_TEMP,
                `${process.env.ARTIFACT_NAME}.json`,
              ),
              `${JSON.stringify(JSON.parse(process.env.SOURCES))}\n`,
            );

      - name: Upload source map
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/${{ inputs.artifact_name }}.json
          if-no-files-found: error
          retention-days: 1
