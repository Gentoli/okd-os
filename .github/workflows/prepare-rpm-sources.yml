name: Prepare RPM sources

on:
  workflow_call:
    inputs:
      okd_version:
        description: OKD release version
        required: true
        type: string
      os_version:
        description: CentOS Stream major version
        required: true
        type: string
      project:
        description: RPM project
        required: true
        type: string
      artifact_name:
        description: Unique artifact name for the resolved package source
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-rpm-sources
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      mirrors: ${{ steps.plan.outputs.mirrors }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check package source mirror
        id: plan
        uses: ./.github/actions/plan-rpm-mirrors
        with:
          repository: ${{ github.repository }}
          targets: >-
            ${{ format('[{{"okd_version":"{0}","os_version":"{1}"}}]',
            inputs.okd_version, inputs.os_version) }}
          project: ${{ inputs.project }}
          plan-file: rpms/mirror-plan.json

  sync:
    needs: plan
    if: needs.plan.outputs.mirrors != '[]'
    permissions:
      contents: write
      copilot-requests: write
    uses: ./.github/workflows/sync-rpm-mirror.yml
    with:
      mirrors: ${{ needs.plan.outputs.mirrors }}

  resolve:
    needs:
      - plan
      - sync
    if: >-
      ${{
        always() &&
        needs.plan.result == 'success' &&
        (needs.sync.result == 'success' || needs.sync.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve package source
        id: resolve
        uses: ./.github/actions/resolve-rpm-sources
        with:
          repository: ${{ github.repository }}
          targets: >-
            ${{ format('[{{"okd_version":"{0}","os_version":"{1}"}}]',
            inputs.okd_version, inputs.os_version) }}
          project: ${{ inputs.project }}
          plan-file: rpms/mirror-plan.json

      - name: Save source map
        uses: actions/github-script@v9
        env:
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          SOURCES: ${{ steps.resolve.outputs.sources }}
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            fs.writeFileSync(
              path.join(
                process.env.RUNNER_TEMP,
                `${process.env.ARTIFACT_NAME}.json`,
              ),
              `${JSON.stringify(JSON.parse(process.env.SOURCES))}\n`,
            );

      - name: Upload source map
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/${{ inputs.artifact_name }}.json
          if-no-files-found: error
          retention-days: 1
