name: Prepare RPM sources

on:
  workflow_call:
    inputs:
      okd_version:
        required: true
        type: string
      os_version:
        required: true
        type: string
      project:
        required: true
        type: string
      artifact_name:
        description: Unique source artifact for this package and target
        required: true
        type: string
    secrets:
      MIRROR_APP_ID:
        description: Client ID of the GitHub App used to push mirrored workflow files
        required: true
      MIRROR_APP_PRIVATE_KEY:
        description: Private key of the GitHub App used to push mirrored workflow files
        required: true

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      mirror: ${{ steps.source.outputs.mirror }}
      sources: ${{ steps.source.outputs.sources }}
    steps:
      - uses: actions/checkout@v4
      - name: Select package source branch
        id: source
        uses: actions/github-script@v9
        env:
          PROJECT: ${{ inputs.project }}
          OKD_VERSION: ${{ inputs.okd_version }}
          OS_VERSION: ${{ inputs.os_version }}
        with:
          script: |
            const { execFileSync } = require("node:child_process");
            const fs = require("node:fs");
            const { sources: rules } = JSON.parse(fs.readFileSync("rpms/mirror-plan.json", "utf8"));
            const project = process.env.PROJECT;
            const version = process.env.OKD_VERSION;
            const el = process.env.OS_VERSION;
            const format = (pattern) => pattern?.replaceAll("{okd_version}", version);
            const url = rules.upstream_url_pattern.replace("{project}", project);
            function exists(branch) {
              try {
                execFileSync("git", ["ls-remote", "--exit-code", "--heads", url, `refs/heads/${branch}`], {
                  stdio: ["ignore", "pipe", "pipe"],
                });
                return true;
              } catch (error) {
                if (error.status === 2) return false;
                throw error;
              }
            }
            if (!rules.projects.includes(project)) throw new Error(`Unknown RPM project: ${project}`);
            const exact = format(rules.branch_patterns[project]?.[el]);
            const shared = format(rules.shared_branch_patterns[project]?.[el]);
            let source;
            let mirror = null;
            if (exact && exists(exact)) {
              source = { url, branch: exact };
            } else if (shared) {
              if (!exists(shared)) throw new Error(`Missing upstream source branch: ${shared}`);
              source = { url, branch: shared };
            } else {
              const base = format(rules.fallback_branch_patterns[project]?.[el]);
              if (!base) throw new Error(`No fallback source for ${project} OKD ${version} EL${el}`);
              if (!exists(base)) throw new Error(`Missing upstream source branch: ${base}`);
              const target = `el${el}-okd${version}`;
              const branch = `rpms/${project}-el${el}-${version}`;
              mirror = {
                project,
                source_url: url,
                source_branch: base,
                target_branch: branch,
                target_el: el,
                target_okd_version: version,
                patch_id: `${project}__${base}__${target}`,
                recipe_file: "docs/module-patch.md",
              };
              source = { url: `https://github.com/${process.env.GITHUB_REPOSITORY}.git`, branch };
            }
            core.setOutput("mirror", mirror ? JSON.stringify(mirror) : "");
            core.setOutput("sources", JSON.stringify({ [`${version}/el${el}`]: { [project]: source } }));

  sync:
    needs: select
    if: needs.select.outputs.mirror != ''
    permissions:
      contents: write
      copilot-requests: write
    uses: ./.github/workflows/sync-repo-mirror.yml
    secrets: inherit
    with:
      mirror: ${{ needs.select.outputs.mirror }}
      repository_instructions: |
        - This mirror is a package source checkout, despite the hosting
          repository's name. Inspect the packaging history, `SPECS`, `SOURCES`,
          and the lookaside `sources` manifest; do not assume the spec is the
          only file involved in compatibility.
        - Preserve source archives and their CentOS lookaside identity. Use
          packaging evidence from comparable target and source branches, and do
          not invent compatibility patches for unaffected packages.

  save-source:
    needs: [select, sync]
    if: >-
      ${{ !cancelled() && needs.select.result == 'success' &&
          (needs.sync.result == 'success' || needs.sync.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Write prepared source map
        uses: actions/github-script@v9
        env:
          SOURCES: ${{ needs.select.outputs.sources }}
        with:
          script: |
            require("node:fs").writeFileSync(`${process.env.RUNNER_TEMP}/rpm-source.json`, process.env.SOURCES + "\n");
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/rpm-source.json
          if-no-files-found: error
          retention-days: 1
