name: Sync source mirror

on:
  workflow_call:
    inputs:
      mirror:
        description: One branch-based source mirror request
        required: true
        type: string

permissions:
  contents: write
  copilot-requests: write

concurrency:
  group: source-mirror-${{ fromJSON(inputs.mirror).target_branch }}
  cancel-in-progress: false
  queue: max

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up remotes and check upstream ancestry
        id: prepare
        uses: actions/github-script@v9
        env:
          MIRROR: ${{ inputs.mirror }}
        with:
          script: |
            const { execFileSync } = require("node:child_process");
            const fs = require("node:fs");
            const path = require("node:path");
            const mirror = JSON.parse(process.env.MIRROR);
            function repositoryPath(value, name, optional = false) {
              if ((value === undefined || value === null || value === "") && optional) {
                return "";
              }
              if (typeof value !== "string" || !value || value.includes("\\") ||
                  value.startsWith("/") || value.split("/").some((part) =>
                    !part || part === "." || part === "..")) {
                throw new Error(`Mirror request has an invalid ${name} path.`);
              }
              return value;
            }
            for (const key of ["project", "source_url", "source_branch", "target_branch"]) {
              if (typeof mirror[key] !== "string" || !mirror[key]) {
                throw new Error(`Mirror request is missing ${key}.`);
              }
            }
            mirror.identity_file = repositoryPath(mirror.identity_file, "identity_file");
            mirror.prompt_file = repositoryPath(mirror.prompt_file, "prompt_file");
            mirror.recipe_file = repositoryPath(mirror.recipe_file, "recipe_file", true);
            mirror.seed_patch = repositoryPath(mirror.seed_patch, "seed_patch", true);
            if (mirror.target_branch.includes("..") ||
                !/^[A-Za-z0-9._/-]+$/.test(mirror.target_branch)) {
              throw new Error("Mirror request has an invalid target_branch.");
            }
            if (mirror.reference_branch &&
                (mirror.reference_branch.includes("..") ||
                 !/^[A-Za-z0-9._/-]+$/.test(mirror.reference_branch))) {
              throw new Error("Mirror request has an invalid reference_branch.");
            }
            const git = (args) => execFileSync("git", args, {
              encoding: "utf8", stdio: ["ignore", "pipe", "pipe"],
            }).trim();
            const mirrorUrl = `https://github.com/${process.env.GITHUB_REPOSITORY}.git`;
            git(["remote", "add", "mirror-upstream", mirror.source_url]);
            git(["remote", "add", "mirror-target", mirrorUrl]);
            let sourceBranch = mirror.source_branch;
            if (sourceBranch === "HEAD") {
              const symbolicHead = git(["ls-remote", "--symref", "mirror-upstream", "HEAD"]);
              const match = symbolicHead.match(/^ref:\s+refs\/heads\/([^\s]+)\s+HEAD$/m);
              if (!match) throw new Error(`Could not resolve the default branch for ${mirror.project}.`);
              sourceBranch = match[1];
            }
            if (sourceBranch.includes("..") ||
                !/^[A-Za-z0-9._/-]+$/.test(sourceBranch)) {
              throw new Error("Mirror request has an invalid source_branch.");
            }
            git(["check-ref-format", "--branch", sourceBranch]);
            git(["check-ref-format", "--branch", mirror.target_branch]);
            if (mirror.reference_branch) {
              git(["check-ref-format", "--branch", mirror.reference_branch]);
            }
            const sourceRef = "refs/remotes/mirror-upstream/base";
            const targetRef = "refs/remotes/mirror-target/target";
            git(["fetch", "--no-tags", "mirror-upstream", `refs/heads/${sourceBranch}:${sourceRef}`]);
            let oldHead = "";
            try {
              git(["ls-remote", "--exit-code", "--heads", "mirror-target", `refs/heads/${mirror.target_branch}`]);
              git(["fetch", "--no-tags", "mirror-target", `refs/heads/${mirror.target_branch}:${targetRef}`]);
              oldHead = git(["rev-parse", targetRef]);
            } catch (error) {
              if (error.status !== 2) throw error;
            }
            if (oldHead) {
              try {
                git(["merge-base", "--is-ancestor", sourceRef, targetRef]);
                core.setOutput("update", "false");
                core.info(`${mirror.target_branch} already incorporates ${sourceBranch}`);
                return;
              } catch (error) {
                if (error.status !== 1) throw error;
              }
            }
            const referenceRef = mirror.reference_branch
              ? "refs/remotes/mirror-upstream/reference"
              : null;
            if (referenceRef) {
              git(["fetch", "--no-tags", "mirror-upstream",
                `refs/heads/${mirror.reference_branch}:${referenceRef}`]);
            }
            const sourceId = sourceBranch.replace(/[^A-Za-z0-9._-]+/g, "-");
            const patchId = mirror.patch_id ||
              `${mirror.project.replace(/[^A-Za-z0-9]+/g, "-")}__${sourceId}__` +
              mirror.target_branch.replace(/[^A-Za-z0-9._-]+/g, "-");
            if (!/^[A-Za-z0-9._-]+$/.test(patchId)) {
              throw new Error("Mirror request has an invalid patch_id.");
            }
            mirror.patch_id = patchId;
            mirror.source_branch = sourceBranch;
            git(["config", "user.name", "Source Mirror Maintainer"]);
            git(["config", "user.email", "source-mirror-maintainer@users.noreply.github.com"]);
            git(["config", "commit.gpgsign", "false"]);
            const worktree = path.join(process.env.RUNNER_TEMP, "source-mirror");
            git(["worktree", "add", "--detach", worktree, oldHead ? targetRef : sourceRef]);
            const mirrorContext = {
              ...mirror,
              source_ref: sourceRef,
              target_ref: oldHead ? targetRef : null,
              reference_ref: referenceRef,
              worktree,
              patch_id: patchId,
            };
            fs.writeFileSync(
              path.join(process.env.RUNNER_TEMP, "source-mirror-context.json"),
              JSON.stringify(mirrorContext, null, 2) + "\n"
            );
            core.setOutput("worktree", worktree);
            core.setOutput("old_head", oldHead);
            const safeTarget = mirror.target_branch.replace(/[^A-Za-z0-9._-]+/g, "-");
            core.setOutput("staging_branch", `source-publish/${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}-${safeTarget}`);
            core.setOutput("update", "true");

      - name: Set up Node.js for Copilot CLI
        if: steps.prepare.outputs.update == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Copilot CLI
        if: steps.prepare.outputs.update == 'true'
        run: npm install --global @github/copilot@1.0.91

      - name: Maintain mirror with Copilot
        id: agent
        if: steps.prepare.outputs.update == 'true'
        uses: actions/github-script@v9
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKTREE: ${{ steps.prepare.outputs.worktree }}
        with:
          script: |
            const { spawn } = require("node:child_process");
            const fs = require("node:fs");
            const path = require("node:path");
            const workspace = fs.realpathSync(process.env.GITHUB_WORKSPACE);
            const read = (file) => {
              const resolved = fs.realpathSync(path.resolve(workspace, file));
              const relative = path.relative(workspace, resolved);
              if (!relative || relative === ".." || relative.startsWith(`..${path.sep}`) ||
                  path.isAbsolute(relative)) {
                throw new Error(`Mirror request path escapes the workflow repository: ${file}`);
              }
              return fs.readFileSync(resolved, "utf8");
            };
            const runContext = JSON.parse(
              fs.readFileSync(`${process.env.RUNNER_TEMP}/source-mirror-context.json`, "utf8")
            );
            const recipe = runContext.recipe_file
              ? `\n\nRecipe:\n${read(runContext.recipe_file)}`
              : "";
            const seedPatch = runContext.seed_patch
              ? `\n\nBootstrap patch:\n${runContext.seed_patch}`
              : "";
            const prompt = read(runContext.prompt_file) + recipe + seedPatch +
              "\n\nRun context:\n" + JSON.stringify(runContext, null, 2);
            let output = "";
            await new Promise((resolve, reject) => {
              const child = spawn("copilot", ["-p", prompt, "--model", "gpt-6-luna",
                "--allow-tool=write", "--allow-tool=shell", "--no-auto-update", "-s"], {
                cwd: process.env.WORKTREE, stdio: ["ignore", "pipe", "inherit"],
              });
              child.stdout.on("data", (chunk) => { output += chunk.toString(); process.stdout.write(chunk); });
              child.on("error", reject);
              child.on("close", (code) => code === 0 ? resolve() : reject(new Error(`Copilot exited ${code}`)));
            });
            const report = output.match(/^COMMIT_OIDS:[ \t]*(.+?)[ \t]*\r?$/m);
            // Accept literal brackets copied from the former optional-ID example.
            const ids = report?.[1].replace(/\[([0-9a-f]{40}(?:[ \t]+[0-9a-f]{40})*)\]/g, "$1");
            if (!ids || !/^(NONE|[0-9a-f]{40}(?:[ \t]+[0-9a-f]{40})*)$/.test(ids)) {
              throw new Error("Copilot must report COMMIT_OIDS: <ordered IDs> or COMMIT_OIDS: NONE");
            }
            if (ids === "NONE") throw new Error("This mirror needs an update; report the identity commit even if no compatibility changes are needed");
            const commits = ids.split(/\s+/);
            core.setOutput("commits", commits.join(" "));

      - name: Seed temporary publishing branch
        id: stage
        if: steps.agent.outputs.commits != ''
        uses: actions/github-script@v9
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKTREE: ${{ steps.prepare.outputs.worktree }}
          COMMITS: ${{ steps.agent.outputs.commits }}
          STAGING_BRANCH: ${{ steps.prepare.outputs.staging_branch }}
        with:
          script: |
            const { execFileSync } = require("node:child_process");
            const git = (args) => execFileSync("git", args, {
              cwd: process.env.WORKTREE, encoding: "utf8", stdio: ["ignore", "pipe", "pipe"],
            }).trim();
            const commits = process.env.COMMITS.split(" ");
            const base = git(["rev-parse", `${commits[0]}^`]);
            const head = commits.at(-1);
            const auth = Buffer.from(`x-access-token:${process.env.GITHUB_TOKEN}`).toString("base64");
            core.setSecret(auth);
            git(["-c", `http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}`,
              "push", "mirror-target", `${base}:refs/heads/${process.env.STAGING_BRANCH}`]);
            core.setOutput("revision", `${base}..${head}`);

      - name: Sign agent-created patch commits
        id: sign
        if: steps.agent.outputs.commits != ''
        uses: pgaskin/push-signed-commits@v1.2.1
        with:
          path: ${{ steps.prepare.outputs.worktree }}
          repository: ${{ github.repository }}
          branch: ${{ steps.prepare.outputs.staging_branch }}
          revision: ${{ steps.stage.outputs.revision }}
          github-token: ${{ github.token }}

      - name: Publish signed mirror with a lease
        if: steps.agent.outputs.commits != ''
        uses: actions/github-script@v9
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MIRROR: ${{ inputs.mirror }}
          WORKTREE: ${{ steps.prepare.outputs.worktree }}
          OLD_HEAD: ${{ steps.prepare.outputs.old_head }}
          STAGING_BRANCH: ${{ steps.prepare.outputs.staging_branch }}
          SIGNED_HEAD: ${{ steps.sign.outputs.pushed-oid }}
        with:
          script: |
            const { execFileSync } = require("node:child_process");
            const mirror = JSON.parse(process.env.MIRROR);
            const auth = Buffer.from(`x-access-token:${process.env.GITHUB_TOKEN}`).toString("base64");
            core.setSecret(auth);
            const git = (args) => execFileSync("git", ["-c",
              `http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}`, ...args], {
              cwd: process.env.WORKTREE, stdio: ["ignore", "pipe", "pipe"],
            });
            git(["fetch", "--no-tags", "mirror-target", `refs/heads/${process.env.STAGING_BRANCH}`]);
            git(["push", `--force-with-lease=refs/heads/${mirror.target_branch}:${process.env.OLD_HEAD}`,
              "mirror-target", `${process.env.SIGNED_HEAD}:refs/heads/${mirror.target_branch}`]);
            core.info(`Published ${mirror.target_branch} at ${process.env.SIGNED_HEAD}`);

      - name: Remove temporary publishing branch
        if: ${{ always() && steps.agent.outputs.commits != '' }}
        uses: actions/github-script@v9
        env:
          STAGING_BRANCH: ${{ steps.prepare.outputs.staging_branch }}
        with:
          script: |
            try {
              await github.rest.git.deleteRef({ ...context.repo, ref: `heads/${process.env.STAGING_BRANCH}` });
            } catch (error) {
              if (error.status !== 404 && error.status !== 422) throw error;
            }
