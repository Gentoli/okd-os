name: Resolve RPM sources
description: Resolve and validate SIG RPM sources for one or more targets
inputs:
  repository:
    description: Repository containing RPM mirror branches
    required: true
  targets:
    description: JSON array containing one OKD version and OS version target
    required: true
  project:
    description: RPM project to resolve
    required: true
  plan-file:
    description: Path to the RPM source plan
    required: false
    default: rpms/mirror-plan.json
outputs:
  sources:
    description: JSON source map keyed by OKD version and EL
    value: ${{ steps.resolve.outputs.sources }}
runs:
  using: composite
  steps:
    - uses: actions/github-script@v9
      id: resolve
      env:
        GH_REPOSITORY: ${{ inputs.repository }}
        RPM_TARGETS: ${{ inputs.targets }}
        PROJECT: ${{ inputs.project }}
        PLAN_FILE: ${{ inputs.plan-file }}
      with:
        script: |
          const { execFileSync } = require("node:child_process");
          const fs = require("node:fs");
          const os = require("node:os");
          const path = require("node:path");

          const plan = JSON.parse(fs.readFileSync(process.env.PLAN_FILE, "utf8"));
          const targets = JSON.parse(process.env.RPM_TARGETS);
          const sources = {};
          const project = process.env.PROJECT;
          if (!plan.sources.projects.includes(project)) {
            throw new Error(`RPM project is not in the source plan: ${project}`);
          }
          if (!Array.isArray(targets) || targets.length !== 1) {
            throw new Error("Source resolution requires exactly one RPM target.");
          }

          function git(args, cwd, allowFailure = false) {
            try {
              return execFileSync("git", args, {
                cwd,
                encoding: "utf8",
                stdio: ["ignore", "pipe", "pipe"],
              }).trimEnd();
            } catch (error) {
              if (allowFailure) return "";
              throw new Error(
                `git ${args.join(" ")} failed: ${error.stderr?.toString() ?? error.message}`,
              );
            }
          }

          function branchSha(url, branch) {
            const result = execFileSync(
              "git",
              ["ls-remote", "--heads", url, `refs/heads/${branch}`],
              { encoding: "utf8" },
            ).trim();
            return result ? result.split(/\s+/)[0] : "";
          }

          function format(pattern, project, osVersion, version) {
            return pattern
              .replaceAll("{project}", project)
              .replaceAll("{os_version}", osVersion)
              .replaceAll("{okd_version}", version);
          }

          function identity(spec) {
            const macros = Object.fromEntries(
              [...spec.matchAll(/^%(?:global|define)\s+(\w+)\s+(\S+)/gm)]
                .map((match) => [match[1], match[2]]),
            );
            function field(name) {
              const match = spec.match(new RegExp(`^${name}:\\s*(\\S+)`, "m"));
              if (!match) throw new Error(`Spec missing ${name}: field`);
              let value = match[1];
              for (let i = 0; i < 10; i++) {
                const expanded = value.replace(
                  /%\{(\w+)\}/g,
                  (macro, key) => macros[key] ?? macro,
                );
                if (expanded === value) break;
                value = expanded;
              }
              if (value.includes("%{")) {
                throw new Error(`Cannot resolve RPM ${name}: ${value}`);
              }
              return value;
            }
            return { package: field("Name"), version: field("Version") };
          }

          function validateMirror(row, mirrorUrl, metadataFile) {
            const temp = fs.mkdtempSync(path.join(os.tmpdir(), "rpm-source-"));
            try {
              git(["init", "--quiet", temp], temp);
              git(["remote", "add", "upstream", row.source_url], temp);
              git([
                "fetch", "--quiet", "--no-tags", "upstream",
                `refs/heads/${row.source_branch}:refs/remotes/upstream/source`,
              ], temp);
              git(["remote", "add", "origin", mirrorUrl], temp);
              git([
                "fetch", "--quiet", "--no-tags", "origin",
                `refs/heads/${row.target_branch}:refs/remotes/origin/mirror`,
              ], temp);
              const sourceRef = "refs/remotes/upstream/source";
              const mirrorRef = "refs/remotes/origin/mirror";
              const metadata = JSON.parse(
                git(["show", `${mirrorRef}:${metadataFile}`], temp),
              );
              const expected = [
                row.project,
                String(row.target_el),
                row.target_version,
                row.source_url,
                row.source_branch,
                row.spec,
              ];
              const actual = [
                metadata.project,
                String(metadata.target_el),
                metadata.target_version,
                metadata.source_url,
                metadata.source_branch,
                metadata.spec,
              ];
              if (JSON.stringify(actual) !== JSON.stringify(expected)) {
                throw new Error(`Mirror metadata mismatch on ${row.target_branch}`);
              }
              const missing = git(["cherry", mirrorRef, sourceRef], temp)
                .split("\n")
                .filter((line) => line.startsWith("+ "));
              const sourceSha = git(["rev-parse", sourceRef], temp);
              const specText = git(
                ["show", `${sourceSha}:${row.spec}`],
                temp,
              );
              const rpm = identity(specText);
              const targetSpec = git(
                ["show", `${mirrorRef}:${row.spec}`],
                temp,
              );
              const patchId = `source_${rpm.version.replace(
                /[^A-Za-z0-9_.]+/g, "_",
              )}_package_${rpm.package.replace(
                /[^A-Za-z0-9_.]+/g, "_",
              )}_target_${row.target_version.replace(
                /[^A-Za-z0-9_.]+/g, "_",
              )}`;
              const messages = git(
                ["log", "--format=%B%x00", mirrorRef],
                temp,
              ).split("\0");
              const marker = messages.find((message) =>
                message.trimStart().startsWith(`PATCH/${row.source_branch}\n`)
              );
              const markerId = marker?.match(/^Patch-ID:\s*(\S+)/m)?.[1] ?? "";
              const release = [
                ...targetSpec.matchAll(/^Release:\s*(\S+)/gm),
              ].map((match) => match[1]);
              const suffix = `.fallback.${patchId}`;
              const releasePatched =
                release.length === 1 &&
                (release[0].match(/\.fallback\./g) ?? []).length === 1 &&
                release[0].includes(suffix) &&
                (!release[0].includes("%{?dist}") ||
                  release[0].indexOf(suffix) <
                    release[0].indexOf("%{?dist}"));
              if (missing.length || !markerId || !releasePatched) {
                throw new Error(
                  `RPM mirror ${row.target_branch} is stale; rerun source preparation.`,
                );
              }
            } finally {
              fs.rmSync(temp, { recursive: true, force: true });
            }
          }

          const mirrorUrl = plan.sources.mirror_url_pattern.replace(
            "{repository}",
            process.env.GH_REPOSITORY,
          );
          for (const target of targets) {
            const version = target.okd_version;
            const osVersion = String(target.os_version);
            const result = {};
            const upstreamUrl = plan.sources.upstream_url_pattern.replace(
              "{project}",
              project,
            );
            const sourcePattern =
              plan.sources.branch_patterns[project][osVersion];
            const sourceBranch = format(
              sourcePattern,
              project,
              osVersion,
              version,
            );
            const sharedPattern =
              plan.sources.shared_branch_patterns?.[project]?.[osVersion];
            const shared = Boolean(sharedPattern);
            const requestedBranch = shared
              ? format(sharedPattern, project, osVersion, version)
              : sourceBranch;
            const exactAvailable =
              !shared && Boolean(branchSha(upstreamUrl, sourceBranch));
            if (exactAvailable) {
              result[project] = {
                url: upstreamUrl,
                branch: sourceBranch,
              };
              sources[`${version}/el${osVersion}`] = result;
              continue;
            }
            const fallbackPattern =
              plan.sources.fallback_branch_patterns?.[project]?.[osVersion];
            if (!shared && !fallbackPattern) {
              throw new Error(
                `Missing ${project} source for OKD ${version} EL${osVersion}.`,
              );
            }
            const mirrorBranch = format(
              plan.sources.mirror_branch_patterns[
                shared ? "shared" : "okd_release"
              ],
              project,
              osVersion,
              shared ? `el${osVersion}` : version,
            );
            const targetVersion = shared ? `el${osVersion}` : version;
            const row = {
              project,
              target_el: osVersion,
              target_version: targetVersion,
              source_url: upstreamUrl,
              source_branch: shared
                ? requestedBranch
                : format(fallbackPattern, project, osVersion, version),
              target_branch: mirrorBranch,
              spec: plan.sources.spec_pattern.replace(
                "{project}",
                project,
              ),
            };
            if (!branchSha(upstreamUrl, row.source_branch)) {
              throw new Error(
                `Missing mirror base branch ${row.source_branch}.`,
              );
            }
            if (!branchSha(mirrorUrl, mirrorBranch)) {
              throw new Error(
                `RPM mirror ${mirrorBranch} is missing; prepare RPM sources.`,
              );
            }
            validateMirror(row, mirrorUrl, plan.sources.metadata_file);
            result[project] = {
              url: mirrorUrl,
              branch: mirrorBranch,
            };
            sources[`${version}/el${osVersion}`] = result;
          }
          core.setOutput("sources", JSON.stringify(sources));
