name: Collect RPM sources
description: Collect the successful package source artifacts from a caller matrix
outputs:
  sources:
    description: Source maps keyed by OKD version and EL
    value: ${{ steps.collect.outputs.sources }}
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4.1.3
      with:
        pattern: rpm-source-*
        path: ${{ runner.temp }}/rpm-sources
    - name: Combine prepared package sources
      id: collect
      uses: actions/github-script@v9
      env:
        SOURCE_DIR: ${{ runner.temp }}/rpm-sources
      with:
        script: |
          const fs = require("node:fs");
          const path = require("node:path");
          const sources = {};
          for (const artifact of fs.readdirSync(process.env.SOURCE_DIR)) {
            const partial = JSON.parse(fs.readFileSync(path.join(process.env.SOURCE_DIR, artifact, "rpm-source.json"), "utf8"));
            for (const [target, packages] of Object.entries(partial)) {
              sources[target] ??= {};
              for (const [project, source] of Object.entries(packages)) {
                if (sources[target][project]) throw new Error(`Duplicate prepared source: ${target}/${project}`);
                sources[target][project] = source;
              }
            }
          }
          core.setOutput("sources", JSON.stringify(sources));
